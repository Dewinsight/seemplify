# Seemplify Chat (powered by Rocket.Chat) + MongoDB
# Based on https://github.com/RocketChat/rocketchat-compose
# Use with: docker compose up -d

services:
  mongodb:
    image: docker.io/mongodb/mongodb-community-server:${MONGODB_VERSION:-8.2}-ubi8
    restart: always
    volumes:
      - mongodb_data:/data/db
    environment:
      MONGODB_REPLICA_SET_NAME: rs0
    command: mongod --replSet rs0 --bind_ip_all
    healthcheck:
      test: ["CMD", "mongosh", "mongodb://localhost:27017", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  mongodb-init:
    image: docker.io/mongodb/mongodb-community-server:${MONGODB_VERSION:-8.2}-ubi8
    restart: on-failure
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      MONGODB_URI: mongodb://mongodb:27017/?directConnection=true
      MONGODB_REPLICA_SET_NAME: rs0
    entrypoint: |
      sh -ec '
      echo "=====> Checking replica set rs0...";
      if mongosh "$$MONGODB_URI" --quiet --eval "rs.status().ok" 2>/dev/null | grep -q "1"; then
        echo "=====> Replica set already initiated, skipping...";
        exit 0;
      else
        echo "=====> Initiating replica set rs0...";
        mongosh "$$MONGODB_URI" --eval "rs.initiate({_id: \"$$MONGODB_REPLICA_SET_NAME\", members: [{ _id: 0, host: \"mongodb:27017\" }]})" || true;
        echo "=====> Replica set initiated.";
      fi
      '

  rocketchat:
    image: ${IMAGE:-registry.rocket.chat/rocketchat/rocket.chat}:${RELEASE:-8.0.1}
    restart: always
    depends_on:
      mongodb:
        condition: service_healthy
      mongodb-init:
        condition: service_completed_successfully
    networks:
      - default
      - dokploy-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.seemplify-chat.rule=Host(`chat.seemplifyai.com`)"
      - "traefik.http.routers.seemplify-chat.entrypoints=websecure"
      - "traefik.http.routers.seemplify-chat.tls=true"
      - "traefik.http.routers.seemplify-chat.tls.certresolver=letsencrypt"
      - "traefik.http.services.seemplify-chat.loadbalancer.server.port=3000"
      - "traefik.docker.network=dokploy-network"
    environment:
      ROOT_URL: ${ROOT_URL:-http://localhost:3000}
      PORT: 3000
      DEPLOY_METHOD: docker
      DEPLOY_PLATFORM: compose
      MONGO_URL: mongodb://mongodb:27017/rocketchat?replicaSet=rs0
      REG_TOKEN: ${REG_TOKEN:-}
      # Seemplify Chat Branding
      OVERWRITE_SETTING_Site_Name: ${SITE_NAME:-Seemplify Chat}
      OVERWRITE_SETTING_Site_Url: ${ROOT_URL:-http://localhost:3000}
      OVERWRITE_SETTING_Organization_Name: ${ORGANIZATION_NAME:-Seemplify}
      OVERWRITE_SETTING_Organization_Email: ${ORGANIZATION_EMAIL:-support@seemplifyai.com}
      OVERWRITE_SETTING_Show_Setup_Wizard: ${SHOW_SETUP_WIZARD:-completed}
      # Brevo SMTP (same credentials as IDP – from Identityprovider env + access/BREVO-CONFIGURATION.md)
      OVERWRITE_SETTING_SMTP_Host: ${BREVO_SMTP_HOST:-smtp-relay.brevo.com}
      OVERWRITE_SETTING_SMTP_Port: ${BREVO_SMTP_PORT:-587}
      OVERWRITE_SETTING_SMTP_Username: ${BREVO_SMTP_USER:-}
      OVERWRITE_SETTING_SMTP_Password: ${BREVO_SMTP_PASS:-}
      OVERWRITE_SETTING_From_Email: ${BREVO_FROM_EMAIL:-no-reply@seemplifyai.com}
      OVERWRITE_SETTING_From_Name: ${BREVO_FROM_NAME:-Seemplify Chat}
      # Jitsi Video Conferencing
      OVERWRITE_SETTING_Jitsi_Enabled: ${JITSI_ENABLED:-true}
      OVERWRITE_SETTING_Jitsi_Domain: ${JITSI_DOMAIN:-meet.jit.si}
      OVERWRITE_SETTING_Jitsi_URL_Room_Prefix: ${JITSI_ROOM_PREFIX:-SeemplifyChat}
      OVERWRITE_SETTING_Jitsi_Open_New_Window: ${JITSI_NEW_WINDOW:-false}
      # Custom CSS to hide Rocket.Chat branding
      OVERWRITE_SETTING_CSS: |
        /* Hide Rocket.Chat logo/branding in footer */
        a[href*="rocket.chat"],
        a[href="https://rocket.chat"],
        .rcx-box--with-inline-elements > a[href]:has(svg),
        footer a[href*="rocket.chat"],
        .sidebar-footer a[href*="rocket.chat"],
        [data-qa="sidebar-footer"] a,
        .rcx-sidebar-footer a {
          display: none !important;
        }
        
        /* Hide "Powered by" text if present */
        .powered-by,
        .rcx-sidebar-footer__watermark,
        [class*="watermark"],
        [class*="PoweredBy"] {
          display: none !important;
        }
    entrypoint: sh
    command:
      - -c
      - |
        echo "=====> Waiting for MongoDB to be ready...";
        for i in $(seq 1 60); do
          if nc -z mongodb 27017 >/dev/null 2>&1; then
            echo "=====> MongoDB is up - starting Rocket.Chat";
            exec node main.js;
          fi;
          echo "=====> MongoDB not ready yet, retrying in 5 seconds...";
          sleep 5;
        done;
        echo "=====> Giving up waiting for MongoDB";
        exit 1
    ports:
      - "${HOST_PORT:-3000}:3000"

volumes:
  mongodb_data:

networks:
  default:
    name: ${COMPOSE_PROJECT_NAME}_default
  dokploy-network:
    external: true
