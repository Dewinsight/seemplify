name: Ensure Recruiter AI Runtime Security

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  configure:
    name: Ensure production security secrets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure missing AI Runtime secrets
        run: node recruiter/backend/scripts/dokployEnsureAIRuntimeEnv.js
        env:
          DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
          DOKPLOY_TOKEN: ${{ secrets.DOKPLOY_TOKEN }}
          RECRUITER_BACKEND_APP_ID: ${{ secrets.RECRUITER_BACKEND_APP_ID }}
          LOCAL_LLM_BASE_URL: https://cv-llm.aiinnigeria.com
          LOCAL_LLM_SHARED_SECRET: ${{ secrets.LOCAL_LLM_SHARED_SECRET }}
          CV_STATUS_TOKEN_SECRET: ${{ secrets.CV_STATUS_TOKEN_SECRET }}
          CV_ANALYSIS_QUEUE_CONCURRENCY: "1"
          AI_USAGE_OUTBOX_ENABLED: "true"
          AI_USAGE_REDIS_HOST: dokploy-redis
