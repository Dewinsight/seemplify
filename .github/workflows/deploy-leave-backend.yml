# Deploy Leave Management Backend to Dokploy
name: Deploy Leave Backend

on:
  push:
    branches: [main]
    paths:
      - 'leave-management/backend/**'
      - '.github/workflows/deploy-leave-backend.yml'
  workflow_dispatch:

env:
  APP_NAME: leave-backend
  APP_PATH: leave-management/backend

jobs:
  deploy:
    name: Deploy to Dokploy
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Trigger Dokploy Deployment
        run: |
          response=$(curl -s -w "%{http_code}" -o /tmp/response.txt -X POST "${{ secrets.DOKPLOY_URL }}/api/application.deploy" \
            -H "x-api-key: ${{ secrets.DOKPLOY_TOKEN }}" \
            -H "Content-Type: application/json" \
            -H "accept: application/json" \
            -d '{"applicationId": "${{ secrets.LEAVE_BACKEND_APP_ID }}"}')
          
          if [ "$response" -eq 200 ]; then
            echo "✅ ${{ env.APP_NAME }} deployment triggered successfully (HTTP $response)"
            cat /tmp/response.txt 2>/dev/null || true
          else
            echo "❌ Deployment failed with HTTP status code: $response"
            cat /tmp/response.txt 2>/dev/null || true
            exit 1
          fi

      - name: Verify production health
        run: |
          set -euo pipefail
          # Dokploy returns as soon as the deployment is queued. Give the new
          # task time to replace the old one before evaluating public health.
          sleep 30
          for attempt in $(seq 1 24); do
            status="$(curl -sS -o /tmp/leave-health.json -w '%{http_code}' \
              --max-time 10 https://api-leave.seemplifyai.com/health || true)"
            echo "attempt=$attempt status=$status"
            if [ "$status" = 200 ]; then
              cat /tmp/leave-health.json
              exit 0
            fi
            sleep 5
          done
          echo "Leave backend failed its post-deployment health check." >&2
          exit 1
