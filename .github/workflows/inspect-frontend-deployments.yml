name: Inspect Frontend Deployments

on:
  workflow_dispatch:
    inputs:
      clean_unused_images:
        description: Remove Docker images not used by running containers before inspection
        required: false
        default: false
        type: boolean

jobs:
  cleanup:
    name: Clean unused Docker images
    if: ${{ inputs.clean_unused_images }}
    runs-on: ubuntu-latest
    steps:
      - name: Run Dokploy image cleanup
        env:
          DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
          DOKPLOY_TOKEN: ${{ secrets.DOKPLOY_TOKEN }}
        run: |
          curl -fsS -X POST \
            -H "x-api-key: ${DOKPLOY_TOKEN}" \
            -H "Content-Type: application/json" \
            -H "accept: application/json" \
            -d '{}' \
            "${DOKPLOY_URL%/}/api/settings.cleanUnusedImages"

  inspect:
    name: Inspect ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: identity-provider
            app_id_secret: IDENTITY_PROVIDER_APP_ID
          - name: payroll-frontend
            app_id_secret: PAYROLL_FRONTEND_APP_ID
          - name: leave-frontend
            app_id_secret: LEAVE_FRONTEND_APP_ID
          - name: time-attendance-frontend
            app_id_secret: TIME_ATTENDANCE_FRONTEND_APP_ID
          - name: performance-frontend
            app_id_secret: PERFORMANCE_FRONTEND_APP_ID

    steps:
      - name: Read safe Dokploy status
        env:
          DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
          DOKPLOY_TOKEN: ${{ secrets.DOKPLOY_TOKEN }}
          APP_ID: ${{ secrets[matrix.app_id_secret] }}
        run: |
          response=$(curl -fsS \
            -H "x-api-key: ${DOKPLOY_TOKEN}" \
            -H "accept: application/json" \
            "${DOKPLOY_URL%/}/api/application.one?applicationId=${APP_ID}")

          printf '%s' "$response" | jq '{
            name,
            status,
            applicationStatus,
            buildType,
            sourceType,
            branch,
            buildPath,
            updatedAt,
            deployments: ((.deployments // []) | sort_by(.createdAt) | reverse | map({
              deploymentId,
              status,
              createdAt,
              updatedAt,
              errorMessage
            }) | .[0:5])
          }'

          latest_deployment=$(printf '%s' "$response" | jq -r '(.deployments // []) | sort_by(.createdAt) | reverse | .[0].deploymentId // empty')
          if [ -n "$latest_deployment" ]; then
            echo "Sanitized latest deployment errors:"
            curl -fsS -G \
              -H "x-api-key: ${DOKPLOY_TOKEN}" \
              -H "accept: application/json" \
              --data-urlencode "deploymentId=${latest_deployment}" \
              --data-urlencode "tail=400" \
              "${DOKPLOY_URL%/}/api/deployment.readLogs" \
              | jq -r '.. | strings' \
              | grep -Ei 'error|failed|fatal|exception|cannot|not found|enoent|npm err|build failed|type error' \
              | sed -E 's#(https?|ssh|git)://[^[:space:]]+#\1://[redacted]#g; s#(token|secret|password|authorization|api[_-]?key)[=: ]+[^[:space:]]+#\1=[redacted]#Ig' \
              | tail -80 \
              || true
          fi
