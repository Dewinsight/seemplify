# Deploy Both Approver Backend and Frontend
# Triggers on any change to approver/ directory (excluding specific backend/frontend paths)
# This is optional - the separate workflows (deploy-approver-backend.yml and deploy-approver-frontend.yml)
# will also trigger on their specific paths

name: Deploy Approver Both

on:
  push:
    branches: [main]
    paths:
      - 'approver/**'
      - '.github/workflows/deploy-approver-both.yml'
  workflow_dispatch:

jobs:
  deploy-backend:
    name: Deploy Backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Trigger Dokploy Deployment (Backend)
        run: |
          response=$(curl -s -w "%{http_code}" -o /tmp/response.txt -X POST "${{ secrets.DOKPLOY_URL }}/api/application.deploy" \
            -H "x-api-key: ${{ secrets.DOKPLOY_TOKEN }}" \
            -H "Content-Type: application/json" \
            -H "accept: application/json" \
            -d '{"applicationId": "${{ secrets.APPROVER_BACKEND_APP_ID }}"}')
          
          if [ "$response" -eq 200 ]; then
            echo "✅ approver-backend deployment triggered successfully (HTTP $response)"
            cat /tmp/response.txt 2>/dev/null || true
          else
            echo "❌ Backend deployment failed with HTTP status code: $response"
            cat /tmp/response.txt 2>/dev/null || true
            exit 1
          fi

  deploy-frontend:
    name: Deploy Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Trigger Dokploy Deployment (Frontend)
        run: |
          response=$(curl -s -w "%{http_code}" -o /tmp/response.txt -X POST "${{ secrets.DOKPLOY_URL }}/api/application.deploy" \
            -H "x-api-key: ${{ secrets.DOKPLOY_TOKEN }}" \
            -H "Content-Type: application/json" \
            -H "accept: application/json" \
            -d '{"applicationId": "${{ secrets.APPROVER_FRONTEND_APP_ID }}"}')
          
          if [ "$response" -eq 200 ]; then
            echo "✅ approver-frontend deployment triggered successfully (HTTP $response)"
            cat /tmp/response.txt 2>/dev/null || true
          else
            echo "❌ Frontend deployment failed with HTTP status code: $response"
            cat /tmp/response.txt 2>/dev/null || true
            exit 1
          fi
