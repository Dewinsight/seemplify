name: Validate Self-hosted Runner Pool

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: self-hosted-pool-validation-queue
  cancel-in-progress: false
  queue: max

jobs:
  seemplify:
    name: Validate Seemplify worker
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        slot: [1, 2, 3]
    runs-on: [self-hosted, dewinsight-kvm8-seemplify]
    timeout-minutes: 5
    steps:
      - name: Verify isolated resource ceiling
        run: |
          set -euo pipefail
          test "$(cat /sys/fs/cgroup/cpu.max)" = '200000 100000'
          test "$(cat /sys/fs/cgroup/memory.max)" = '4294967296'
          [[ "$RUNNER_NAME" == kvm8-seemplify-worker || "$RUNNER_NAME" == kvm8-seemplify-worker-2 ]]
          printf 'runner=%s started=%s\n' "$RUNNER_NAME" "$(date -u +%FT%TZ)"
          sleep 45
          printf 'runner=%s completed=%s\n' "$RUNNER_NAME" "$(date -u +%FT%TZ)"

  workspace:
    name: Validate Workspace worker
    runs-on: dewinsight-kvm8-workspace
    timeout-minutes: 5
    steps:
      - name: Verify isolated resource ceiling
        run: |
          set -euo pipefail
          test "$(cat /sys/fs/cgroup/cpu.max)" = '200000 100000'
          test "$(cat /sys/fs/cgroup/memory.max)" = '4294967296'
          test "${RUNNER_NAME:-}" = kvm8-workspace-worker

  control:
    name: Validate deploy controller
    runs-on: dewinsight-kvm8-control
    timeout-minutes: 5
    steps:
      - name: Verify orchestration-only resource ceiling
        run: |
          set -euo pipefail
          test "$(cat /sys/fs/cgroup/cpu.max)" = '50000 100000'
          test "$(cat /sys/fs/cgroup/memory.max)" = '1073741824'
          test "${RUNNER_NAME:-}" = kvm8-deploy-controller
