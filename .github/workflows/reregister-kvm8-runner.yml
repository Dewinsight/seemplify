name: Re-register One KVM8 GitHub Actions Runner

on:
  workflow_dispatch:
    inputs:
      runner:
        description: Runner service whose stale registration should be replaced
        required: true
        type: choice
        options:
          - seemplify-worker
          - workspace-worker
          - control

permissions:
  contents: read

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Configure Hostinger SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.HOSTINGER_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.HOSTINGER_SSH_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          printf 'Host *\n  ConnectionAttempts 2\n  ConnectTimeout 20\n  ServerAliveInterval 15\n  ServerAliveCountMax 4\n' > ~/.ssh/config
          chmod 600 ~/.ssh/config

      - name: Upload short-lived registration token
        env:
          RUNNER_TOKEN: ${{ secrets.KVM8_RUNNER_REGISTRATION_TOKEN }}
          SSH_HOST: ${{ secrets.HOSTINGER_SSH_HOST }}
          SSH_USER: ${{ secrets.HOSTINGER_SSH_USER }}
        run: |
          test -n "$RUNNER_TOKEN"
          umask 077
          printf 'RUNNER_TOKEN=%s\n' "$RUNNER_TOKEN" > /tmp/kvm8-runner-repair.env
          source deploy/hostinger/github-actions-ssh-retry.sh
          hostinger_upload_with_lock /tmp/kvm8-runner-repair.env \
            "$SSH_USER@$SSH_HOST" /tmp/kvm8-runner-repair.env
          rm -f /tmp/kvm8-runner-repair.env

      - name: Replace exact stale registration
        env:
          SSH_HOST: ${{ secrets.HOSTINGER_SSH_HOST }}
          SSH_USER: ${{ secrets.HOSTINGER_SSH_USER }}
          RUNNER_SERVICE: ${{ inputs.runner }}
        run: |
          case "$RUNNER_SERVICE" in
            seemplify-worker)
              container=github-actions-runner-seemplify-worker-1
              expected_name=kvm8-seemplify-worker
              ;;
            workspace-worker)
              container=github-actions-runner-workspace-worker-1
              expected_name=kvm8-workspace-worker
              ;;
            control)
              container=github-actions-runner-control-1
              expected_name=kvm8-deploy-controller
              ;;
            *)
              printf 'Unsupported runner service: %s\n' "$RUNNER_SERVICE" >&2
              exit 2
              ;;
          esac

          source deploy/hostinger/github-actions-ssh-retry.sh
          hostinger_ssh_stdin "$SSH_USER@$SSH_HOST" bash -s -- \
            "$RUNNER_SERVICE" "$container" "$expected_name" <<'REMOTE'
          set -euo pipefail
          service=$1
          container=$2
          expected_name=$3
          target=/opt/seemplify/github-actions-runner
          cd "$target"

          install -m 600 /tmp/kvm8-runner-repair.env .repair.env
          rm -f /tmp/kvm8-runner-repair.env
          trap ': > .repair.env; chmod 600 .repair.env' EXIT

          current_id=$(docker compose -f compose.yml ps -q "$service")
          container_id=$(docker inspect --format '{{.Id}}' "$container")
          if [[ -z $current_id || $current_id != "$container_id" ]]; then
            printf 'Refusing to repair a container outside the current runner stack.\n' >&2
            exit 1
          fi
          if ! docker inspect --format '{{range .Config.Env}}{{println .}}{{end}}' "$container" \
              | grep -Fxq "RUNNER_NAME=$expected_name"; then
            printf 'Refusing to repair a container with an unexpected runner identity.\n' >&2
            exit 1
          fi
          if docker top "$container" -eo args 2>/dev/null | grep -Fq 'Runner.Worker run'; then
            printf 'Refusing to repair a runner with an active job process.\n' >&2
            exit 1
          fi

          docker compose -f compose.yml stop --timeout 45 "$service"
          docker compose --env-file .repair.env -f compose.yml run --rm --no-deps \
            --entrypoint bash "$service" -lc \
            'rm -f -- /runner/.runner /runner/.credentials /runner/.credentials_rsaparams; /opt/runner-hooks/cleanup-workspace.sh'
          docker compose --env-file .repair.env -f compose.yml up -d --no-deps --force-recreate "$service"

          for attempt in $(seq 1 60); do
            if docker compose -f compose.yml exec -T "$service" test -s /runner/.runner \
              && docker compose -f compose.yml exec -T "$service" test -s /runner/.credentials \
              && docker compose -f compose.yml exec -T "$service" test -s /runner/.credentials_rsaparams \
              && docker logs "$container" 2>&1 | grep -Fq 'Listening for Jobs'; then
              break
            fi
            if [[ $attempt == 60 ]]; then
              docker logs --tail 100 "$container" 2>&1
              exit 1
            fi
            sleep 2
          done

          docker compose -f compose.yml stop --timeout 45 "$service"
          : > .repair.env
          chmod 600 .repair.env
          docker compose --env-file .repair.env -f compose.yml up -d --no-deps --force-recreate "$service"
          for attempt in $(seq 1 60); do
            if [[ $(docker inspect --format '{{.State.Running}}' "$container") == true ]] \
              && docker logs "$container" 2>&1 | grep -Fq 'Listening for Jobs'; then
              printf 'reregistered_runner=%s tokenless=true\n' "$expected_name"
              exit 0
            fi
            if [[ $attempt == 60 ]]; then
              docker logs --tail 100 "$container" 2>&1
              exit 1
            fi
            sleep 2
          done
          REMOTE
