# Deploy Recruiter Frontend to Dokploy
name: Deploy Recruiter Frontend

on:
  push:
    branches: [main]
    paths:
      - 'recruiter/new/frontend/**'
      - '.github/workflows/deploy-recruiter-frontend.yml'
  workflow_dispatch:

env:
  APP_NAME: recruiter-frontend
  APP_PATH: recruiter/new/frontend

jobs:
  deploy:
    name: Deploy to Dokploy
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Trigger Dokploy Deployment
        run: |
          echo "Deploying ${{ env.APP_NAME }}..."
          echo "Dokploy URL: ${{ secrets.DOKPLOY_URL }}"
          echo "App ID: ${{ secrets.RECRUITER_FRONTEND_APP_ID }}"
          
          response=$(curl -s -w "%{http_code}" -o /tmp/response.txt -X POST "${{ secrets.DOKPLOY_URL }}/api/application.deploy" \
            -H "x-api-key: ${{ secrets.DOKPLOY_TOKEN }}" \
            -H "Content-Type: application/json" \
            -H "accept: application/json" \
            -d '{"applicationId": "${{ secrets.RECRUITER_FRONTEND_APP_ID }}"}')
          
          echo "HTTP Response Code: $response"
          echo "Response Body:"
          cat /tmp/response.txt 2>/dev/null || echo "No response body"
          
          if [ "$response" -eq 200 ] || [ "$response" -eq 201 ]; then
            echo "✅ Deployment triggered successfully"
          else
            echo "❌ Deployment failed"
            exit 1
          fi
