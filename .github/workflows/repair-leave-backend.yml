name: Diagnose or Restart Leave Backend on Hostinger

on:
  workflow_dispatch:
    inputs:
      action:
        description: Diagnose the service or restart its current release
        required: true
        default: diagnose
        type: choice
        options:
          - diagnose
          - restart

permissions:
  contents: read

jobs:
  leave-backend:
    name: ${{ inputs.action }} leave-backend
    runs-on: dewinsight-kvm8
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Configure Hostinger SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.HOSTINGER_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.HOSTINGER_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$SSH_PRIVATE_KEY"
          test -n "$SSH_KNOWN_HOSTS"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          printf 'Host *\n  ConnectionAttempts 2\n  ConnectTimeout 20\n  ServerAliveInterval 15\n  ServerAliveCountMax 4\n' > ~/.ssh/config
          chmod 600 ~/.ssh/config

      - name: Inspect or restart current production release
        env:
          ACTION: ${{ inputs.action }}
          SSH_HOST: ${{ secrets.HOSTINGER_SSH_HOST }}
          SSH_USER: ${{ secrets.HOSTINGER_SSH_USER }}
        run: |
          set -euo pipefail
          source deploy/hostinger/github-actions-ssh-retry.sh
          hostinger_ssh_stdin "$SSH_USER@$SSH_HOST" \
            "flock --exclusive --wait 480 /var/lock/seemplify-production-deploy.lock bash -s -- '$ACTION'" <<'REMOTE'
          set -euo pipefail
          action="$1"
          container=seemplify-core-leave-backend-1
          docker inspect --format 'name={{.Name}} image={{.Config.Image}} status={{.State.Status}} health={{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}} started={{.State.StartedAt}} revision={{index .Config.Labels "org.opencontainers.image.revision"}}' "$container"
          docker logs --tail 100 "$container" 2>&1 || true
          if [[ "$action" == restart ]]; then
            docker restart "$container" >/dev/null
            for _ in $(seq 1 45); do
              state=$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' "$container")
              [[ "$state" == healthy || "$state" == running ]] && exit 0
              [[ "$state" == unhealthy || "$state" == exited || "$state" == dead ]] && break
              sleep 2
            done
            docker logs --tail 150 "$container" >&2 || true
            exit 1
          fi
          REMOTE

      - name: Verify public health
        if: inputs.action == 'restart'
        run: curl -fsS --max-time 15 https://api-leave.seemplifyai.com/health
