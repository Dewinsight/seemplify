# Deploy Recruiter Backend to Dokploy
name: Deploy Recruiter Backend

on:
  push:
    branches: [main]
    paths:
      - 'recruiter/backend/**'
      - '.github/workflows/deploy-recruiter-backend.yml'
  workflow_dispatch:

env:
  APP_NAME: recruiter-backend
  APP_PATH: recruiter/backend

jobs:
  deploy:
    name: Deploy to Dokploy
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Trigger Dokploy Deployment
        run: |
          response=$(curl -s -w "%{http_code}" -o /tmp/response.txt -X POST "${{ secrets.DOKPLOY_URL }}/api/application.deploy" \
            -H "x-api-key: ${{ secrets.DOKPLOY_TOKEN }}" \
            -H "Content-Type: application/json" \
            -H "accept: application/json" \
            -d '{"applicationId": "${{ secrets.RECRUITER_BACKEND_APP_ID }}"}')
          
          if [ "$response" -eq 200 ]; then
            echo "✅ ${{ env.APP_NAME }} deployment triggered successfully (HTTP $response)"
            cat /tmp/response.txt 2>/dev/null || true
          else
            echo "❌ Deployment failed with HTTP status code: $response"
            cat /tmp/response.txt 2>/dev/null || true
            exit 1
          fi

      - name: Verify deployed health
        run: |
          for attempt in $(seq 1 45); do
            status=$(curl -sS -o /tmp/recruiter-health.txt -w "%{http_code}" \
              "https://api.seemplifyai.com/api/health" || true)
            if [ "$status" = "200" ]; then
              echo "Recruiter backend is healthy."
              cat /tmp/recruiter-health.txt
              exit 0
            fi
            echo "Health attempt ${attempt}/45 returned HTTP ${status}."
            sleep 6
          done

          echo "Recruiter did not become healthy. Safe Dokploy application state:"
          curl -sS \
            -H "x-api-key: ${{ secrets.DOKPLOY_TOKEN }}" \
            -H "accept: application/json" \
            "${{ secrets.DOKPLOY_URL }}/api/application.one?applicationId=${{ secrets.RECRUITER_BACKEND_APP_ID }}" \
            | jq '{name, status, applicationStatus, buildType, sourceType, createdAt, updatedAt,
              deployments: ((.deployments // []) | map({status, createdAt, updatedAt, errorMessage}) | .[0:5])}'

          echo "Sanitized Recruiter runtime errors from Dokploy:"
          curl -sS -G \
            -H "x-api-key: ${{ secrets.DOKPLOY_TOKEN }}" \
            -H "accept: application/json" \
            --data-urlencode "applicationId=${{ secrets.RECRUITER_BACKEND_APP_ID }}" \
            --data-urlencode "tail=300" \
            --data-urlencode "since=30m" \
            "${{ secrets.DOKPLOY_URL }}/api/application.readLogs" \
            | jq -r '.. | strings' \
            | grep -Ei 'error|failed|fatal|exception|mongo|redis|cannot|module|econn|timeout|listen|startup|crash' \
            | sed -E 's#(mongodb(\+srv)?|redis|rediss|https?)://[^[:space:]]+#\1://[redacted]#g; s#(token|secret|password|authorization|api[_-]?key)[=: ]+[^[:space:]]+#\1=[redacted]#Ig' \
            | tail -120 \
            || true
          exit 1
