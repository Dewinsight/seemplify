name: Recover Recruiter Webhook Trust

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recover:
    name: Restore target-bound Recruiter webhook trust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure and verify Recruiter then Identity Provider
        run: node tools/chatgpt-gateway/dokploy-recover-recruiter-webhook.cjs
        env:
          DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
          DOKPLOY_TOKEN: ${{ secrets.DOKPLOY_TOKEN }}
          RECRUITER_BACKEND_APP_ID: ${{ secrets.RECRUITER_BACKEND_APP_ID }}
          IDENTITY_PROVIDER_APP_ID: ${{ secrets.IDENTITY_PROVIDER_APP_ID }}
          IDP_WEBHOOK_MASTER_SECRET: ${{ secrets.IDP_WEBHOOK_MASTER_SECRET }}
