name: Deploy Core Apps to Hostinger

on:
  push:
    branches: [main]
    paths:
      - 'Identityprovider/**'
      - 'recruiter/backend/**'
      - 'recruiter/frontend/**'
      - 'recruiter/candidates/**'
      - 'leave-management/**'
      - 'seemplify-learning/**'
      - 'performance/backend/**'
      - 'performance/frontend/**'
      - 'payroll/backend/**'
      - 'payroll/frontend/**'
      - 'time-attendance/**'
      - 'deploy/hostinger/core-apps.compose.yml'
      - 'deploy/hostinger/generate-idp-clients.sh'
      - 'deploy/hostinger/github-actions-ssh-retry.sh'
      - 'deploy/hostinger/smoke-hostinger.sh'
      - '.github/workflows/deploy-core-hostinger.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hostinger-core-production
  cancel-in-progress: false

jobs:
  identity-qa:
    name: Test Identity Provider
    runs-on: dewinsight-kvm8
    defaults:
      run:
        working-directory: Identityprovider
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: Identityprovider/package-lock.json
      - run: npm ci --ignore-scripts
      - name: Verify identity, admin analytics, and organization switching
        run: |
          node --test \
            production-wiring.test.mjs \
            test/auth-redirects.test.mjs \
            test/hub-pins.test.mjs \
            test/member-removal-webhook.test.mjs \
            test/nylas-platform-configuration.test.mjs \
            test/media-platform-configuration.test.mjs \
            test/messaging-oidc-client.test.mjs \
            test/organization-deletion-fallback.test.mjs \
            test/organization-transaction.test.mjs \
            test/internal-membership-service-auth.test.mjs \
            test/recruiter-admin-sso-secret.test.mjs \
            test/profile-completion.test.mjs \
            test/workspace-automation-access.test.mjs \
            test/n8n-candidate-access.test.mjs \
            test/workspace-platform-integration-auth.test.mjs \
            test/workspace-automations-boundary.test.mjs \
            tests/access-control.test.mjs \
            src/__tests__/account-profile-schema.test.mjs \
            src/__tests__/organization-access-control-routing.test.mjs \
            src/__tests__/subscription-extension-reactivation.test.mjs \
            src/__tests__/subscription-required-recovery.test.mjs \
            test/shared-ai-admin-client.test.mjs \
            test/webhook-target-secrets.test.mjs

  recruiter-qa:
    name: Test Recruiter gateway
    runs-on: dewinsight-kvm8
    defaults:
      run:
        working-directory: recruiter/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test dependencies
        run: npm install --ignore-scripts --legacy-peer-deps
      - name: Verify admin analytics and inference isolation
        run: |
          node --test \
            tests/aiAdminAnalytics.test.js \
            tests/aiRuntimeGatewayIntegration.test.js \
            tests/codexAccountService.test.js \
            tests/idpAdminSsoService.test.js
          node --test tests/platformConfigurationClient.test.js

  learning-qa:
    name: Test Learning platform configuration
    runs-on: dewinsight-kvm8
    defaults:
      run:
        working-directory: seemplify-learning
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: seemplify-learning/package-lock.json
      - run: npm ci --ignore-scripts
      - run: node --test test/platform-configuration-client.test.js

  workforce-backend-qa:
    name: Test ${{ matrix.name }} backend
    runs-on: dewinsight-kvm8
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Leave
            directory: leave-management/backend
            install_command: npm install --ignore-scripts --no-package-lock
            test_command: npm test -- --runInBand
          - name: Performance
            directory: performance/backend
            install_command: npm install --ignore-scripts --no-package-lock
            test_command: npm run test:legacy && npm run test:unit
          - name: Payroll
            directory: payroll/backend
            install_command: npm install --ignore-scripts --no-package-lock
            test_command: npm test -- --runInBand
          - name: Time and Attendance
            directory: time-attendance/backend
            install_command: npm ci --ignore-scripts
            test_command: npm test -- --runInBand
    defaults:
      run:
        working-directory: ${{ matrix.directory }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: ${{ matrix.install_command }}
      - run: ${{ matrix.test_command }}

  workforce-frontend-qa:
    name: Build ${{ matrix.name }} frontend
    runs-on: dewinsight-kvm8
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Recruiter
            directory: recruiter/frontend
            install_command: npm install --ignore-scripts --no-package-lock
          - name: Candidate Portal
            directory: recruiter/candidates
            install_command: npm install --ignore-scripts --no-package-lock
          - name: Leave
            directory: leave-management/frontend
            install_command: npm install --ignore-scripts --no-package-lock
          - name: Performance
            directory: performance/frontend
            install_command: npm ci --ignore-scripts
          - name: Payroll
            directory: payroll/frontend
            install_command: npm install --ignore-scripts --no-package-lock
          - name: Time and Attendance
            directory: time-attendance/frontend
            install_command: npm ci --ignore-scripts
    defaults:
      run:
        working-directory: ${{ matrix.directory }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: ${{ matrix.install_command }}
      - run: npm run build

  deploy:
    name: Deploy immutable core release
    needs:
      - identity-qa
      - recruiter-qa
      - learning-qa
      - workforce-backend-qa
      - workforce-frontend-qa
    runs-on: dewinsight-kvm8
    steps:
      - uses: actions/checkout@v4

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.HOSTINGER_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.HOSTINGER_SSH_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          printf 'Host *\n  ConnectionAttempts 2\n  ConnectTimeout 20\n  ServerAliveInterval 15\n  ServerAliveCountMax 4\n' > ~/.ssh/config
          chmod 600 ~/.ssh/config

      - name: Package release
        run: |
          tar -czf core-release.tgz \
            Identityprovider \
            recruiter/backend recruiter/frontend recruiter/candidates \
            leave-management \
            seemplify-learning \
            performance \
            payroll \
            time-attendance \
            deploy/hostinger/core-apps.compose.yml \
            deploy/hostinger/generate-idp-clients.sh \
            deploy/hostinger/smoke-hostinger.sh

      - name: Upload release
        env:
          SSH_HOST: ${{ secrets.HOSTINGER_SSH_HOST }}
          SSH_USER: ${{ secrets.HOSTINGER_SSH_USER }}
        run: |
          source deploy/hostinger/github-actions-ssh-retry.sh
          hostinger_upload_with_lock core-release.tgz "$SSH_USER@$SSH_HOST" "/opt/seemplify/build/core-release-${GITHUB_SHA}.tgz"

      - name: Build, deploy, and verify exact release
        env:
          SSH_HOST: ${{ secrets.HOSTINGER_SSH_HOST }}
          SSH_USER: ${{ secrets.HOSTINGER_SSH_USER }}
        run: |
          source deploy/hostinger/github-actions-ssh-retry.sh
          hostinger_ssh_stdin "$SSH_USER@$SSH_HOST" \
            "RELEASE_SHA='$GITHUB_SHA' flock --exclusive --wait 1800 /var/lock/seemplify-production-deploy.lock bash -s" <<'REMOTE'
          set -euo pipefail
          release_root="/opt/seemplify/releases/$RELEASE_SHA"
          archive="/opt/seemplify/build/core-release-$RELEASE_SHA.tgz"
          install -d -m 700 "$release_root"
          tar -xzf "$archive" -C "$release_root"

          identity_image="seemplify/identity-provider:hostinger-$RELEASE_SHA"
          recruiter_image="seemplify/recruiter-backend:hostinger-$RELEASE_SHA"
          recruiter_frontend_image="seemplify/recruiter-frontend:hostinger-$RELEASE_SHA"
          candidate_portal_image="seemplify/candidate-portal:hostinger-$RELEASE_SHA"
          leave_backend_image="seemplify/leave-backend:hostinger-$RELEASE_SHA"
          leave_frontend_image="seemplify/leave-frontend:hostinger-$RELEASE_SHA"
          learning_image="seemplify/learning:hostinger-$RELEASE_SHA"
          performance_backend_image="seemplify/performance-backend:hostinger-$RELEASE_SHA"
          performance_frontend_image="seemplify/performance-frontend:hostinger-$RELEASE_SHA"
          payroll_backend_image="seemplify/payroll-backend:hostinger-$RELEASE_SHA"
          payroll_frontend_image="seemplify/payroll-frontend:hostinger-$RELEASE_SHA"
          time_backend_image="seemplify/time-backend:hostinger-$RELEASE_SHA"
          time_frontend_image="seemplify/time-frontend:hostinger-$RELEASE_SHA"
          docker build --pull \
            --label "org.opencontainers.image.revision=$RELEASE_SHA" \
            -t "$identity_image" "$release_root/Identityprovider"
          docker build --pull \
            --label "org.opencontainers.image.revision=$RELEASE_SHA" \
            -t "$recruiter_image" "$release_root/recruiter/backend"
          docker build --pull \
            --label "org.opencontainers.image.revision=$RELEASE_SHA" \
            -t "$recruiter_frontend_image" "$release_root/recruiter/frontend"
          docker build --pull \
            --label "org.opencontainers.image.revision=$RELEASE_SHA" \
            -t "$candidate_portal_image" "$release_root/recruiter/candidates"
          docker build --pull \
            --label "org.opencontainers.image.revision=$RELEASE_SHA" \
            -t "$leave_backend_image" "$release_root/leave-management/backend"
          docker build --pull \
            --label "org.opencontainers.image.revision=$RELEASE_SHA" \
            -t "$leave_frontend_image" "$release_root/leave-management/frontend"
          docker build --pull \
            --label "org.opencontainers.image.revision=$RELEASE_SHA" \
            -t "$learning_image" "$release_root/seemplify-learning"
          docker build --pull \
            --label "org.opencontainers.image.revision=$RELEASE_SHA" \
            -t "$performance_backend_image" "$release_root/performance/backend"
          docker build --pull \
            --label "org.opencontainers.image.revision=$RELEASE_SHA" \
            -t "$performance_frontend_image" "$release_root/performance/frontend"
          docker build --pull \
            --label "org.opencontainers.image.revision=$RELEASE_SHA" \
            -t "$payroll_backend_image" "$release_root/payroll/backend"
          docker build --pull \
            --label "org.opencontainers.image.revision=$RELEASE_SHA" \
            -t "$payroll_frontend_image" "$release_root/payroll/frontend"
          docker build --pull \
            --label "org.opencontainers.image.revision=$RELEASE_SHA" \
            -t "$time_backend_image" "$release_root/time-attendance/backend"
          docker build --pull \
            --label "org.opencontainers.image.revision=$RELEASE_SHA" \
            -t "$time_frontend_image" "$release_root/time-attendance/frontend"

          cp -a "$release_root/Identityprovider/." /opt/seemplify/source/Identityprovider/
          cp -a "$release_root/recruiter/backend/." /opt/seemplify/source/recruiter/backend/
          cp -a "$release_root/recruiter/frontend/." /opt/seemplify/source/recruiter/frontend/
          cp -a "$release_root/recruiter/candidates/." /opt/seemplify/source/recruiter/candidates/
          cp -a "$release_root/leave-management/." /opt/seemplify/source/leave-management/
          cp -a "$release_root/seemplify-learning/." /opt/seemplify/source/seemplify-learning/
          cp -a "$release_root/performance/." /opt/seemplify/source/performance/
          cp -a "$release_root/payroll/." /opt/seemplify/source/payroll/
          cp -a "$release_root/time-attendance/." /opt/seemplify/source/time-attendance/
          install -m 644 "$release_root/deploy/hostinger/core-apps.compose.yml" /opt/seemplify/deploy/hostinger/core-apps.compose.yml
          install -m 755 "$release_root/deploy/hostinger/generate-idp-clients.sh" /opt/seemplify/deploy/hostinger/generate-idp-clients.sh
          install -m 755 "$release_root/deploy/hostinger/smoke-hostinger.sh" /opt/seemplify/deploy/hostinger/smoke-hostinger.sh
          install -m 755 "$release_root/deploy/hostinger/smoke-hostinger.sh" /usr/local/sbin/seemplify-smoke
          IDENTITY_PROVIDER_IMAGE="$identity_image" /opt/seemplify/deploy/hostinger/generate-idp-clients.sh

          test -s /opt/seemplify/secrets/platform-integrations/credential-encryption-key
          test -s /opt/seemplify/secrets/platform-integrations/experience-hmac-secret
          export IDENTITY_PROVIDER_IMAGE="$identity_image"
          export RECRUITER_BACKEND_IMAGE="$recruiter_image"
          export RECRUITER_FRONTEND_IMAGE="$recruiter_frontend_image"
          export CANDIDATE_PORTAL_IMAGE="$candidate_portal_image"
          export LEAVE_BACKEND_IMAGE="$leave_backend_image"
          export LEAVE_FRONTEND_IMAGE="$leave_frontend_image"
          export LEARNING_IMAGE="$learning_image"
          export PERFORMANCE_BACKEND_IMAGE="$performance_backend_image"
          export PERFORMANCE_FRONTEND_IMAGE="$performance_frontend_image"
          export PAYROLL_BACKEND_IMAGE="$payroll_backend_image"
          export PAYROLL_FRONTEND_IMAGE="$payroll_frontend_image"
          export TIME_BACKEND_IMAGE="$time_backend_image"
          export TIME_FRONTEND_IMAGE="$time_frontend_image"
          compose=(docker compose \
            --env-file /opt/seemplify/secrets/shared-infrastructure.env \
            --env-file /opt/seemplify/secrets/core-apps.env \
            -f /opt/seemplify/deploy/hostinger/core-apps.compose.yml)
          "${compose[@]}" config --quiet

          wait_healthy() {
            local container="$1"
            for _ in $(seq 1 60); do
              state=$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' "$container")
              [[ "$state" == healthy || "$state" == running ]] && return 0
              [[ "$state" == unhealthy || "$state" == exited || "$state" == dead ]] && break
              sleep 2
            done
            docker logs --tail 150 "$container" >&2 || true
            return 1
          }

          verify_revision() {
            local container="$1"
            local revision
            revision=$(docker inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$container")
            if [[ "$revision" != "$RELEASE_SHA" ]]; then
              echo "Revision mismatch for $container: expected=$RELEASE_SHA actual=$revision" >&2
              return 1
            fi
          }

          "${compose[@]}" up -d --no-deps --force-recreate recruiter-backend
          wait_healthy seemplify-core-recruiter-backend-1
          docker exec seemplify-core-recruiter-backend-1 npm run seed:catalog
          docker exec seemplify-core-recruiter-backend-1 npm run reconcile:idp-admin-locks
          "${compose[@]}" up -d --no-deps --force-recreate \
            leave-backend performance-backend payroll-backend time-backend learning
          for container in \
            seemplify-core-leave-backend-1 \
            seemplify-core-performance-backend-1 \
            seemplify-core-payroll-backend-1 \
            seemplify-core-time-backend-1 \
            seemplify-core-learning-1; do
            wait_healthy "$container"
          done
          docker exec seemplify-core-time-backend-1 npm run rules:seed
          "${compose[@]}" up -d --no-deps --force-recreate identity-provider
          wait_healthy seemplify-core-identity-provider-1
          docker exec -i seemplify-core-identity-provider-1 node --input-type=module <<'NODE'
          import mongoose from 'mongoose'

          await mongoose.connect(process.env.MONGO_URI)
          const hello = await mongoose.connection.db.admin().command({ hello: 1 })
          if (hello.setName !== 'rs0' || !hello.isWritablePrimary) {
            throw new Error(`Identity MongoDB is not the writable rs0 primary (set=${hello.setName || 'none'})`)
          }

          const session = await mongoose.startSession()
          try {
            await session.withTransaction(async () => {
              const probes = mongoose.connection.db.collection('deployment_transaction_probes')
              const probe = { createdAt: new Date() }
              const { insertedId } = await probes.insertOne(probe, { session })
              await probes.deleteOne({ _id: insertedId }, { session })
            })
          } finally {
            await session.endSession()
            await mongoose.disconnect()
          }
          NODE
          "${compose[@]}" up -d --no-deps --force-recreate \
            recruiter-frontend candidate-portal leave-frontend \
            performance-frontend payroll-frontend time-frontend
          for container in \
            seemplify-core-recruiter-frontend-1 \
            seemplify-core-candidate-portal-1 \
            seemplify-core-leave-frontend-1 \
            seemplify-core-performance-frontend-1 \
            seemplify-core-payroll-frontend-1 \
            seemplify-core-time-frontend-1; do
            wait_healthy "$container"
          done

          for container in \
            seemplify-core-identity-provider-1 \
            seemplify-core-recruiter-backend-1 \
            seemplify-core-recruiter-frontend-1 \
            seemplify-core-candidate-portal-1 \
            seemplify-core-leave-backend-1 \
            seemplify-core-leave-frontend-1 \
            seemplify-core-performance-backend-1 \
            seemplify-core-performance-frontend-1 \
            seemplify-core-payroll-backend-1 \
            seemplify-core-payroll-frontend-1 \
            seemplify-core-time-backend-1 \
            seemplify-core-time-frontend-1 \
            seemplify-core-learning-1; do
            verify_revision "$container"
          done

          docker exec -i seemplify-core-identity-provider-1 node --input-type=module <<'NODE'
          import crypto from 'node:crypto'
          const pathname = '/api/internal/ai-admin/v1/dashboard'
          const service = 'identity-provider-admin'
          const body = JSON.stringify({ days: 1, page: 1, limit: 10 })
          const timestamp = String(Date.now())
          const nonce = crypto.randomBytes(24).toString('base64url')
          const canonical = [timestamp, nonce, service, 'POST', pathname, body].join('\n')
          const signature = crypto.createHmac('sha256', process.env.AI_GATEWAY_ADMIN_ANALYTICS_SECRET).update(canonical).digest('hex')
          const response = await fetch(`http://recruiter-backend:5001${pathname}`, {
            method: 'POST', body,
            headers: {
              'content-type': 'application/json',
              'x-seemplify-service': service,
              'x-seemplify-signature-version': '2',
              'x-seemplify-timestamp': timestamp,
              'x-seemplify-nonce': nonce,
              'x-seemplify-signature': signature
            }
          })
          if (!response.ok) throw new Error(`Shared AI admin analytics returned HTTP ${response.status}`)
          const result = await response.json()
          if (!result.totals || !result.history || !result.connectedAccounts) {
            throw new Error('Shared AI admin analytics response is incomplete')
          }
          console.log('Shared AI admin analytics contract passed')
          NODE

          /usr/local/sbin/seemplify-smoke
          rm -f "$archive"
          REMOTE
