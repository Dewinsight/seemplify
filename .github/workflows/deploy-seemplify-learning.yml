# Deploy Seemplify Learning to Dokploy
name: Deploy Seemplify Learning

on:
  push:
    branches: [main]
    paths:
      - 'seemplify-learning/**'
      - '.github/workflows/deploy-seemplify-learning.yml'
  workflow_dispatch:

env:
  APP_NAME: seemplify-learning
  APP_PATH: seemplify-learning

jobs:
  deploy:
    name: Deploy to Dokploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate required secrets
        run: |
          missing=0
          for var in DOKPLOY_URL DOKPLOY_TOKEN SEEMPLIFY_LEARNING_APP_ID; do
            if [ -z "${!var}" ]; then
              echo "[ERROR] Missing required secret: $var"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Set missing secrets in GitHub Actions before deployment."
            exit 1
          fi
        env:
          DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
          DOKPLOY_TOKEN: ${{ secrets.DOKPLOY_TOKEN }}
          SEEMPLIFY_LEARNING_APP_ID: ${{ secrets.SEEMPLIFY_LEARNING_APP_ID }}

      - name: Trigger Dokploy deployment
        run: |
          response=$(curl -s -w "%{http_code}" -o /tmp/response.txt -X POST "${{ secrets.DOKPLOY_URL }}/api/application.deploy" \
            -H "x-api-key: ${{ secrets.DOKPLOY_TOKEN }}" \
            -H "Content-Type: application/json" \
            -H "accept: application/json" \
            -d '{"applicationId": "${{ secrets.SEEMPLIFY_LEARNING_APP_ID }}"}')

          if [ "$response" -eq 200 ]; then
            echo "[OK] ${{ env.APP_NAME }} deployment triggered successfully (HTTP $response)"
            cat /tmp/response.txt 2>/dev/null || true
          else
            echo "[ERROR] Deployment failed with HTTP status code: $response"
            cat /tmp/response.txt 2>/dev/null || true
            exit 1
          fi
