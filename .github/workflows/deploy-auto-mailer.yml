# Deploy Auto-mailer to Dokploy
name: Deploy Auto-mailer

on:
  push:
    branches: [main, master]
    paths:
      - 'auto-mailer/**'
      - '.github/workflows/deploy-auto-mailer.yml'
  workflow_dispatch:

env:
  APP_NAME: auto-mailer
  APP_PATH: auto-mailer

jobs:
  deploy:
    name: Deploy to Dokploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Trigger Dokploy Deployment
        run: |
          response=$(curl -s -w "%{http_code}" -o /tmp/response.txt -X POST "${{ secrets.DOKPLOY_URL }}/api/application.deploy" \
            -H "x-api-key: ${{ secrets.DOKPLOY_TOKEN }}" \
            -H "Content-Type: application/json" \
            -H "accept: application/json" \
            -d '{"applicationId": "${{ secrets.AUTO_MAILER_APP_ID }}"}')

          if [ "$response" -eq 200 ]; then
            echo "✅ ${{ env.APP_NAME }} deployment triggered successfully (HTTP $response)"
            cat /tmp/response.txt 2>/dev/null || true
            echo "🔗 App URL: https://auto-mailer.seemplifyai.com"
          else
            echo "❌ Deployment failed with HTTP status code: $response"
            cat /tmp/response.txt 2>/dev/null || true
            exit 1
          fi
