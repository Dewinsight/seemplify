# Deploy Performance Frontend to Dokploy
name: Deploy Performance Frontend

on:
  push:
    branches: [main]
    paths:
      - 'performance/frontend/**'
      - '.github/workflows/deploy-performance-frontend.yml'
  workflow_dispatch:

env:
  APP_NAME: performance-frontend
  APP_PATH: performance/frontend

jobs:
  deploy:
    name: Deploy to Dokploy
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Trigger Dokploy Deployment
        uses: benbristow/dokploy-deploy-action@0.0.1
        with:
          auth_token: ${{ secrets.DOKPLOY_TOKEN }}
          application_id: ${{ secrets.PERFORMANCE_FRONTEND_APP_ID }}
          dokploy_url: ${{ secrets.DOKPLOY_URL }}

      - name: Deployment Status
        if: success()
        run: echo "✅ ${{ env.APP_NAME }} deployment triggered successfully"
