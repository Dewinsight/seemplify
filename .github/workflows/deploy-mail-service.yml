name: Deploy Mail Service to Hostinger

on:
  push:
    branches: [main]
    paths:
      - 'platform/email/**'
      - 'deploy/hostinger/mail.compose.yml'
      - 'deploy/hostinger/smoke-hostinger.sh'
      - '.github/workflows/deploy-mail-service.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hostinger-mail-production
  cancel-in-progress: false

jobs:
  validate:
    name: Validate mail release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate production compose contract
        run: node platform/email/scripts/validate-compose-config.mjs --compose platform/email/compose/docker-compose.dokploy.yml
      - name: Run mail platform checks
        run: node --test platform/email/tests/*.test.mjs

  deploy:
    name: Deploy immutable mail release
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure Hostinger SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.HOSTINGER_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.HOSTINGER_SSH_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Package release
        run: |
          tar -czf mail-release.tgz \
            platform/email \
            deploy/hostinger/mail.compose.yml \
            deploy/hostinger/smoke-hostinger.sh

      - name: Upload release
        env:
          SSH_HOST: ${{ secrets.HOSTINGER_SSH_HOST }}
          SSH_USER: ${{ secrets.HOSTINGER_SSH_USER }}
        run: scp mail-release.tgz "$SSH_USER@$SSH_HOST:/opt/seemplify/build/mail-release-${GITHUB_SHA}.tgz"

      - name: Build, deploy, and verify exact mail release
        env:
          SSH_HOST: ${{ secrets.HOSTINGER_SSH_HOST }}
          SSH_USER: ${{ secrets.HOSTINGER_SSH_USER }}
        run: |
          ssh "$SSH_USER@$SSH_HOST" "RELEASE_SHA='$GITHUB_SHA' bash -s" <<'REMOTE'
          set -euo pipefail
          release_root="/opt/seemplify/releases/$RELEASE_SHA"
          archive="/opt/seemplify/build/mail-release-$RELEASE_SHA.tgz"
          install -d -m 700 "$release_root"
          tar -xzf "$archive" -C "$release_root"

          relay_image="seemplify/mail-relay:hostinger-$RELEASE_SHA"
          api_image="seemplify/mail-api:hostinger-$RELEASE_SHA"
          docker build --pull \
            --label "org.opencontainers.image.revision=$RELEASE_SHA" \
            -t "$relay_image" "$release_root/platform/email/relay"
          docker build --pull \
            --label "org.opencontainers.image.revision=$RELEASE_SHA" \
            -t "$api_image" "$release_root/platform/email/api"

          install -d -m 750 /opt/seemplify/source/platform/email
          cp -a "$release_root/platform/email/." /opt/seemplify/source/platform/email/
          install -m 644 "$release_root/deploy/hostinger/mail.compose.yml" \
            /opt/seemplify/deploy/hostinger/mail.compose.yml
          install -m 755 "$release_root/deploy/hostinger/smoke-hostinger.sh" \
            /usr/local/sbin/seemplify-smoke

          export MAIL_RELAY_IMAGE="$relay_image"
          export MAIL_API_IMAGE="$api_image"
          compose=(docker compose \
            --env-file /opt/seemplify/secrets/shared-infrastructure.env \
            --env-file /opt/seemplify/secrets/mail.env \
            -f /opt/seemplify/deploy/hostinger/mail.compose.yml)
          "${compose[@]}" config --quiet
          "${compose[@]}" up -d --no-deps --force-recreate postfix-relay mail-api

          wait_healthy() {
            local container="$1"
            for _ in $(seq 1 60); do
              state=$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' "$container")
              [[ "$state" == healthy || "$state" == running ]] && return 0
              [[ "$state" == unhealthy || "$state" == exited || "$state" == dead ]] && break
              sleep 2
            done
            docker logs --tail 150 "$container" >&2 || true
            return 1
          }

          wait_healthy seemplify-mail-postfix-relay-1
          wait_healthy seemplify-mail-mail-api-1
          for container in seemplify-mail-postfix-relay-1 seemplify-mail-mail-api-1; do
            revision=$(docker inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$container")
            [[ "$revision" == "$RELEASE_SHA" ]]
          done
          curl -fsS --max-time 15 https://mail-control.seemplifyai.com/health/live >/dev/null
          /usr/local/sbin/seemplify-smoke
          rm -f "$archive"
          REMOTE
