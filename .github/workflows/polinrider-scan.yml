# Blocks PolinRider supply-chain malware (and look-alikes) from being merged.
# pull_request_target uses trusted base-repository workflow code. Keep the
# required check name stable; PR blobs are API data, never checked out or run.
# Shared API-only scanner design; no pull-request checkout or execution.
name: polinrider-scan
on:
  workflow_dispatch:
    inputs:
      pull_request_number:
        description: Pull request to scan at this exact branch head
        type: number
        required: true
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
permissions:
  contents: read
  pull-requests: read
jobs:
  polinrider-scan:
    runs-on: [self-hosted, dewinsight-kvm8-control]
    timeout-minutes: 10
    steps:
      - name: Scan for malware indicators
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REQUESTED_PR: ${{ inputs.pull_request_number }}
        run: |
          cat > "$RUNNER_TEMP/polinrider_scan.py" <<'PYEOF'
          #!/usr/bin/env python3
          """Scan pull-request files for the PolinRider supply-chain worm.

          Files are only ever read as text; nothing from the pull request is executed.

          Modes:
            polinrider_scan.py --pr            inside GitHub Actions (reads the PR via the API)
            polinrider_scan.py FILE [FILE...]  local scan of specific files
          """
          import base64
          import datetime
          import hashlib
          import html
          import json
          import os
          import re
          import sys
          import urllib.parse
          import urllib.request

          # Assembled from fragments so this scanner never matches itself when a PR
          # updates it (the scan is a no-bypass required check).
          IOC_STRINGS = [
              "A8-" + "5069-6",
              "NONCE_" + "FANOUT",
              "global['" + "_V']",
              "global.i" + " = '",
              "__inz" + "CR",
              ".inz" + ".cjs",
              "166.88." + "134.75",
              "194.11." + "226.41",
              "150.251." + "113.223",
              "app-cursor" + "-eval",
          ]
          HIDDEN_CODE = re.compile(r"[ \t]{150,}\S")
          HEX_ESCAPE = re.compile(r"\\x[0-9a-fA-F]{2}")
          DANGEROUS_IN_CONFIG = re.compile(
              r"child_process|\beval\s*\(|\bFunction\s*\(|fromCharCode|\batob\s*\(|require\(\s*['\"](https?|net|dgram)['\"]\s*\)"
          )
          CODE_EXT = (
              ".js", ".mjs", ".cjs", ".jsx", ".ts", ".mts", ".cts", ".tsx", ".json", ".py",
              ".sh", ".ps1", ".vbs", ".bat", ".cmd", ".rb", ".php", ".vue", ".svelte",
          )
          SKIP_SUFFIX = (".min.js", ".min.mjs", ".map", "package-lock.json", "yarn.lock", "pnpm-lock.yaml")
          SKIP_DIRS = ("node_modules/", "dist/", "build/", ".next/", "coverage/", "vendor/")
          # Build-tool configs that dev servers, linters and bundlers execute on load
          # (postcss.config.js, eslint.config.mjs, next.config.ts, .eslintrc.cjs ...).
          CONFIG_NAME = re.compile(
              r"(^|/)([\w-]+\.config\.(c|m)?[jt]s|\.(eslintrc|babelrc|prettierrc|stylelintrc|lintstagedrc)\.c?js)$",
              re.IGNORECASE,
          )
          LIFECYCLE = ("preinstall", "install", "postinstall", "prepare", "prepublish")
          MAX_BYTES = 5 * 1024 * 1024
          MAX_RESPONSE_BYTES = 8 * 1024 * 1024
          REPO_NAME = re.compile(r"[A-Za-z0-9][A-Za-z0-9-]*/(?!\.{1,2}\Z)[A-Za-z0-9_.-]+\Z")
          OBJECT_SHA = re.compile(r"[0-9a-f]{40}\Z")


          def scan_text(path, text):
              """Return a list of (severity, line, message) for one file."""
              findings = []
              norm = path.replace("\\", "/")
              low = norm.lower()
              if any(d in "/" + low for d in ("/" + s for s in SKIP_DIRS)) or low.endswith(SKIP_SUFFIX):
                  return findings
              is_code = low.endswith(CODE_EXT) or low.endswith("tasks.json")
              is_config = bool(CONFIG_NAME.search(norm))

              if low.endswith((".inz" + ".cjs", ".inz" + ".orig")):
                  findings.append(("error", 1, "File name matches the PolinRider editor-trojan implant"))

              lines = text.split("\n")
              hex_total = 0
              for n, line in enumerate(lines, 1):
                  for ioc in IOC_STRINGS:
                      if ioc in line:
                          findings.append(("error", n, f"Known PolinRider indicator: {ioc!r}"))
                  if is_code and HIDDEN_CODE.search(line):
                      findings.append(("error", n, "Code hidden after a long run of whitespace (pushed off-screen)"))
                  if is_code:
                      hex_total += len(HEX_ESCAPE.findall(line))
                      if len(line) > 3000:
                          # Minified vendor bundles legitimately have huge lines with eval
                          # and escapes, so outside build-tool configs this is only a hint.
                          if is_config:
                              findings.append(("error", n, f"Very long obfuscated-looking line in a build config ({len(line)} chars)"))
                          elif not low.endswith(".json"):
                              findings.append(("warning", n, f"Very long line ({len(line)} chars) - check it is generated or vendored code"))

              if is_config:
                  m = DANGEROUS_IN_CONFIG.search(text)
                  if m:
                      line_no = text[: m.start()].count("\n") + 1
                      findings.append(("error", line_no, "Config file uses dynamic execution or process/network primitives; review the indicated line"))
                  if len(text.encode("utf-8", "ignore")) > 10000:
                      findings.append(("error", 1, f"Config file is unusually large ({len(text)} bytes)"))
              if is_code and hex_total > 300:
                  sev = "error" if is_config else "warning"
                  findings.append((sev, 1, f"Heavy hex-escape obfuscation ({hex_total} \\xNN sequences)"))

              if low.endswith(".vscode/tasks.json") and re.search(r'"runOn"\s*:\s*"folderOpen"', text):
                  findings.append(("error", 1, "VS Code task set to run automatically when the folder is opened"))
              if low.endswith("package.json"):
                  try:
                      scripts = (json.loads(text) or {}).get("scripts", {}) or {}
                      for name in LIFECYCLE:
                          if name in scripts:
                              findings.append(("warning", 1, f"Install lifecycle script {name!r} changed; review its contents in the diff"))
                  except ValueError:
                      pass
              return findings


          def check_commits(commits):
              """Flag the worm's forged-commit tell: committer date well before author date."""
              findings = []
              for c in commits:
                  info = c.get("commit", {})
                  a, k = info.get("author") or {}, info.get("committer") or {}
                  try:
                      ad = datetime.datetime.fromisoformat(a["date"].replace("Z", "+00:00"))
                      cd = datetime.datetime.fromisoformat(k["date"].replace("Z", "+00:00"))
                  except (KeyError, ValueError):
                      continue
                  sha = c.get("sha", "")[:8]
                  if (ad - cd).total_seconds() > 3600:
                      findings.append(("error", sha, f"Commit {sha}: committed {ad - cd} BEFORE it was authored - forged-commit signature"))
                  elif a.get("name") and k.get("name") and a["name"] != k["name"] and k["name"] != "GitHub":
                      if a["name"].split()[0] == k["name"]:
                          findings.append(("warning", sha, f"Commit {sha}: first-name-only committer is a PolinRider pattern; review commit metadata"))
              return findings


          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  raise ValueError("API redirects are not allowed")


          def api(url, token):
              # Never follow PR-supplied raw_url/contents_url or redirects with a token.
              parsed = urllib.parse.urlsplit(url)
              if parsed.scheme != "https" or parsed.netloc != "api.github.com" or not parsed.path.startswith("/repos/"):
                  raise ValueError("Unexpected API destination")
              req = urllib.request.Request(url, headers={
                  "Authorization": f"Bearer {token}", "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
              })
              with urllib.request.build_opener(NoRedirect()).open(req, timeout=30) as r:
                  data = r.read(MAX_RESPONSE_BYTES + 1)
              if len(data) > MAX_RESPONSE_BYTES:
                  raise ValueError("API response exceeds scan limit")
              return json.loads(data)


          def paged(url, token, limit):
              out, page = [], 1
              while True:
                  batch = api(f"{url}{'&' if '?' in url else '?'}per_page=100&page={page}", token)
                  if not isinstance(batch, list) or len(batch) > 100:
                      raise ValueError("Invalid API page")
                  out += batch
                  if len(out) > limit:
                      raise ValueError("API pagination exceeds scan limit")
                  if len(batch) < 100:
                      return out
                  page += 1


          def read_blob(repo, sha, token):
              if not REPO_NAME.fullmatch(repo) or not OBJECT_SHA.fullmatch(sha):
                  raise ValueError("Invalid repository or blob SHA")
              blob = api(f"https://api.github.com/repos/{repo}/git/blobs/{sha}", token)
              if blob.get("encoding") != "base64" or blob.get("sha") != sha:
                  raise ValueError("Invalid blob response")
              if type(blob.get("size")) is not int or not 0 <= blob["size"] <= MAX_BYTES:
                  raise ValueError("Blob exceeds scan limit; review separately")
              data = base64.b64decode("".join(blob["content"].split()), validate=True)
              digest = hashlib.sha1(b"blob " + str(len(data)).encode() + b"\0" + data).hexdigest()
              if len(data) != blob["size"] or digest != sha:
                  raise ValueError("Blob integrity check failed")
              if b"\0" in data[:8000]:
                  return None
              return data.decode("utf-8", "replace")


          def escape_command(value, property_value=False):
              value = str(value).replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
              if property_value:
                  value = value.replace(":", "%3A").replace(",", "%2C")
              return value


          def read_file(path):
              try:
                  if os.path.getsize(path) > MAX_BYTES:
                      return None
                  with open(path, "rb") as f:
                      data = f.read()
                  if b"\0" in data[:8000]:
                      return None
                  return data.decode("utf-8", "replace")
              except OSError:
                  return None


          def main(argv):
              results = []
              if argv[:1] == ["--pr"]:
                  with open(os.environ["GITHUB_EVENT_PATH"], encoding="utf-8") as event_file:
                      event = json.load(event_file)
                  token, repo = os.environ["GITHUB_TOKEN"], os.environ["GITHUB_REPOSITORY"]
                  if not REPO_NAME.fullmatch(repo):
                      raise ValueError("Invalid repository identity")
                  if os.environ.get("GITHUB_EVENT_NAME") == "workflow_dispatch":
                      requested_number = int(os.environ["REQUESTED_PR"])
                      if requested_number < 1:
                          raise ValueError("Invalid requested pull request")
                      pr = api(f"https://api.github.com/repos/{repo}/pulls/{requested_number}", token)
                      if pr["head"]["sha"] != os.environ["GITHUB_SHA"]:
                          raise ValueError("Manual scan must run on the exact current PR head")
                  else:
                      pr = event["pull_request"]
                  number, head = pr["number"], pr["head"]["sha"]
                  head_repo = pr["head"]["repo"]["full_name"]
                  if not REPO_NAME.fullmatch(repo) or not REPO_NAME.fullmatch(head_repo) or not OBJECT_SHA.fullmatch(head) or type(number) is not int or number < 1:
                      raise ValueError("Invalid pull request identity")
                  base = f"https://api.github.com/repos/{repo}/pulls/{number}"
                  current = api(base, token)
                  if current["head"]["sha"] != head:
                      raise ValueError("PR changed before scan; rerun the current head")
                  # GitHub caps these endpoints; never report a truncated scan as clean.
                  if type(current["changed_files"]) is not int or type(current["commits"]) is not int or not 0 <= current["changed_files"] <= 3000 or not 1 <= current["commits"] <= 250:
                      raise ValueError("PR exceeds API scan limits; split or review separately")
                  files = paged(f"{base}/files", token, 3000)
                  commits = paged(f"{base}/commits", token, 250)
                  if len(files) != current["changed_files"] or len(commits) != current["commits"]:
                      raise ValueError("Incomplete pull request file or commit list")
                  if len({f["filename"] for f in files}) != len(files) or len({c["sha"] for c in commits}) != len(commits) or head not in {c["sha"] for c in commits}:
                      raise ValueError("Inconsistent pull request file or commit list")
                  for file in files:
                      if file.get("status") == "removed":
                          continue
                      path = file["filename"]
                      # Fetch the immutable Git blob, not a filesystem path. Symlinks
                      # remain link text; traversal-looking filenames are only labels.
                      # PR objects are available in the base repository, keeping
                      # GITHUB_TOKEN scoped there even for a fork pull request.
                      text = read_blob(repo, file["sha"], token)
                      if text is not None:
                          results += [(path, *f) for f in scan_text(path, text)]
                  results += [("(commits)", *f) for f in check_commits(commits)]
                  after = api(base, token)
                  if after["head"]["sha"] != head or after["base"]["sha"] != current["base"]["sha"] or after["changed_files"] != current["changed_files"] or after["commits"] != current["commits"]:
                      raise ValueError("PR changed during scan; rerun the current head")
              else:
                  for path in argv:
                      text = read_file(path)
                      if text is not None:
                          results += [(path, *f) for f in scan_text(path, text)]

              errors = [r for r in results if r[1] == "error"]
              for path, sev, line, msg in results:
                  if os.environ.get("GITHUB_ACTIONS"):
                      loc = f"file={escape_command(path, True)},line={line}" if isinstance(line, int) else ""
                      print(f"::{sev} {loc}::{escape_command(msg)}")
                  else:
                      print(f"{sev.upper():7} {path}:{line}  {msg}")
              summary = os.environ.get("GITHUB_STEP_SUMMARY")
              if summary:
                  with open(summary, "a", encoding="utf-8") as s:
                      s.write("## PolinRider malware scan\n\n")
                      if not results:
                          s.write("No indicators found.\n")
                      for path, sev, line, msg in results:
                          # Treat filenames, author names and script text as data,
                          # not Markdown/HTML or GitHub workflow commands.
                          record = json.dumps({"severity": sev, "file": path, "line": line, "message": msg}, ensure_ascii=True)
                          s.write(f"<pre>{html.escape(record)}</pre>\n")
              print(f"\n{len(errors)} error(s), {len(results) - len(errors)} warning(s)")
              return 1 if errors else 0


          if __name__ == "__main__":
              try:
                  sys.exit(main(sys.argv[1:]))
              except Exception:
                  # Do not echo transport errors, URLs, tokens or untrusted payloads.
                  print("::error::PolinRider scan incomplete; API, integrity or scan-limit failure. Rerun on the current PR head or review its size/access.")
                  sys.exit(1)
          PYEOF
          python3 -I "$RUNNER_TEMP/polinrider_scan.py" --pr
