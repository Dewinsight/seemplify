name: Deploy Frappe LMS to Hostinger
on:
  push:
    branches: [main]
    paths: ['lms/**', 'deploy/hostinger/lms.compose.yml', 'deploy/hostinger/deploy-lms.sh', '.github/workflows/deploy-lms-hostinger.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: hostinger-lms-production
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: dewinsight-kvm8
    steps:
      - uses: actions/checkout@v4
      - name: Test authentication contracts
        run: python3 -m unittest discover -s lms/tests -v
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.HOSTINGER_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.HOSTINGER_SSH_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Upload and deploy exact main release
        env:
          SSH_HOST: ${{ secrets.HOSTINGER_SSH_HOST }}
          SSH_USER: ${{ secrets.HOSTINGER_SSH_USER }}
        run: |
          test "$GITHUB_REF" = refs/heads/main
          git archive --format=tar.gz -o lms-release.tgz HEAD lms deploy/hostinger
          scp lms-release.tgz "$SSH_USER@$SSH_HOST:/opt/seemplify/build/lms-release-$GITHUB_SHA.tgz"
          ssh "$SSH_USER@$SSH_HOST" "RELEASE_SHA='$GITHUB_SHA' flock --exclusive --wait 1800 /var/lock/seemplify-production-deploy.lock bash -s" <<'REMOTE'
          set -euo pipefail
          release_root="/opt/seemplify/releases/$RELEASE_SHA"
          install -d -m 755 "$release_root"
          tar -xzf "/opt/seemplify/build/lms-release-$RELEASE_SHA.tgz" -C "$release_root"
          bash "$release_root/deploy/hostinger/deploy-lms.sh"
          REMOTE
      - name: Verify public LMS and standalone login
        run: |
          curl -fsS https://lms.seemplifyai.com/api/method/ping
          curl -fsS https://lms.seemplifyai.com/lms-login | grep -q 'id="password"'
          test "$(curl -sS -o /dev/null -w '%{http_code}' https://lms.seemplifyai.com/api/method/lms.lms.production_auth.start)" = 401
