name: Authorize temporary mail migration key

on:
  workflow_dispatch:
    inputs:
      action:
        description: Add before migration or remove immediately after cleanup
        required: true
        type: choice
        options: [add, remove]
      public_key:
        description: Dedicated ssh-ed25519 public key generated by new-migration-key.ps1
        required: true
        type: string

permissions:
  contents: read

jobs:
  authorize:
    runs-on: ubuntu-latest
    steps:
      - name: Validate public key
        env:
          MIGRATION_ACTION: ${{ inputs.action }}
          MIGRATION_PUBLIC_KEY: ${{ inputs.public_key }}
        run: |
          set -euo pipefail
          case "$MIGRATION_ACTION" in add|remove) ;; *) exit 2;; esac
          printf '%s\n' "$MIGRATION_PUBLIC_KEY" | grep -Eq '^ssh-ed25519 [A-Za-z0-9+/]+={0,3} seemplify-mail-migration-[A-Za-z0-9_.:-]+$'
          printf '%s\n' "$MIGRATION_PUBLIC_KEY" > /tmp/seemplify-mail-migration.pub
          chmod 600 /tmp/seemplify-mail-migration.pub

      - name: Load existing server credential
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Pin server host key
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          ssh-keyscan -H 4.180.153.209 >> ~/.ssh/known_hosts

      - name: Transfer requested public key
        run: scp /tmp/seemplify-mail-migration.pub seemplify@4.180.153.209:/tmp/seemplify-mail-migration.pub

      - name: Apply exact authorization change
        env:
          MIGRATION_ACTION: ${{ inputs.action }}
        run: |
          set -euo pipefail
          ssh seemplify@4.180.153.209 "MIGRATION_ACTION='$MIGRATION_ACTION' bash -s" <<'REMOTE'
          set -euo pipefail
          incoming=/tmp/seemplify-mail-migration.pub
          auth="$HOME/.ssh/authorized_keys"
          trap 'rm -f -- "$incoming"' EXIT
          test -f "$incoming"
          grep -Eq '^ssh-ed25519 [A-Za-z0-9+/]+={0,3} seemplify-mail-migration-[A-Za-z0-9_.:-]+$' "$incoming"
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          touch "$auth"
          chmod 600 "$auth"
          key="$(cat "$incoming")"
          tmp="$(mktemp "$HOME/.ssh/authorized_keys.XXXXXX")"
          grep -Fvx -- "$key" "$auth" > "$tmp" || true
          if [ "$MIGRATION_ACTION" = add ]; then printf '%s\n' "$key" >> "$tmp"; fi
          chmod 600 "$tmp"
          mv "$tmp" "$auth"
          count="$(grep -Fc -- "$key" "$auth" || true)"
          if [ "$MIGRATION_ACTION" = add ]; then test "$count" -eq 1; else test "$count" -eq 0; fi
          printf 'Temporary migration authorization %s completed.\n' "$MIGRATION_ACTION"
          REMOTE
