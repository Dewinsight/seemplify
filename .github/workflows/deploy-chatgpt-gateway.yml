name: Deploy ChatGPT Gateway

on:
  push:
    branches: [main]
    paths:
      - 'tools/chatgpt-gateway/**'
      - 'recruiter/backend/config/aiRuntimeCatalog.js'
      - 'recruiter/backend/services/aiRuntime/**'
      - '.github/workflows/deploy-chatgpt-gateway.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Configure and deploy ChatGPT Connect on Dokploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Identify the immutable gateway runtime release
        id: gateway_release
        shell: bash
        run: |
          mapfile -t runtime_files < <(
            git ls-files 'tools/chatgpt-gateway/*' \
              | grep -Ev '(\.test\.cjs$|/dokploy-[^/]+\.cjs$)'
          )
          if [ "${#runtime_files[@]}" -eq 0 ]; then
            echo 'No gateway runtime files were found'
            exit 1
          fi
          release_sha="$(git log -1 --format=%H -- "${runtime_files[@]}")"
          if ! printf '%s' "$release_sha" | grep -Eq '^[a-f0-9]{40}$'; then
            echo 'Unable to resolve the gateway runtime release'
            exit 1
          fi
          echo "sha=$release_sha" >> "$GITHUB_OUTPUT"
      - name: Run ChatGPT gateway contract tests
        run: node --test tools/chatgpt-gateway/*.test.cjs
      - name: Ensure durable ChatGPT session-volume backups
        id: gateway_backup
        run: node tools/chatgpt-gateway/dokploy-ensure-volume-backup.cjs
        env:
          DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
          DOKPLOY_TOKEN: ${{ secrets.DOKPLOY_TOKEN }}
          CHATGPT_GATEWAY_APP_ID: ${{ secrets.CHATGPT_GATEWAY_APP_ID }}
          DOKPLOY_BACKUP_DESTINATION_ID: ${{ secrets.DOKPLOY_BACKUP_DESTINATION_ID }}
          ALLOW_HOST_SNAPSHOT_FALLBACK: 'true'
      - name: Load host snapshot SSH key
        if: steps.gateway_backup.outputs.host_snapshot_required == 'true'
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
      - name: Trust the deployment host
        if: steps.gateway_backup.outputs.host_snapshot_required == 'true'
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H 4.180.153.209 >> ~/.ssh/known_hosts
      - name: Snapshot the ChatGPT session volume on the host
        id: host_snapshot
        if: steps.gateway_backup.outputs.host_snapshot_required == 'true'
        env:
          VOLUME_NAME: ${{ steps.gateway_backup.outputs.volume_name }}
        run: |
          if ! printf '%s' "$VOLUME_NAME" | grep -Eq '^[a-zA-Z0-9][a-zA-Z0-9_.-]*$'; then
            echo 'Unsafe ChatGPT gateway volume name'
            exit 1
          fi
          archive="chatgpt-gateway-$(date -u +%Y%m%dT%H%M%SZ).tar.gz"
          snapshot_log="$(ssh seemplify@4.180.153.209 bash -s -- "$VOLUME_NAME" "$archive" <<'REMOTE'
          set -euo pipefail
          volume_name="$1"
          archive_name="$2"
          backup_root="$HOME/backups/chatgpt-gateway"
          mkdir -p "$backup_root"
          docker volume inspect "$volume_name" >/dev/null
          docker run --rm \
            -e ARCHIVE_NAME="$archive_name" \
            -v "$volume_name:/source:ro" \
            -v "$backup_root:/backup" \
            alpine:3.20 sh -euc '
              tar -C /source -czf "/backup/$ARCHIVE_NAME" .
              test -s "/backup/$ARCHIVE_NAME"
              cd /backup
              ls -1t chatgpt-gateway-*.tar.gz | tail -n +15 | xargs -r rm -f
          '
          test -s "$backup_root/$archive_name"
          archive_sha256="$(sha256sum "$backup_root/$archive_name" | awk '{print $1}')"
          echo "SNAPSHOT_METADATA=$volume_name|$archive_name|$archive_sha256"
          REMOTE
          )"
          printf '%s\n' "$snapshot_log"
          snapshot_metadata="$(printf '%s\n' "$snapshot_log" | sed -n 's/^SNAPSHOT_METADATA=//p' | tail -n 1)"
          IFS='|' read -r snapshot_volume snapshot_archive snapshot_sha256 <<EOF
          $snapshot_metadata
          EOF
          if [ "$snapshot_volume" != "$VOLUME_NAME" ] \
            || ! printf '%s' "$snapshot_archive" | grep -Eq '^chatgpt-gateway-[0-9]{8}T[0-9]{6}Z\.tar\.gz$' \
            || ! printf '%s' "$snapshot_sha256" | grep -Eq '^[a-f0-9]{64}$'; then
            echo 'Host snapshot did not return valid deployment evidence'
            exit 1
          fi
          echo "snapshot_volume=$snapshot_volume" >> "$GITHUB_OUTPUT"
          echo "snapshot_archive=$snapshot_archive" >> "$GITHUB_OUTPUT"
          echo "snapshot_sha256=$snapshot_sha256" >> "$GITHUB_OUTPUT"
      - name: Deploy and verify the exact ChatGPT gateway release
        id: gateway_deploy
        continue-on-error: true
        run: node tools/chatgpt-gateway/dokploy-deploy-gateway.cjs
        env:
          DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
          DOKPLOY_TOKEN: ${{ secrets.DOKPLOY_TOKEN }}
          CHATGPT_GATEWAY_APP_ID: ${{ secrets.CHATGPT_GATEWAY_APP_ID }}
          CHATGPT_GATEWAY_BASE_URL: ${{ secrets.CHATGPT_GATEWAY_BASE_URL }}
          SEEMPLIFY_GATEWAY_RELEASE_SHA: ${{ steps.gateway_release.outputs.sha }}
          CHATGPT_GATEWAY_HOST_SNAPSHOT_VOLUME: ${{ steps.host_snapshot.outputs.snapshot_volume }}
          CHATGPT_GATEWAY_HOST_SNAPSHOT_ARCHIVE: ${{ steps.host_snapshot.outputs.snapshot_archive }}
          CHATGPT_GATEWAY_HOST_SNAPSHOT_SHA256: ${{ steps.host_snapshot.outputs.snapshot_sha256 }}
      - name: Verify the exact gateway release from the deployment host
        env:
          VOLUME_NAME: ${{ steps.gateway_backup.outputs.volume_name }}
          EXPECTED_RELEASE: ${{ steps.gateway_release.outputs.sha }}
        shell: bash
        run: |
          health_json="$(ssh seemplify@4.180.153.209 bash -s -- "$VOLUME_NAME" "$EXPECTED_RELEASE" <<'REMOTE'
          set -euo pipefail
          volume_name="$1"
          expected_release="$2"
          for attempt in $(seq 1 600); do
            mapfile -t containers < <(docker ps --filter "volume=$volume_name" --format '{{.ID}}')
            body=''
            if [ "${#containers[@]}" -eq 1 ]; then
              body="$(docker exec "${containers[0]}" node -e '
                fetch("http://127.0.0.1:11435/health")
                  .then(async (response) => {
                    if (!response.ok) process.exit(1);
                    process.stdout.write(await response.text());
                  })
                  .catch(() => process.exit(1));
              ' 2>/dev/null || true)"
            fi
            compact="$(printf '%s' "$body" | tr -d '\r\n ')"
            if printf '%s' "$compact" | grep -Fq '"ok":true' \
              && printf '%s' "$compact" | grep -Fq '"service":"seemplify-ai-gateway"' \
              && printf '%s' "$compact" | grep -Fq '"runtime":"codex-app-server"' \
              && printf '%s' "$compact" | grep -Fq '"ownership":"seemplify-platform"' \
              && printf '%s' "$compact" | grep -Fq '"messaging"' \
              && printf '%s' "$compact" | grep -Fq "\"release\":\"$expected_release\""; then
              printf '%s' "$body"
              exit 0
            fi
            sleep 2
          done
          echo 'The exact gateway release did not become ready in its running data-volume container' >&2
          exit 1
          REMOTE
          )"
          HEALTH_JSON="$health_json" node - <<'NODE'
          const health = JSON.parse(process.env.HEALTH_JSON || '{}');
          const expected = process.env.EXPECTED_RELEASE;
          if (health.ok !== true
              || health.service !== 'seemplify-ai-gateway'
              || health.runtime !== 'codex-app-server'
              || health.ownership !== 'seemplify-platform'
              || health.release !== expected
              || !Array.isArray(health.consumers)
              || !health.consumers.includes('messaging')) {
            throw new Error('Gateway deployment-host readiness returned an invalid identity');
          }
          console.log(`Verified ChatGPT gateway release ${expected} with Messaging registered.`);
          NODE
