name: Deploy ChatGPT Gateway

on:
  push:
    branches: [main]
    paths:
      - 'tools/chatgpt-gateway/**'
      - 'recruiter/backend/config/aiRuntimeCatalog.js'
      - 'recruiter/backend/services/aiRuntime/**'
      - '.github/workflows/deploy-chatgpt-gateway.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Configure and deploy ChatGPT Connect on Dokploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run ChatGPT gateway contract tests
        run: node --test tools/chatgpt-gateway/*.test.cjs
      - name: Ensure durable ChatGPT session-volume backups
        id: gateway_backup
        run: node tools/chatgpt-gateway/dokploy-ensure-volume-backup.cjs
        env:
          DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
          DOKPLOY_TOKEN: ${{ secrets.DOKPLOY_TOKEN }}
          CHATGPT_GATEWAY_APP_ID: ${{ secrets.CHATGPT_GATEWAY_APP_ID }}
          DOKPLOY_BACKUP_DESTINATION_ID: ${{ secrets.DOKPLOY_BACKUP_DESTINATION_ID }}
          ALLOW_HOST_SNAPSHOT_FALLBACK: 'true'
      - name: Load host snapshot SSH key
        if: steps.gateway_backup.outputs.host_snapshot_required == 'true'
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
      - name: Trust the deployment host
        if: steps.gateway_backup.outputs.host_snapshot_required == 'true'
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H 4.180.153.209 >> ~/.ssh/known_hosts
      - name: Snapshot the ChatGPT session volume on the host
        id: host_snapshot
        if: steps.gateway_backup.outputs.host_snapshot_required == 'true'
        env:
          VOLUME_NAME: ${{ steps.gateway_backup.outputs.volume_name }}
        run: |
          if ! printf '%s' "$VOLUME_NAME" | grep -Eq '^[a-zA-Z0-9][a-zA-Z0-9_.-]*$'; then
            echo 'Unsafe ChatGPT gateway volume name'
            exit 1
          fi
          archive="chatgpt-gateway-$(date -u +%Y%m%dT%H%M%SZ).tar.gz"
          snapshot_log="$(ssh seemplify@4.180.153.209 bash -s -- "$VOLUME_NAME" "$archive" <<'REMOTE'
          set -euo pipefail
          volume_name="$1"
          archive_name="$2"
          backup_root="$HOME/backups/chatgpt-gateway"
          mkdir -p "$backup_root"
          docker volume inspect "$volume_name" >/dev/null
          docker run --rm \
            -e ARCHIVE_NAME="$archive_name" \
            -v "$volume_name:/source:ro" \
            -v "$backup_root:/backup" \
            alpine:3.20 sh -euc '
              tar -C /source -czf "/backup/$ARCHIVE_NAME" .
              test -s "/backup/$ARCHIVE_NAME"
              cd /backup
              ls -1t chatgpt-gateway-*.tar.gz | tail -n +15 | xargs -r rm -f
          '
          test -s "$backup_root/$archive_name"
          archive_sha256="$(sha256sum "$backup_root/$archive_name" | awk '{print $1}')"
          echo "SNAPSHOT_METADATA=$volume_name|$archive_name|$archive_sha256"
          REMOTE
          )"
          printf '%s\n' "$snapshot_log"
          snapshot_metadata="$(printf '%s\n' "$snapshot_log" | sed -n 's/^SNAPSHOT_METADATA=//p' | tail -n 1)"
          IFS='|' read -r snapshot_volume snapshot_archive snapshot_sha256 <<EOF
          $snapshot_metadata
          EOF
          if [ "$snapshot_volume" != "$VOLUME_NAME" ] \
            || ! printf '%s' "$snapshot_archive" | grep -Eq '^chatgpt-gateway-[0-9]{8}T[0-9]{6}Z\.tar\.gz$' \
            || ! printf '%s' "$snapshot_sha256" | grep -Eq '^[a-f0-9]{64}$'; then
            echo 'Host snapshot did not return valid deployment evidence'
            exit 1
          fi
          echo "snapshot_volume=$snapshot_volume" >> "$GITHUB_OUTPUT"
          echo "snapshot_archive=$snapshot_archive" >> "$GITHUB_OUTPUT"
          echo "snapshot_sha256=$snapshot_sha256" >> "$GITHUB_OUTPUT"
      - name: Configure shared Seemplify AI gateway and consumers
        run: node tools/chatgpt-gateway/dokploy-configure.cjs
        env:
          DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
          DOKPLOY_TOKEN: ${{ secrets.DOKPLOY_TOKEN }}
          CHATGPT_GATEWAY_APP_ID: ${{ secrets.CHATGPT_GATEWAY_APP_ID }}
          RECRUITER_BACKEND_APP_ID: ${{ secrets.RECRUITER_BACKEND_APP_ID }}
          PERFORMANCE_BACKEND_APP_ID: ${{ secrets.PERFORMANCE_BACKEND_APP_ID }}
          MESSAGING_BACKEND_APP_ID: ${{ secrets.MESSAGING_BACKEND_APP_ID }}
          IDENTITY_PROVIDER_APP_ID: ${{ secrets.IDENTITY_PROVIDER_APP_ID }}
          LEAVE_BACKEND_APP_ID: ${{ secrets.LEAVE_BACKEND_APP_ID }}
          PAYROLL_BACKEND_APP_ID: ${{ secrets.PAYROLL_BACKEND_APP_ID }}
          TIME_ATTENDANCE_BACKEND_APP_ID: ${{ secrets.TIME_ATTENDANCE_BACKEND_APP_ID }}
          CHATGPT_GATEWAY_BASE_URL: ${{ secrets.CHATGPT_GATEWAY_BASE_URL }}
          CHATGPT_GATEWAY_SHARED_SECRET: ${{ secrets.CHATGPT_GATEWAY_SHARED_SECRET }}
          LOCAL_LLM_BASE_URL: ${{ secrets.LOCAL_LLM_BASE_URL }}
          LOCAL_LLM_SHARED_SECRET: ${{ secrets.LOCAL_LLM_SHARED_SECRET }}
          IDP_WEBHOOK_MASTER_SECRET: ${{ secrets.IDP_WEBHOOK_MASTER_SECRET }}
          CV_STATUS_TOKEN_SECRET: ${{ secrets.CV_STATUS_TOKEN_SECRET }}
          OIDC_CLIENT_SECRET: ${{ secrets.RECRUITER_OIDC_CLIENT_SECRET }}
          CHATGPT_GATEWAY_HOST_SNAPSHOT_VOLUME: ${{ steps.host_snapshot.outputs.snapshot_volume }}
          CHATGPT_GATEWAY_HOST_SNAPSHOT_ARCHIVE: ${{ steps.host_snapshot.outputs.snapshot_archive }}
          CHATGPT_GATEWAY_HOST_SNAPSHOT_SHA256: ${{ steps.host_snapshot.outputs.snapshot_sha256 }}
