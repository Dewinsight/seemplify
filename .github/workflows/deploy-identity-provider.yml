# Deploy Identity Provider to Dokploy
name: Deploy Identity Provider

on:
  push:
    branches: [main]
    paths:
      - 'Identityprovider/**'
      - '.github/workflows/deploy-identity-provider.yml'
  workflow_dispatch:

env:
  APP_NAME: identity-provider
  APP_PATH: Identityprovider

jobs:
  deploy:
    name: Deploy to Dokploy
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Trigger Dokploy Deployment
        uses: benbristow/dokploy-deploy-action@0.0.1
        with:
          auth_token: ${{ secrets.DOKPLOY_TOKEN }}
          application_id: ${{ secrets.IDENTITY_PROVIDER_APP_ID }}
          dokploy_url: ${{ secrets.DOKPLOY_URL }}

      - name: Deployment Status
        if: success()
        run: echo "✅ ${{ env.APP_NAME }} deployment triggered successfully"
