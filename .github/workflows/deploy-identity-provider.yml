# Deploy Identity Provider and provision its Messaging OIDC trust.
name: Deploy Identity Provider

on:
  push:
    branches: [main]
    paths:
      - 'Identityprovider/**'
      - 'tools/messaging-oidc/**'
      - 'tools/chatgpt-gateway/dokploy-configure.cjs'
      - '.github/workflows/deploy-identity-provider.yml'
  workflow_dispatch:

env:
  APP_NAME: identity-provider
  APP_PATH: Identityprovider

jobs:
  deploy:
    name: Deploy to Dokploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify Workspace identity and team contracts
        run: node --test Identityprovider/test/messaging-oidc-client.test.mjs Identityprovider/test/internal-membership-teams.test.mjs tools/messaging-oidc/dokploy-configure.test.cjs

      - name: Configure and deploy Messaging OIDC trust
        env:
          DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
          DOKPLOY_TOKEN: ${{ secrets.DOKPLOY_TOKEN }}
          IDENTITY_PROVIDER_APP_ID: ${{ secrets.IDENTITY_PROVIDER_APP_ID }}
          MESSAGING_BACKEND_APP_ID: ${{ secrets.MESSAGING_BACKEND_APP_ID }}
          IDP_WEBHOOK_MASTER_SECRET: ${{ secrets.IDP_WEBHOOK_MASTER_SECRET }}
        run: node tools/messaging-oidc/dokploy-configure.cjs
