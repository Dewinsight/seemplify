name: Validate Runner Deployment Queue

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: self-hosted-runner-queue-validation
  cancel-in-progress: false
  queue: max

jobs:
  queue-probe:
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, dewinsight-kvm8-seemplify]
    timeout-minutes: 3
    steps:
      - name: Hold one queue slot without changing production
        run: |
          set -euo pipefail
          printf 'runner=%s run=%s started=%s\n' "$RUNNER_NAME" "$GITHUB_RUN_ID" "$(date -u +%FT%TZ)"
          sleep 40
          printf 'completed=%s\n' "$(date -u +%FT%TZ)"
