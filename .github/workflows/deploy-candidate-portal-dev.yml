# Deploy Candidate Portal to Dokploy (Development Environment)
name: Deploy Candidate Portal (Dev)

on:
  push:
    branches: [dev]
    paths:
      - 'recruiter/candidates/**'
      - '.github/workflows/deploy-candidate-portal-dev.yml'
  workflow_dispatch:

env:
  APP_NAME: candidate-portal-dev
  APP_PATH: recruiter/candidates
  ENVIRONMENT: development

jobs:
  deploy:
    name: Deploy to Dokploy (Dev)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Trigger Dokploy Deployment
        run: |
          response=$(curl -s -w "%{http_code}" -o /tmp/response.txt -X POST "${{ secrets.DOKPLOY_URL }}/api/application.deploy" \
            -H "x-api-key: ${{ secrets.DOKPLOY_TOKEN }}" \
            -H "Content-Type: application/json" \
            -H "accept: application/json" \
            -d '{"applicationId": "${{ secrets.CANDIDATE_PORTAL_DEV_APP_ID }}"}')

          if [ "$response" -eq 200 ]; then
            echo "${{ env.APP_NAME }} deployment triggered successfully (HTTP $response)"
            cat /tmp/response.txt 2>/dev/null || true
          else
            echo "Deployment failed with HTTP status code: $response"
            cat /tmp/response.txt 2>/dev/null || true
            exit 1
          fi
