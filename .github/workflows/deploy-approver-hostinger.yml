name: Deploy Approver to Hostinger

on:
  push:
    branches: [main]
    paths:
      - 'approver/**'
      - 'Identityprovider/clients.json'
      - 'Identityprovider/src/config/hubApps.js'
      - 'Identityprovider/src/services/webhookService.js'
      - 'deploy/hostinger/core-apps.compose.yml'
      - 'deploy/hostinger/generate-idp-clients.sh'
      - 'deploy/hostinger/smoke-hostinger.sh'
      - '.github/workflows/deploy-approver-hostinger.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hostinger-production-deployments
  cancel-in-progress: false

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            approver/backend/package-lock.json
            approver/frontend/package-lock.json

      - name: Test Approver backend
        working-directory: approver/backend
        run: |
          npm ci
          npm run test:idp
          node --test tests/approvalEngine.test.js tests/authSession.test.js

      - name: Build Approver frontend
        working-directory: approver/frontend
        run: |
          npm ci
          npm run build

      - name: Test IdP client and webhook contracts
        working-directory: Identityprovider
        run: |
          npm install --ignore-scripts
          node --test test/approver-oidc-client.test.mjs test/webhook-target-secrets.test.mjs

  deploy:
    needs: qa
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.HOSTINGER_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.HOSTINGER_SSH_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Package release
        run: |
          tar -czf approver-release.tgz \
            approver \
            Identityprovider \
            deploy/hostinger/core-apps.compose.yml \
            deploy/hostinger/generate-idp-clients.sh \
            deploy/hostinger/smoke-hostinger.sh

      - name: Upload release
        env:
          SSH_HOST: ${{ secrets.HOSTINGER_SSH_HOST }}
          SSH_USER: ${{ secrets.HOSTINGER_SSH_USER }}
        run: scp approver-release.tgz "$SSH_USER@$SSH_HOST:/opt/seemplify/build/approver-release-${GITHUB_SHA}.tgz"

      - name: Build and deploy immutable release
        env:
          SSH_HOST: ${{ secrets.HOSTINGER_SSH_HOST }}
          SSH_USER: ${{ secrets.HOSTINGER_SSH_USER }}
        run: |
          ssh "$SSH_USER@$SSH_HOST" "RELEASE_SHA='$GITHUB_SHA' bash -s" <<'REMOTE'
          set -euo pipefail
          release_root="/opt/seemplify/releases/$RELEASE_SHA"
          archive="/opt/seemplify/build/approver-release-$RELEASE_SHA.tgz"
          install -d -m 700 "$release_root"
          tar -xzf "$archive" -C "$release_root"

          approver_image="seemplify/approver:hostinger-$RELEASE_SHA"
          identity_image="seemplify/identity-provider:hostinger-$RELEASE_SHA"
          docker build --pull -t "$approver_image" "$release_root/approver"
          docker build --pull -t "$identity_image" "$release_root/Identityprovider"

          cp -a "$release_root/approver/." /opt/seemplify/source/approver/
          cp -a "$release_root/Identityprovider/." /opt/seemplify/source/Identityprovider/
          install -m 644 "$release_root/deploy/hostinger/core-apps.compose.yml" /opt/seemplify/deploy/hostinger/core-apps.compose.yml
          install -m 755 "$release_root/deploy/hostinger/generate-idp-clients.sh" /opt/seemplify/deploy/hostinger/generate-idp-clients.sh
          install -m 755 "$release_root/deploy/hostinger/smoke-hostinger.sh" /opt/seemplify/deploy/hostinger/smoke-hostinger.sh
          install -m 755 "$release_root/deploy/hostinger/smoke-hostinger.sh" /usr/local/sbin/seemplify-smoke
          IDENTITY_PROVIDER_IMAGE="$identity_image" /opt/seemplify/deploy/hostinger/generate-idp-clients.sh

          export APPROVER_IMAGE="$approver_image"
          export IDENTITY_PROVIDER_IMAGE="$identity_image"
          compose=(docker compose
            --env-file /opt/seemplify/secrets/shared-infrastructure.env
            --env-file /opt/seemplify/secrets/core-apps.env
            -f /opt/seemplify/deploy/hostinger/core-apps.compose.yml)

          wait_healthy() {
            local container="$1"
            for _ in $(seq 1 45); do
              state=$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' "$container")
              [[ "$state" == healthy ]] && return 0
              [[ "$state" == unhealthy || "$state" == exited || "$state" == dead ]] && break
              sleep 2
            done
            docker logs --tail 120 "$container" >&2 || true
            return 1
          }

          "${compose[@]}" up -d --no-deps --force-recreate approver
          wait_healthy seemplify-core-approver-1
          "${compose[@]}" up -d --no-deps --force-recreate identity-provider
          wait_healthy seemplify-core-identity-provider-1
          /usr/local/sbin/seemplify-smoke
          rm -f "$archive"
          REMOTE
