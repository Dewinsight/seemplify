name: Configure Presence Reporting

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  configure:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure shared presence service authentication
        env:
          DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
          DOKPLOY_TOKEN: ${{ secrets.DOKPLOY_TOKEN }}
          PRESENCE_REPORTER_SERVICE_SECRET: ${{ secrets.PRESENCE_REPORTER_SERVICE_SECRET }}
          RECRUITER_BACKEND_APP_ID: ${{ secrets.RECRUITER_BACKEND_APP_ID }}
          TIME_ATTENDANCE_BACKEND_APP_ID: ${{ secrets.TIME_ATTENDANCE_BACKEND_APP_ID }}
        run: node scripts/configure-presence-reporting.mjs

      - name: Verify services and presence authentication
        run: |
          for attempt in $(seq 1 45); do
            recruiter_status=$(curl -sS -o /tmp/recruiter-health.txt -w "%{http_code}" https://api.seemplifyai.com/api/health || true)
            time_status=$(curl -sS -o /tmp/time-health.txt -w "%{http_code}" https://api-time.seemplifyai.com/health || true)
            presence_status=$(curl -sS -o /tmp/presence-response.txt -w "%{http_code}" \
              -X POST -H "content-type: application/json" -d '{}' \
              https://api-time.seemplifyai.com/api/internal/v1/presence/sessions || true)

            if [ "$recruiter_status" = "200" ] && [ "$time_status" = "200" ] && [ "$presence_status" = "401" ]; then
              echo "Recruiter, time-attendance, and presence authentication are healthy."
              exit 0
            fi

            echo "Attempt ${attempt}/45: recruiter=${recruiter_status}, time=${time_status}, presence=${presence_status}"
            sleep 6
          done

          echo "Presence reporting configuration did not become healthy."
          cat /tmp/presence-response.txt 2>/dev/null || true
          exit 1
