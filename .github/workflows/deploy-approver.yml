# Deploy Approver Application to Dokploy
# DISABLED: This workflow was for the old combined app. Use deploy-approver-backend.yml and deploy-approver-frontend.yml instead.

name: Deploy Approver to Dokploy (DISABLED)

on:
  # Disabled - use deploy-approver-backend.yml and deploy-approver-frontend.yml instead
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "yes" to confirm deployment'
        required: true
        type: string

jobs:
  deploy:
    name: Deploy Approver Application
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Trigger Dokploy Deployment
        run: |
          if [ "${{ github.event.inputs.confirm }}" != "yes" ]; then
            echo "❌ Deployment cancelled: confirmation required"
            exit 1
          fi
          
          response=$(curl -s -w "%{http_code}" -o /tmp/response.txt -X POST "${{ secrets.DOKPLOY_URL }}/api/application.deploy" \
            -H "x-api-key: ${{ secrets.DOKPLOY_TOKEN }}" \
            -H "Content-Type: application/json" \
            -H "accept: application/json" \
            -d '{"applicationId": "${{ secrets.APPROVER_APP_ID }}"}')
          
          if [ "$response" -eq 200 ]; then
            echo "✅ Deployment triggered successfully (HTTP $response)"
            cat /tmp/response.txt 2>/dev/null || true
          else
            echo "❌ Deployment failed with HTTP status code: $response"
            cat /tmp/response.txt 2>/dev/null || true
            exit 1
          fi
