# Deploy UBA FastLane to Dokploy
# Auto-deploys on push to uba_branch_optimsation/ or manual trigger
# URL: https://uba.seemplifyai.com

name: Deploy UBA FastLane

on:
  push:
    branches: [main, master]
    paths:
      - 'uba_branch_optimsation/**'
      - '.github/workflows/deploy-uba.yml'
  workflow_dispatch:

env:
  APP_NAME: uba-fastlane
  APP_PATH: uba_branch_optimsation

jobs:
  deploy:
    name: Deploy UBA FastLane to Dokploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Fix Dokploy app config
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H 4.180.153.209 >> ~/.ssh/known_hosts
          ssh -o StrictHostKeyChecking=accept-new seemplify@4.180.153.209 'PG=$(docker ps -q -f name=dokploy-postgres | head -1) && [ -n "$PG" ] && {
            docker exec $PG psql -U dokploy -d dokploy -c "UPDATE application SET \"createEnvFile\" = false, \"customGitBranch\" = '\''master'\'', \"buildPath\" = NULL, \"customGitBuildPath\" = NULL, dockerfile = '\''./uba_branch_optimsation/Dockerfile'\'', \"dockerContextPath\" = '\''./uba_branch_optimsation'\'', \"applicationStatus\" = '\''idle'\'' WHERE \"applicationId\" = '\''_3NtFvqF3tUk2gEiRVIzE'\'';" 2>/dev/null
            docker exec $PG psql -U dokploy -d dokploy -c "UPDATE domain SET port = 8050 WHERE \"applicationId\" = '\''_3NtFvqF3tUk2gEiRVIzE'\'' AND host = '\''uba.seemplifyai.com'\'';" 2>/dev/null
            echo "Dokploy config fixed: branch=master, buildPath=NULL, customGitBuildPath=NULL (no path doubling), dockerContextPath=./uba_branch_optimsation, port=8050"
          }'

      - name: Trigger Dokploy Deployment
        run: |
          echo "🚀 Deploying UBA FastLane (queueing theory dashboard) to Dokploy..."
          response=$(curl -s -w "%{http_code}" -o /tmp/response.txt -X POST "${{ secrets.DOKPLOY_URL }}/api/application.deploy" \
            -H "x-api-key: ${{ secrets.DOKPLOY_TOKEN }}" \
            -H "Content-Type: application/json" \
            -H "accept: application/json" \
            -d '{"applicationId": "${{ secrets.UBA_FASTLANE_APP_ID }}"}')
          
          if [ "$response" -eq 200 ]; then
            echo "✅ ${{ env.APP_NAME }} deployment triggered successfully (HTTP $response)"
            cat /tmp/response.txt 2>/dev/null || true
            echo ""
            echo "📍 Dashboard: https://uba.seemplifyai.com"
            echo "⏱️  Build typically takes 3-5 minutes."
          else
            echo "❌ Deployment failed with HTTP status code: $response"
            cat /tmp/response.txt 2>/dev/null || true
            exit 1
          fi
