name: Deploy Experience to Hostinger

on:
  push:
    branches: [main]
    paths:
      - 'experience-management/**'
      - 'tools/local-knowledge/**'
      - 'ai-interview/**'
      - 'marketing-site/**'
      - 'Identityprovider/**'
      - 'recruiter/backend/config/aiRuntimeCatalog.js'
      - 'recruiter/backend/middleware/internalServiceAuth.js'
      - 'recruiter/backend/models/AIUserRuntimeAccount.js'
      - 'recruiter/backend/routes/internalAI.js'
      - 'recruiter/backend/services/aiRuntime/codexAccountService.js'
      - 'deploy/hostinger/core-apps.compose.yml'
      - 'deploy/hostinger/extended-apps.compose.yml'
      - 'deploy/hostinger/generate-idp-clients.sh'
      - 'deploy/hostinger/github-actions-ssh-retry.sh'
      - 'deploy/hostinger/smoke-hostinger.sh'
      - '.github/workflows/deploy-experience-hostinger.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hostinger-experience-production
  cancel-in-progress: false

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: experience-management/package-lock.json
      - name: Build and test Experience OIDC provisioning
        working-directory: experience-management
        run: |
          npm ci
          npm run build
          npx tsx --test backend/test/idp-provisioning.test.ts
      - name: Test production knowledge runtime contracts
        working-directory: tools/local-knowledge
        run: node --test embedding-profiles.test.cjs runtime.test.cjs server.test.cjs
      - name: Test IdP Hub contracts
        working-directory: Identityprovider
        run: |
          npm ci --ignore-scripts
          node --test test/hub-pins.test.mjs test/auth-redirects.test.mjs test/nylas-platform-configuration.test.mjs test/media-platform-configuration.test.mjs test/recruiter-admin-sso-secret.test.mjs
      - name: Test shared gateway authentication
        working-directory: recruiter/backend
        run: node --test tests/internalServiceAuth.test.js
      - name: Test AI Interview platform configuration
        working-directory: ai-interview/backend
        run: |
          npm ci --ignore-scripts
          npm run check
          node --test test/platformConfigurationClient.test.js
      - name: Build and test AI Interview frontend
        working-directory: ai-interview/frontend
        run: |
          corepack pnpm install --frozen-lockfile --ignore-scripts
          corepack pnpm run typecheck
          corepack pnpm run test:cv-upload
          corepack pnpm run build
      - name: Build marketing site
        working-directory: marketing-site
        run: |
          npm ci --ignore-scripts
          npm run build

  deploy:
    needs: qa
    runs-on: ubuntu-latest
    concurrency:
      group: hostinger-production-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.HOSTINGER_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.HOSTINGER_SSH_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          printf 'Host *\n  ConnectionAttempts 2\n  ConnectTimeout 20\n  ServerAliveInterval 15\n  ServerAliveCountMax 4\n' > ~/.ssh/config
          chmod 600 ~/.ssh/config
      - name: Package release
        run: |
          tar -czf experience-release.tgz \
            experience-management Identityprovider recruiter/backend ai-interview marketing-site \
            tools/local-knowledge tools/local-llm/service-auth.cjs \
            deploy/hostinger/core-apps.compose.yml \
            deploy/hostinger/extended-apps.compose.yml \
            deploy/hostinger/generate-idp-clients.sh \
            deploy/hostinger/smoke-hostinger.sh
      - name: Upload release
        env:
          SSH_HOST: ${{ secrets.HOSTINGER_SSH_HOST }}
          SSH_USER: ${{ secrets.HOSTINGER_SSH_USER }}
        run: |
          source deploy/hostinger/github-actions-ssh-retry.sh
          hostinger_scp experience-release.tgz "$SSH_USER@$SSH_HOST:/opt/seemplify/build/experience-release-${GITHUB_SHA}.tgz"
      - name: Upload Azure embedding credential
        env:
          SSH_HOST: ${{ secrets.HOSTINGER_SSH_HOST }}
          SSH_USER: ${{ secrets.HOSTINGER_SSH_USER }}
          AZURE_OPENAI_EMBEDDING_API_KEY: ${{ secrets.AZURE_OPENAI_EMBEDDING_API_KEY }}
        run: |
          umask 077
          test -n "$AZURE_OPENAI_EMBEDDING_API_KEY"
          printf '%s' "$AZURE_OPENAI_EMBEDDING_API_KEY" >/tmp/azure-openai-embedding
          source deploy/hostinger/github-actions-ssh-retry.sh
          hostinger_scp /tmp/azure-openai-embedding "$SSH_USER@$SSH_HOST:/tmp/azure-openai-embedding-${GITHUB_SHA}"
          rm -f /tmp/azure-openai-embedding
      - name: Build and deploy immutable release
        env:
          SSH_HOST: ${{ secrets.HOSTINGER_SSH_HOST }}
          SSH_USER: ${{ secrets.HOSTINGER_SSH_USER }}
        run: |
          source deploy/hostinger/github-actions-ssh-retry.sh
          hostinger_ssh_stdin "$SSH_USER@$SSH_HOST" \
            "RELEASE_SHA='$GITHUB_SHA' flock --exclusive --wait 1800 /var/lock/seemplify-production-deploy.lock bash -s" <<'REMOTE'
          set -euo pipefail
          release_root="/opt/seemplify/releases/$RELEASE_SHA"
          archive="/opt/seemplify/build/experience-release-$RELEASE_SHA.tgz"
          install -d -m 700 "$release_root"
          tar -xzf "$archive" -C "$release_root"

          experience_image="seemplify/experience:hostinger-$RELEASE_SHA"
          identity_image="seemplify/identity-provider:hostinger-$RELEASE_SHA"
          recruiter_image="seemplify/recruiter-backend:hostinger-$RELEASE_SHA"
          ai_interview_image="seemplify/ai-interview-backend:hostinger-$RELEASE_SHA"
          ai_interview_frontend_image="seemplify/ai-interview-frontend:hostinger-$RELEASE_SHA"
          marketing_image="seemplify/marketing:hostinger-$RELEASE_SHA"
          knowledge_image="seemplify/knowledge-runtime:hostinger-$RELEASE_SHA"
          docker build --pull --label "org.opencontainers.image.revision=$RELEASE_SHA" \
            -t "$experience_image" "$release_root/experience-management"
          docker build --pull --label "org.opencontainers.image.revision=$RELEASE_SHA" \
            -t "$identity_image" "$release_root/Identityprovider"
          docker build --pull --label "org.opencontainers.image.revision=$RELEASE_SHA" \
            -t "$recruiter_image" "$release_root/recruiter/backend"
          docker build --pull --label "org.opencontainers.image.revision=$RELEASE_SHA" \
            -t "$ai_interview_image" "$release_root/ai-interview/backend"
          docker build --pull --label "org.opencontainers.image.revision=$RELEASE_SHA" \
            -t "$ai_interview_frontend_image" "$release_root/ai-interview/frontend"
          docker build --pull --label "org.opencontainers.image.revision=$RELEASE_SHA" \
            -t "$marketing_image" "$release_root/marketing-site"
          docker build --pull -f "$release_root/tools/local-knowledge/Dockerfile" \
            --label "org.opencontainers.image.revision=$RELEASE_SHA" \
            -t "$knowledge_image" "$release_root/tools"

          cp -a "$release_root/experience-management/." /opt/seemplify/source/experience-management/
          cp -a "$release_root/Identityprovider/." /opt/seemplify/source/Identityprovider/
          cp -a "$release_root/recruiter/backend/." /opt/seemplify/source/recruiter/backend/
          install -d -m 750 /opt/seemplify/source/ai-interview/backend
          cp -a "$release_root/ai-interview/backend/." /opt/seemplify/source/ai-interview/backend/
          install -d -m 750 /opt/seemplify/source/ai-interview/frontend
          cp -a "$release_root/ai-interview/frontend/." /opt/seemplify/source/ai-interview/frontend/
          cp -a "$release_root/marketing-site/." /opt/seemplify/source/marketing-site/
          install -m 644 "$release_root/deploy/hostinger/core-apps.compose.yml" /opt/seemplify/deploy/hostinger/core-apps.compose.yml
          install -m 644 "$release_root/deploy/hostinger/extended-apps.compose.yml" /opt/seemplify/deploy/hostinger/extended-apps.compose.yml
          install -m 755 "$release_root/deploy/hostinger/generate-idp-clients.sh" /opt/seemplify/deploy/hostinger/generate-idp-clients.sh
          install -m 755 "$release_root/deploy/hostinger/smoke-hostinger.sh" /opt/seemplify/deploy/hostinger/smoke-hostinger.sh
          install -m 755 "$release_root/deploy/hostinger/smoke-hostinger.sh" /usr/local/sbin/seemplify-smoke
          IDENTITY_PROVIDER_IMAGE="$identity_image" /opt/seemplify/deploy/hostinger/generate-idp-clients.sh

          test -s /opt/seemplify/secrets/platform-integrations/credential-encryption-key
          test -s /opt/seemplify/secrets/platform-integrations/experience-hmac-secret
          knowledge_secret_dir=/opt/seemplify/secrets/knowledge
          install -d -o root -g root -m 0700 "$knowledge_secret_dir"
          install -o root -g root -m 0640 "/tmp/azure-openai-embedding-$RELEASE_SHA" \
            "$knowledge_secret_dir/azure-openai-embedding"
          rm -f "/tmp/azure-openai-embedding-$RELEASE_SHA"
          for name in knowledge-runtime-hmac docling-api; do
            target="$knowledge_secret_dir/$name"
            if [[ ! -s "$target" ]]; then
              openssl rand -base64 48 | tr -d '\n' >"$target"
            fi
            chown root:root "$target"
            chmod 0640 "$target"
          done
          docker inspect --format '{{range .Config.Env}}{{println .}}{{end}}' \
            seemplify-core-recruiter-backend-1 \
            | awk -F= '$1=="EXPERIENCE_AI_SHARED_SECRET"{sub(/^[^=]*=/,""); print; exit}' \
            >"$knowledge_secret_dir/chatgpt-gateway"
          test -s "$knowledge_secret_dir/chatgpt-gateway"
          chown root:root "$knowledge_secret_dir/chatgpt-gateway"
          chmod 0640 "$knowledge_secret_dir/chatgpt-gateway"
          for name in arango-app arango-provisioner; do
            test -s "$knowledge_secret_dir/$name"
            chown root:root "$knowledge_secret_dir/$name"
            chmod 0640 "$knowledge_secret_dir/$name"
          done
          chown root:root /opt/seemplify/secrets/platform-integrations/experience-hmac-secret
          chmod 0640 /opt/seemplify/secrets/platform-integrations/experience-hmac-secret

          export EXPERIENCE_IMAGE="$experience_image"
          export IDENTITY_PROVIDER_IMAGE="$identity_image"
          export RECRUITER_BACKEND_IMAGE="$recruiter_image"
          export AI_INTERVIEW_BACKEND_IMAGE="$ai_interview_image"
          export AI_INTERVIEW_FRONTEND_IMAGE="$ai_interview_frontend_image"
          export MARKETING_IMAGE="$marketing_image"
          export KNOWLEDGE_RUNTIME_IMAGE="$knowledge_image"
          core=(docker compose --env-file /opt/seemplify/secrets/shared-infrastructure.env --env-file /opt/seemplify/secrets/core-apps.env -f /opt/seemplify/deploy/hostinger/core-apps.compose.yml)
          extended=(docker compose --env-file /opt/seemplify/secrets/shared-infrastructure.env --env-file /opt/seemplify/secrets/core-apps.env -f /opt/seemplify/deploy/hostinger/extended-apps.compose.yml)
          docker volume create seemplify-extended_experience_runtime >/dev/null
          docker run --rm --user 0:0 --entrypoint sh \
            -v /opt/seemplify/secrets/platform-integrations/experience-hmac-secret:/source-hmac:ro \
            -v seemplify-extended_experience_runtime:/target \
            "$experience_image" \
            -c 'install -o 1000 -g 1000 -m 0400 /source-hmac /target/platform-integration-experience-hmac'
          wait_healthy() {
            local container="$1"
            for _ in $(seq 1 60); do
              state=$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' "$container")
              [[ "$state" == healthy || "$state" == running ]] && return 0
              [[ "$state" == unhealthy || "$state" == exited || "$state" == dead ]] && break
              sleep 2
            done
            docker logs --tail 120 "$container" >&2 || true
            return 1
          }
          "${core[@]}" up -d --no-deps --force-recreate recruiter-backend
          wait_healthy seemplify-core-recruiter-backend-1
          "${extended[@]}" up -d --no-deps --force-recreate knowledge-docling
          wait_healthy seemplify-extended-knowledge-docling-1
          "${extended[@]}" up -d --no-deps --force-recreate knowledge-runtime
          wait_healthy seemplify-extended-knowledge-runtime-1
          docker exec seemplify-extended-knowledge-runtime-1 sh -ec '
            node client.cjs status >/tmp/knowledge-status.json
            node -e "const s=require(\"/tmp/knowledge-status.json\"); process.exit(s.ready && s.services?.arango?.healthy && s.services?.embedding?.healthy && s.services?.docling?.healthy && s.services?.chatgpt?.healthy ? 0 : 1)"
            rm -f /tmp/knowledge-status.json
          '
          "${extended[@]}" up -d --no-deps --force-recreate experience
          wait_healthy seemplify-extended-experience-1
          "${extended[@]}" up -d --no-deps --force-recreate ai-interview-backend
          wait_healthy seemplify-extended-ai-interview-backend-1
          "${extended[@]}" up -d --no-deps --force-recreate ai-interview-frontend marketing
          wait_healthy seemplify-extended-ai-interview-frontend-1
          wait_healthy seemplify-extended-marketing-1
          "${core[@]}" up -d --no-deps --force-recreate identity-provider
          wait_healthy seemplify-core-identity-provider-1
          for container in \
            seemplify-core-identity-provider-1 \
            seemplify-core-recruiter-backend-1 \
            seemplify-extended-experience-1 \
            seemplify-extended-knowledge-runtime-1 \
            seemplify-extended-ai-interview-backend-1 \
            seemplify-extended-ai-interview-frontend-1 \
            seemplify-extended-marketing-1; do
            revision=$(docker inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$container")
            printf 'release %-48s expected=%s actual=%s\n' "$container" "$RELEASE_SHA" "${revision:-missing}"
            [[ "$revision" == "$RELEASE_SHA" ]]
          done
          /usr/local/sbin/seemplify-smoke
          rm -f "$archive"
          REMOTE
