# Deploy All Applications to Dokploy
# Use this to manually trigger deployment of all apps at once
name: Deploy All Applications

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "deploy-all" to confirm deployment of all applications'
        required: true
        type: string

jobs:
  validate:
    name: Validate Confirmation
    runs-on: ubuntu-latest
    steps:
      - name: Check confirmation
        if: ${{ github.event.inputs.confirm != 'deploy-all' }}
        run: |
          echo "❌ Confirmation failed. You must type 'deploy-all' to proceed."
          exit 1

  deploy-backends:
    name: Deploy All Backends
    needs: validate
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: recruiter-backend
            app_id_secret: RECRUITER_BACKEND_APP_ID
          - name: leave-backend
            app_id_secret: LEAVE_BACKEND_APP_ID
          - name: performance-backend
            app_id_secret: PERFORMANCE_BACKEND_APP_ID
          - name: payroll-backend
            app_id_secret: PAYROLL_BACKEND_APP_ID
          - name: identity-provider
            app_id_secret: IDENTITY_PROVIDER_APP_ID
    
    steps:
      - name: Deploy ${{ matrix.name }}
        uses: benbristow/dokploy-deploy-action@0.0.1
        with:
          api_token: ${{ secrets.DOKPLOY_TOKEN }}
          application_id: ${{ secrets[matrix.app_id_secret] }}
          dokploy_url: ${{ secrets.DOKPLOY_URL }}
      
      - name: Deployment Status
        run: echo "✅ ${{ matrix.name }} deployment triggered"

  deploy-frontends:
    name: Deploy All Frontends
    needs: deploy-backends
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: recruiter-frontend
            app_id_secret: RECRUITER_FRONTEND_APP_ID
          - name: leave-frontend
            app_id_secret: LEAVE_FRONTEND_APP_ID
          - name: performance-frontend
            app_id_secret: PERFORMANCE_FRONTEND_APP_ID
          - name: payroll-frontend
            app_id_secret: PAYROLL_FRONTEND_APP_ID
    
    steps:
      - name: Deploy ${{ matrix.name }}
        uses: benbristow/dokploy-deploy-action@0.0.1
        with:
          api_token: ${{ secrets.DOKPLOY_TOKEN }}
          application_id: ${{ secrets[matrix.app_id_secret] }}
          dokploy_url: ${{ secrets.DOKPLOY_URL }}
      
      - name: Deployment Status
        run: echo "✅ ${{ matrix.name }} deployment triggered"

  summary:
    name: Deployment Summary
    needs: [deploy-backends, deploy-frontends]
    runs-on: ubuntu-latest
    steps:
      - name: Summary
        run: |
          echo "=========================================="
          echo "  All Applications Deployed!"
          echo "=========================================="
          echo ""
          echo "Backends:"
          echo "  ✅ recruiter-backend"
          echo "  ✅ leave-backend"
          echo "  ✅ performance-backend"
          echo "  ✅ payroll-backend"
          echo "  ✅ identity-provider"
          echo ""
          echo "Frontends:"
          echo "  ✅ recruiter-frontend"
          echo "  ✅ leave-frontend"
          echo "  ✅ performance-frontend"
          echo "  ✅ payroll-frontend"
          echo ""
          echo "Check Dokploy dashboard for deployment status."
