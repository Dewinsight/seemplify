# Deploy Payroll Frontend to Dokploy
name: Deploy Payroll Frontend

on:
  push:
    branches: [main]
    paths:
      - 'payroll/frontend/**'
      - '.github/workflows/deploy-payroll-frontend.yml'
  workflow_dispatch:

env:
  APP_NAME: payroll-frontend
  APP_PATH: payroll/frontend

jobs:
  deploy:
    name: Deploy to Dokploy
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Trigger Dokploy Deployment
        uses: benbristow/dokploy-deploy-action@0.0.1
        with:
          api_token: ${{ secrets.DOKPLOY_TOKEN }}
          application_id: ${{ secrets.PAYROLL_FRONTEND_APP_ID }}
          dokploy_url: ${{ secrets.DOKPLOY_URL }}

      - name: Deployment Status
        if: success()
        run: echo "✅ ${{ env.APP_NAME }} deployment triggered successfully"
