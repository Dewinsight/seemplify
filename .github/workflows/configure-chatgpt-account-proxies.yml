name: Configure ChatGPT Account Proxies

on:
  push:
    branches: [main]
    paths:
      - 'recruiter/backend/routes/internalAI.js'
      - 'recruiter/backend/services/aiRuntime/codexAccountService.js'
      - 'recruiter/backend/services/aiRuntime/sharedIdentityService.js'
      - 'recruiter/backend/middleware/internalServiceAuth.js'
      - 'performance/backend/services/sharedAIAccountService.js'
      - 'performance/backend/routes/aiAccount.js'
      - 'performance/backend/services/deploymentHealthSecurity.js'
      - 'performance/backend/models/DeploymentHealthNonce.js'
      - 'tools/chatgpt-gateway/consumer-registry.cjs'
      - 'tools/chatgpt-gateway/dokploy-configure.cjs'
      - 'tools/chatgpt-gateway/dokploy-configure.test.cjs'
      - 'tools/chatgpt-gateway/dokploy-configure-shared-account-proxies.cjs'
      - 'tools/chatgpt-gateway/dokploy-configure-shared-account-proxies.test.cjs'
      - '.github/workflows/configure-chatgpt-account-proxies.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: configure-chatgpt-account-proxies
  cancel-in-progress: false

jobs:
  configure:
    name: Configure central account consumers
    runs-on: ubuntu-latest
    # Keep this above three 30-minute sequential deployment polls, the
    # interrupted-authority readiness window, and both strict 20-minute
    # consumer end-to-end fallback windows, with room for post-deploy probes.
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - name: Verify proxy configuration contract
        run: node --test tools/chatgpt-gateway/dokploy-configure-shared-account-proxies.test.cjs
      - name: Configure and deploy shared-account proxies
        run: node tools/chatgpt-gateway/dokploy-configure-shared-account-proxies.cjs
        env:
          DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
          DOKPLOY_TOKEN: ${{ secrets.DOKPLOY_TOKEN }}
          RECRUITER_BACKEND_APP_ID: ${{ secrets.RECRUITER_BACKEND_APP_ID }}
          PERFORMANCE_BACKEND_APP_ID: ${{ secrets.PERFORMANCE_BACKEND_APP_ID }}
          MESSAGING_BACKEND_APP_ID: ${{ secrets.MESSAGING_BACKEND_APP_ID }}
          CHATGPT_GATEWAY_SHARED_SECRET: ${{ secrets.CHATGPT_GATEWAY_SHARED_SECRET }}
          SEEMPLIFY_SHARED_AI_URL: https://api.seemplifyai.com
          PERFORMANCE_MANAGEMENT_API_URL: ${{ vars.PERFORMANCE_MANAGEMENT_API_URL || 'https://api-performance.seemplifyai.com' }}
          MESSAGING_API_URL: ${{ vars.MESSAGING_API_URL || 'https://api-messaging.seemplifyai.com' }}
          SEEMPLIFY_PROXY_DEPLOYMENT_WAIT_ATTEMPTS: ${{ vars.SEEMPLIFY_PROXY_DEPLOYMENT_WAIT_ATTEMPTS || '900' }}
          SEEMPLIFY_PROXY_DEPLOYMENT_WAIT_DELAY_MS: ${{ vars.SEEMPLIFY_PROXY_DEPLOYMENT_WAIT_DELAY_MS || '2000' }}
          SEEMPLIFY_PROXY_READINESS_WAIT_ATTEMPTS: ${{ vars.SEEMPLIFY_PROXY_READINESS_WAIT_ATTEMPTS || '600' }}
          SEEMPLIFY_PROXY_READINESS_WAIT_DELAY_MS: ${{ vars.SEEMPLIFY_PROXY_READINESS_WAIT_DELAY_MS || '2000' }}
