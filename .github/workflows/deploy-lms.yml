# Deploy LMS to Dokploy-managed VM
name: Deploy LMS

on:
  push:
    branches: [main]
    paths:
      - "lms/**"
      - ".github/workflows/deploy-lms.yml"
  workflow_dispatch:

concurrency:
  group: deploy-lms
  cancel-in-progress: false

env:
  VM_HOST: 4.180.153.209
  VM_USER: seemplify
  LMS_SOURCE_PATH: /etc/dokploy/compose/lms-sj7l83/code

jobs:
  deploy:
    name: Deploy to Dokploy VM
    runs-on: ubuntu-latest

    steps:
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
        run: |
          key="${SSH_PRIVATE_KEY:-$VM_SSH_KEY}"
          if [ -z "$key" ]; then
            echo "[ERROR] Missing SSH_PRIVATE_KEY or VM_SSH_KEY secret."
            exit 1
          fi

          mkdir -p ~/.ssh
          printf '%s\n' "$key" > ~/.ssh/id_vm
          chmod 600 ~/.ssh/id_vm
          ssh-keyscan -H "$VM_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Pull, deploy stack, and wait for health
        run: |
          ssh -i ~/.ssh/id_vm -o StrictHostKeyChecking=no "$VM_USER@$VM_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail

          SRC="/etc/dokploy/compose/lms-sj7l83/code"
          SAFE="-c safe.directory=${SRC}"

          sudo git ${SAFE} -C "${SRC}" fetch origin main
          if [ -n "$(sudo git ${SAFE} -C "${SRC}" status --porcelain)" ]; then
            sudo git ${SAFE} -C "${SRC}" stash push -u -m "pre-gh-lms-deploy-$(date -u +%Y%m%dT%H%M%SZ)" >/dev/null
          fi
          sudo git ${SAFE} -C "${SRC}" checkout main
          sudo git ${SAFE} -C "${SRC}" pull --ff-only origin main
          echo "source=$(sudo git ${SAFE} -C "${SRC}" rev-parse --short HEAD)"

          sudo python3 - <<'PY'
          import os
          import subprocess
          from pathlib import Path

          src = Path("/etc/dokploy/compose/lms-sj7l83/code")
          env_path = src / "lms/docker/.env"

          for raw in env_path.read_text().splitlines():
              line = raw.strip()
              if not line or line.startswith("#") or "=" not in line:
                  continue
              key, value = line.split("=", 1)
              os.environ[key.strip()] = value.strip()

          subprocess.run(
              ["docker", "stack", "deploy", "-c", str(src / "lms/docker/docker-compose.yml"), "lms"],
              check=True,
          )
          PY

          for _ in $(seq 1 120); do
            replicas="$(docker service ls --filter name=lms_frappe --format '{{.Replicas}}' | head -n 1)"
            status="$(curl -k -s -o /dev/null -w '%{http_code}' https://lms.seemplifyai.com/lms || true)"

            if [ "${replicas}" = "1/1" ] && [ "${status}" = "200" ]; then
              echo "health=ok"
              exit 0
            fi

            echo "waiting replicas=${replicas:-none} status=${status:-none}"
            sleep 5
          done

          echo "[ERROR] LMS did not become healthy."
          docker service ps lms_frappe --no-trunc || true
          docker service logs lms_frappe --tail 120 || true
          exit 1
          REMOTE
