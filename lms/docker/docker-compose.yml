version: "3.7"
# Deployed as stack: lms
services:
  mariadb:
    image: mariadb:10.8
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --skip-character-set-client-handshake
      - --skip-innodb-read-only-compressed
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-secure_password_here}
    volumes:
      - mariadb-data:/var/lib/mysql
    networks:
      - lms-network

  redis:
    image: redis:alpine
    networks:
      - lms-network

  frappe:
    image: frappe/bench:latest
    command: bash /workspace/init.sh
    environment:
      - SHELL=/bin/bash
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:-secure_password_here}
    working_dir: /home/frappe
    volumes:
      - .:/workspace
      - frappe-data:/home/frappe
    networks:
      - lms-network
      - dokploy-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.lms.rule=Host(`lms.seemplifyai.com`)"
      - "traefik.http.routers.lms.entrypoints=websecure"
      - "traefik.http.routers.lms.tls.certresolver=letsencrypt"
      - "traefik.http.services.lms.loadbalancer.server.port=8000"

volumes:
  mariadb-data:
  frappe-data:

networks:
  lms-network:
    driver: overlay
  dokploy-network:
    external: true