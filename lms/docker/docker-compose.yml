version: "3.7"
# Deployed as stack: lms
services:
  mariadb:
    image: mariadb:10.8
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --skip-character-set-client-handshake
      - --skip-innodb-read-only-compressed
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-secure_password_here}
    volumes:
      - mariadb-data:/var/lib/mysql
    networks:
      - lms-network

  redis:
    image: redis:alpine
    networks:
      - lms-network

  frappe:
    image: frappe/bench:latest
    # Only run init.sh on first deployment, not on every restart
    command: >
      bash -c "if [ -d /home/frappe/frappe-bench ] && [ -f /home/frappe/frappe-bench/sites/apps.txt ]; then
        echo 'LMS bench exists, starting...';
        cd /home/frappe/frappe-bench && sed -i '/socketio/d' Procfile 2>/dev/null || true;
        cd /home/frappe/frappe-bench && bench start;
      else
        echo 'Initializing LMS...';
        /workspace/init.sh;
      fi"
    environment:
      - SHELL=/bin/bash
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:-secure_password_here}
      - LMS_SITE_NAME=${LMS_SITE_NAME:-lms.seemplifyai.com}
      - LMS_HOSTNAME=${LMS_HOSTNAME:-lms.seemplifyai.com}
      - LMS_APP_NAME=${LMS_APP_NAME:-LMS by AIIN}
      - LMS_ADMIN_PASSWORD=${LMS_ADMIN_PASSWORD:-admin123}
      - LMS_DEVELOPER_MODE=${LMS_DEVELOPER_MODE:-1}
      - LMS_APP_SOURCE_PATH=${LMS_APP_SOURCE_PATH:-/lms-app}
      - BREVO_SMTP_KEY=${BREVO_SMTP_KEY:-}
      - BREVO_SMTP_LOGIN=${BREVO_SMTP_LOGIN:-}
      - BREVO_API_KEY=${BREVO_API_KEY:-}
      - BREVO_FROM_EMAIL=${BREVO_FROM_EMAIL:-}
      - SENDER_EMAIL=${SENDER_EMAIL:-}
      - SENDER_NAME=${SENDER_NAME:-}
    working_dir: /home/frappe
    volumes:
      - .:/workspace
      - ../:/lms-app
      - frappe-data:/home/frappe
    networks:
      - lms-network
      - dokploy-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.lms.rule=Host(`${LMS_HOSTNAME:-lms.seemplifyai.com}`)"
      - "traefik.http.routers.lms.entrypoints=websecure"
      - "traefik.http.routers.lms.tls.certresolver=letsencrypt"
      - "traefik.http.services.lms.loadbalancer.server.port=8002"

volumes:
  mariadb-data:
  frappe-data:

networks:
  lms-network:
    driver: overlay
  dokploy-network:
    external: true
