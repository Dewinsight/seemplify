/* ============================================================
   Learning Fun Theme v3 - Playful Nunito font, colorful icons
   ============================================================ */

/* === FONT: Playful rounded Nunito === */
*, *::before, *::after {
	font-family: 'Nunito', system-ui, -apple-system, sans-serif !important;
}

body, html, #app {
	font-family: 'Nunito', system-ui, -apple-system, sans-serif !important;
}

/* === Frappe UI Color Token Overrides === */
:root {
	--surface-menu-bar: #5B4AFF !important;
	--surface-selected: rgba(255, 255, 255, 0.15) !important;
	--surface-white: #F5F5FA !important;
	--surface-gray-2: #EEEDF5 !important;
	--surface-gray-3: #E5E3F0 !important;
	--surface-gray-4: #D8D5E8 !important;
	--surface-gray-5: #C8C4DC !important;
	--surface-gray-6: #9B96B8 !important;
	--surface-gray-7: #5B4AFF !important;
	--ink-gray-9: #1A1A2E !important;
	--ink-gray-8: #2D2D44 !important;
	--ink-gray-7: #4A4A6A !important;
	--ink-gray-5: #7A7A9A !important;
	--ink-gray-4: #A0A0BC !important;
	--ink-gray-3: #C0C0D4 !important;
	--outline-gray-1: rgba(91, 74, 255, 0.08) !important;
	--outline-gray-2: rgba(91, 74, 255, 0.14) !important;
	--outline-gray-3: rgba(91, 74, 255, 0.22) !important;
	--surface-modal: #FFFFFF !important;
	--ink-white: #FFFFFF !important;
	--lf-purple: #5B4AFF;
	--lf-purple-light: #7B6BFF;
	--lf-purple-dark: #4A39E6;
	--lf-orange: #FF6B4A;
	--lf-teal: #4ECDC4;
	--lf-gold: #FFD700;
	--lf-navy: #1A1A2E;
}

/* === SCROLLBARS === */
* { scrollbar-width: thin; scrollbar-color: rgba(91,74,255,0.3) transparent; }
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: rgba(91,74,255,0.3); border-radius: 10px; }

/* === SIDEBAR - Deep Purple Gradient === */
.bg-surface-menu-bar, div.bg-surface-menu-bar, .h-full.bg-surface-menu-bar,
.border-r.bg-surface-menu-bar, .h-full.border-r.bg-surface-menu-bar {
	background: linear-gradient(180deg, #5B4AFF 0%, #6C5CE7 40%, #7C6AFF 100%) !important;
}
.bg-surface-menu-bar, .bg-surface-menu-bar * { color: rgba(255, 255, 255, 0.92) !important; }
.border-r.bg-surface-menu-bar .text-ink-gray-5 { color: rgba(255, 255, 255, 0.6) !important; }
.border-r.bg-surface-menu-bar .text-ink-gray-7 { color: rgba(255, 255, 255, 0.7) !important; }
.flex.h-full.flex-col.justify-between.border-r { border-right-color: rgba(255, 255, 255, 0.1) !important; }

/* Sidebar active link */
.bg-surface-selected { background: rgba(255, 255, 255, 0.18) !important; border-radius: 10px !important; box-shadow: none !important; }
.bg-surface-menu-bar .bg-surface-selected { background: rgba(255, 255, 255, 0.18) !important; }
.bg-surface-menu-bar .shadow-sm { box-shadow: none !important; }

/* Sidebar hover */
.bg-surface-menu-bar .hover\:bg-surface-gray-2:hover,
.bg-surface-menu-bar .hover\:bg-surface-gray-3:hover { background: rgba(255, 255, 255, 0.1) !important; border-radius: 10px !important; }

/* Sidebar logo */
.bg-surface-menu-bar img.rounded, .bg-surface-menu-bar .rounded.flex-shrink-0 {
	border: 2px solid rgba(255, 255, 255, 0.3) !important;
	box-shadow: 0 0 12px rgba(255, 255, 255, 0.15) !important;
}
.bg-surface-menu-bar .text-ink-gray-9 { color: #FFFFFF !important; }
.bg-surface-menu-bar .bg-surface-modal { background: rgba(255, 255, 255, 0.12) !important; }
.bg-surface-menu-bar svg { color: rgba(255, 255, 255, 0.85) !important; stroke: rgba(255, 255, 255, 0.85) !important; }
.bg-surface-menu-bar button { color: rgba(255, 255, 255, 0.8) !important; }

/* =============================================
   COLORFUL SIDEBAR ICONS
   Each icon gets a colored circular background
   Sidebar structure: .mx-2.my-2\.5 > nav.space-y-1 > div > button
   Group 1 (General): Home, Search, Notifications
   Group 2 (Learning): Courses, Programs, Batches, Certifications, Jobs, Statistics
   Group 3 (Assessments): Quizzes, Assignments, Programming Exercises
   ============================================= */

/* Give all sidebar icon containers a small colored circle bg */
.bg-surface-menu-bar nav.space-y-1 .grid.place-items-center {
	width: 26px !important;
	height: 26px !important;
	border-radius: 7px !important;
	display: grid !important;
	place-items: center !important;
	transition: all 0.2s ease !important;
}

/* Group 1: General */
/* Home - warm orange */
.bg-surface-menu-bar .mx-2:nth-child(1) nav.space-y-1 > div:nth-child(1) .grid.place-items-center {
	background: rgba(255, 165, 0, 0.25) !important;
}
.bg-surface-menu-bar .mx-2:nth-child(1) nav.space-y-1 > div:nth-child(1) svg {
	color: #FFD93D !important; stroke: #FFD93D !important;
}
/* Search - cyan */
.bg-surface-menu-bar .mx-2:nth-child(1) nav.space-y-1 > div:nth-child(2) .grid.place-items-center {
	background: rgba(0, 184, 212, 0.2) !important;
}
.bg-surface-menu-bar .mx-2:nth-child(1) nav.space-y-1 > div:nth-child(2) svg {
	color: #80DEEA !important; stroke: #80DEEA !important;
}
/* Notifications - red/orange */
.bg-surface-menu-bar .mx-2:nth-child(1) nav.space-y-1 > div:nth-child(3) .grid.place-items-center {
	background: rgba(255, 107, 74, 0.25) !important;
}
.bg-surface-menu-bar .mx-2:nth-child(1) nav.space-y-1 > div:nth-child(3) svg {
	color: #FF8A65 !important; stroke: #FF8A65 !important;
}

/* Group 2: Learning */
/* Courses - green */
.bg-surface-menu-bar .mx-2:nth-child(2) nav.space-y-1 > div:nth-child(1) .grid.place-items-center {
	background: rgba(76, 208, 128, 0.25) !important;
}
.bg-surface-menu-bar .mx-2:nth-child(2) nav.space-y-1 > div:nth-child(1) svg {
	color: #69F0AE !important; stroke: #69F0AE !important;
}
/* Programs - pink */
.bg-surface-menu-bar .mx-2:nth-child(2) nav.space-y-1 > div:nth-child(2) .grid.place-items-center {
	background: rgba(240, 98, 146, 0.25) !important;
}
.bg-surface-menu-bar .mx-2:nth-child(2) nav.space-y-1 > div:nth-child(2) svg {
	color: #F48FB1 !important; stroke: #F48FB1 !important;
}
/* Batches - blue */
.bg-surface-menu-bar .mx-2:nth-child(2) nav.space-y-1 > div:nth-child(3) .grid.place-items-center {
	background: rgba(66, 165, 245, 0.25) !important;
}
.bg-surface-menu-bar .mx-2:nth-child(2) nav.space-y-1 > div:nth-child(3) svg {
	color: #90CAF9 !important; stroke: #90CAF9 !important;
}
/* Certifications - gold */
.bg-surface-menu-bar .mx-2:nth-child(2) nav.space-y-1 > div:nth-child(4) .grid.place-items-center {
	background: rgba(255, 215, 0, 0.2) !important;
}
.bg-surface-menu-bar .mx-2:nth-child(2) nav.space-y-1 > div:nth-child(4) svg {
	color: #FFD54F !important; stroke: #FFD54F !important;
}
/* Jobs - slate */
.bg-surface-menu-bar .mx-2:nth-child(2) nav.space-y-1 > div:nth-child(5) .grid.place-items-center {
	background: rgba(176, 190, 197, 0.2) !important;
}
.bg-surface-menu-bar .mx-2:nth-child(2) nav.space-y-1 > div:nth-child(5) svg {
	color: #B0BEC5 !important; stroke: #B0BEC5 !important;
}
/* Statistics - purple */
.bg-surface-menu-bar .mx-2:nth-child(2) nav.space-y-1 > div:nth-child(6) .grid.place-items-center {
	background: rgba(186, 104, 200, 0.25) !important;
}
.bg-surface-menu-bar .mx-2:nth-child(2) nav.space-y-1 > div:nth-child(6) svg {
	color: #CE93D8 !important; stroke: #CE93D8 !important;
}

/* Group 3: Assessments */
/* Quizzes - teal */
.bg-surface-menu-bar .mx-2:nth-child(3) nav.space-y-1 > div:nth-child(1) .grid.place-items-center {
	background: rgba(77, 208, 225, 0.2) !important;
}
.bg-surface-menu-bar .mx-2:nth-child(3) nav.space-y-1 > div:nth-child(1) svg {
	color: #80DEEA !important; stroke: #80DEEA !important;
}
/* Assignments - orange */
.bg-surface-menu-bar .mx-2:nth-child(3) nav.space-y-1 > div:nth-child(2) .grid.place-items-center {
	background: rgba(255, 183, 77, 0.2) !important;
}
.bg-surface-menu-bar .mx-2:nth-child(3) nav.space-y-1 > div:nth-child(2) svg {
	color: #FFB74D !important; stroke: #FFB74D !important;
}
/* Coding - lime green */
.bg-surface-menu-bar .mx-2:nth-child(3) nav.space-y-1 > div:nth-child(3) .grid.place-items-center {
	background: rgba(139, 195, 74, 0.2) !important;
}
.bg-surface-menu-bar .mx-2:nth-child(3) nav.space-y-1 > div:nth-child(3) svg {
	color: #AED581 !important; stroke: #AED581 !important;
}

/* === SIDEBAR SCOPED INK OVERRIDES === */
.flex.h-screen.w-screen > .h-full.border-r.bg-surface-menu-bar,
.flex.h-screen.w-screen > .h-full.border-r.bg-surface-menu-bar * {
	--ink-gray-9: #FFFFFF !important; --ink-gray-8: rgba(255,255,255,0.9) !important;
	--ink-gray-7: rgba(255,255,255,0.7) !important; --ink-gray-5: rgba(255,255,255,0.55) !important;
}
.flex.h-screen.w-screen > .flex-1.flex.flex-col {
	--ink-gray-9: #1A1A2E !important; --ink-gray-8: #2D2D44 !important;
	--ink-gray-7: #4A4A6A !important; --ink-gray-5: #7A7A9A !important;
}
.flex.h-screen.w-screen > .h-full.border-r.bg-surface-menu-bar svg {
	stroke: rgba(255,255,255,0.85) !important; color: rgba(255,255,255,0.85) !important;
}
.flex.h-screen.w-screen > .flex-1.flex.flex-col svg { stroke: currentColor !important; }

/* === MAIN CONTENT === */
.bg-surface-white { background: #F5F5FA !important; }

/* Headings - bold playful Nunito */
.text-2xl, .text-xl, h1, h2, h3 {
	font-weight: 800 !important; color: #1A1A2E !important;
	letter-spacing: -0.01em !important;
}
.text-lg { font-weight: 700 !important; }
.text-base { font-weight: 600 !important; }

/* Sidebar link text - slightly bolder */
.bg-surface-menu-bar .text-sm { font-weight: 600 !important; letter-spacing: 0.01em !important; }

/* === CARDS === */
.rounded-lg { border-radius: 16px !important; }
.rounded-xl { border-radius: 20px !important; }
.shadow-sm { box-shadow: 0 2px 12px rgba(26, 26, 46, 0.08) !important; }
.shadow-md { box-shadow: 0 4px 20px rgba(26, 26, 46, 0.1) !important; }
a .rounded-lg, a.rounded-lg { transition: transform 0.25s ease, box-shadow 0.25s ease !important; }
a:hover .rounded-lg, a.rounded-lg:hover { transform: translateY(-4px) !important; box-shadow: 0 12px 32px rgba(91, 74, 255, 0.15) !important; }
.border { border-color: rgba(91, 74, 255, 0.08) !important; }
.border-b { border-bottom-color: rgba(91, 74, 255, 0.08) !important; }
.aspect-video { border-radius: 14px 14px 0 0 !important; overflow: hidden !important; }

/* === BUTTONS === */
/* Primary button → deep purple gradient */
.bg-surface-gray-7 {
	background: linear-gradient(135deg, #5B4AFF 0%, #7B6BFF 100%) !important;
	border-radius: 12px !important;
	box-shadow: 0 4px 14px rgba(91, 74, 255, 0.3) !important;
	transition: all 0.2s ease !important;
	color: #FFFFFF !important;
	font-weight: 700 !important;
	letter-spacing: 0.02em !important;
}
.bg-surface-gray-7:hover {
	background: linear-gradient(135deg, #4A39E6 0%, #6C5CE7 100%) !important;
	transform: translateY(-1px) !important;
	box-shadow: 0 6px 20px rgba(91, 74, 255, 0.4) !important;
}
.bg-surface-gray-7, .bg-surface-gray-7 * { color: #FFFFFF !important; }

/* All buttons → rounder, bolder */
button {
	border-radius: 10px !important;
	transition: all 0.15s ease !important;
	font-weight: 600 !important;
}

/* Ghost buttons */
.bg-surface-gray-2:not(.aspect-video) { border-radius: 10px !important; }

/* === TABS (Student/Instructor toggle) === */
[role="radiogroup"] {
	border-radius: 24px !important; overflow: hidden !important;
	border-color: rgba(91, 74, 255, 0.15) !important;
	background: rgba(91, 74, 255, 0.05) !important;
}
/* Active tab → purple pill */
.bg-surface-white.shadow-sm.rounded-md {
	border-radius: 22px !important;
	background: #5B4AFF !important;
	color: #FFFFFF !important;
	box-shadow: 0 2px 10px rgba(91, 74, 255, 0.3) !important;
	font-weight: 700 !important;
}
.bg-surface-white.shadow-sm.rounded-md span,
.bg-surface-white.shadow-sm.rounded-md * { color: #FFFFFF !important; }

/* === INPUTS === */
input[type="text"], input[type="email"], input[type="password"], input[type="search"],
input[type="number"], textarea, select {
	border-radius: 10px !important;
	border-color: rgba(91, 74, 255, 0.15) !important;
	background: #FFFFFF !important;
	font-weight: 500 !important;
}
input:focus, textarea:focus, select:focus {
	border-color: #5B4AFF !important;
	box-shadow: 0 0 0 3px rgba(91, 74, 255, 0.1) !important;
}
input[placeholder*="Search"] { border-radius: 24px !important; padding-left: 16px !important; }

/* === BADGES === */
.bg-green-100 { background: #E8F5E9 !important; border-radius: 20px !important; }
.bg-yellow-100 { background: #FFF8E1 !important; border-radius: 20px !important; }
.bg-red-100 { background: #FCE4EC !important; border-radius: 20px !important; }
.bg-green-500, .bg-green-600 { background: linear-gradient(90deg, #4ECDC4, #36B56A) !important; border-radius: 20px !important; }
.bg-red-500, .bg-red-600 { background: #FF6B4A !important; border-radius: 20px !important; }

/* === LINKS === */
a:not([class]):not(.bg-surface-menu-bar a) { color: #5B4AFF !important; font-weight: 600 !important; }
a .text-ink-gray-5 { color: #5B4AFF !important; font-weight: 600 !important; }

/* === MODALS === */
.bg-surface-modal { border-radius: 20px !important; box-shadow: 0 24px 64px rgba(26, 26, 46, 0.2) !important; }
.shadow-2xl { border-radius: 14px !important; box-shadow: 0 12px 40px rgba(26, 26, 46, 0.15) !important; }

/* === AVATARS === */
img.rounded-full { border: 2px solid rgba(91, 74, 255, 0.15) !important; }

/* === DASHED BORDERS === */
.border-dashed { border-color: rgba(91, 74, 255, 0.25) !important; border-radius: 16px !important; }
.border-dashed:hover { border-color: #5B4AFF !important; background: rgba(91, 74, 255, 0.03) !important; }

/* === TOOLTIPS === */
.bg-surface-gray-7:not(button):not(.bg-surface-menu-bar *) { background: #1A1A2E !important; border-radius: 8px !important; }

/* === STARS === */
.text-yellow-500, .text-yellow-400 { color: #FFD700 !important; }

/* === DIALOG === */
[role="dialog"] .bg-surface-white { border-radius: 16px !important; background: #FFFFFF !important; }

/* === STICKY HEADER === */
.sticky.top-0 { backdrop-filter: blur(12px) !important; background: rgba(245, 245, 250, 0.9) !important; }

/* === ANIMATIONS === */
@keyframes lf-fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
.flex-1.flex.flex-col.h-full.overflow-auto > * { animation: lf-fadeIn 0.2s ease-out; }

/* === MOBILE === */
@media (max-width: 768px) {
	.fixed.bottom-0 { background: rgba(245,245,250,0.95) !important; border-top: 1px solid rgba(91,74,255,0.1) !important; backdrop-filter: blur(12px) !important; border-radius: 20px 20px 0 0 !important; }
}

/* === CONTENT AREA OVERRIDES === */
.flex-1.flex.flex-col.h-full.overflow-auto .rounded-lg,
.flex-1.flex.flex-col.h-full.overflow-auto .bg-surface-white { background: #FFFFFF !important; }
.flex-1.flex.flex-col.h-full.overflow-auto { background: #F5F5FA !important; }
.flex-1.flex.flex-col .bg-surface-selected { background: rgba(91, 74, 255, 0.08) !important; border-radius: 10px !important; box-shadow: none !important; }
.bg-surface-white[class*="shadow"], [role="listbox"], [role="menu"] { background: #FFFFFF !important; }
.text-ink-gray-4 { color: #A0A0BC !important; }
		</style>
	</head>
	<body class="sm:overscroll-y-none no-scrollbar">
		<div id="app">
			<div id="seo-content">
				<h1>{{ meta.title }}</h1>
				<p>
					{{ meta.description }}
				</p>
				<a href="{{ meta.link }}">Know More</a>
			</div>
		</div>
		<script>
			document.getElementById('seo-content').style.display = 'none';
		</script>
		<script type="module" src="/src/main.js"></script>
	</body>
</html>
