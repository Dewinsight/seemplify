# Coturn TURN/STUN server config for WebRTC (Mediasoup, etc.)
# Used when running in Docker. Auth uses shared secret (TURN REST API).

listening-port=3478
tls-listening-port=5349

listening-ip=0.0.0.0

# relay-ip is injected by entrypoint.sh. It must be the host's routable relay
# address when TURN and the media server share a host; mapping the public IP to
# 0.0.0.0 makes coturn reject the media server as a forbidden peer.

# Server public IP (required for NAT). Set in .env as COTURN_EXTERNAL_IP or edit next line.
# external-ip=REPLACE_WITH_SERVER_PUBLIC_IP

realm=seemplifyai.com
fingerprint
use-auth-secret
# static-auth-secret is passed via environment TURN_AUTH_SECRET

no-multicast-peers
no-cli
no-loopback-peers
verbosity=0

# Relay port range (narrow range for easier firewall rules)
min-port=49152
max-port=49252

# Disable TLS for initial setup (enable and set cert-file/pkey-file for TURNS)
no-tls
no-tlsv1
no-tlsv1_1
