      (function(){try{var valid=function(v){return v==='light'||v==='dark'||v==='system'};var readCookie=function(n){try{var p=n+'=',a=document.cookie.split(';');for(var i=0;i<a.length;i++){var s=a[i].trim();if(s.indexOf(p)===0)return decodeURIComponent(s.slice(p.length))}}catch(_){}return null};var readStore=function(k){try{return localStorage.getItem(k)}catch(_){return null}};var preference=readCookie('seemplify_theme');if(!valid(preference)){var candidates=[readStore('seemplify_theme'),readStore('seemplify-theme'),readCookie('theme'),readStore('theme'),readStore('themeMode')];preference='system';for(var i=0;i<candidates.length;i++){if(valid(candidates[i])){preference=candidates[i];break}}try{localStorage.setItem('seemplify_theme',preference)}catch(_){}try{var h=location.hostname,shared=h==='seemplifyai.com'||h.endsWith('.seemplifyai.com');document.cookie='seemplify_theme='+encodeURIComponent(preference)+'; Max-Age=31536000; Path=/; SameSite=Lax'+(shared?'; Domain=.seemplifyai.com':'')+(location.protocol==='https:'?'; Secure':'')}catch(_){}}else{try{localStorage.setItem('seemplify_theme',preference)}catch(_){}}var resolved=preference==='system'?(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'):preference;var root=document.documentElement;root.classList.remove('light','dark');root.classList.add(resolved);root.setAttribute('data-theme-preference',preference);root.setAttribute('data-theme',resolved);root.style.colorScheme=resolved}catch(_){var root=document.documentElement;root.setAttribute('data-theme-preference','system');root.setAttribute('data-theme',matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light')}})();
    </script>
