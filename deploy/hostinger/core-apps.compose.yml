name: seemplify-core

x-defaults: &defaults
  restart: unless-stopped
  networks:
    - dokploy-network
  security_opt:
    - no-new-privileges:true

services:
  identity-provider:
    <<: *defaults
    image: ${IDENTITY_PROVIDER_IMAGE:-seemplify/identity-provider:hostinger-20260817-approver-idp}
    environment:
      NODE_ENV: production
      PORT: "5008"
      MONGO_URI: mongodb://identity_app:${MONGO_IDENTITY_PASSWORD:?required}@mongodb:27017/identity?authSource=identity
      ISSUER_URL: https://auth.seemplifyai.com
      API_AUDIENCE: https://auth.seemplifyai.com
      OIDC_COOKIE_SECRET: ${IDP_COOKIE_SECRET:?required}
      CLIENTS_CONFIG: /run/seemplify/idp-clients.json
      MAIL_API_BASE_URL: https://mail-control.seemplifyai.com
      MAIL_API_TOKEN: ${MAIL_API_TOKEN:?required}
      MAIL_FROM_EMAIL: no-reply@seemplifyai.com
      MAIL_FROM_NAME: Seemplify Identity
      SMARTHR_URL: https://app.seemplifyai.com
      SMARTHR_LOGIN_URL: https://app.seemplifyai.com/login
      SMARTHR_API_URL: https://api.seemplifyai.com
      LEAVE_MANAGEMENT_URL: https://leave.seemplifyai.com
      LEAVE_MANAGEMENT_API_URL: https://api-leave.seemplifyai.com
      PERFORMANCE_MANAGEMENT_URL: https://performance.seemplifyai.com
      PERFORMANCE_MANAGEMENT_API_URL: https://api-performance.seemplifyai.com
      PAYROLL_MANAGEMENT_URL: https://payroll.seemplifyai.com
      PAYROLL_MANAGEMENT_API_URL: https://api-payroll.seemplifyai.com
      TIME_ATTENDANCE_URL: https://time.seemplifyai.com
      TIME_ATTENDANCE_API_URL: https://api-time.seemplifyai.com
      ATTENDANCE_HUB_SECRET: ${TIME_INTERNAL_SECRET:?required}
      SEEMPLIFY_LEARNING_URL: https://learning.seemplifyai.com
      MESSAGING_URL: https://workspace.seemplifyai.com
      MESSAGING_API_URL: https://api-workspace.seemplifyai.com
      COMMUNITY_PRODUCTION_ENABLED: "${COMMUNITY_PRODUCTION_ENABLED:-false}"
      COMMUNITY_URL: "${COMMUNITY_URL:-}"
      COMMUNITY_API_URL: "${COMMUNITY_API_URL:-}"
      AUTOMATION_HUB_URL: https://automations.seemplifyai.com
      AUTOMATION_HUB_API_URL: https://automations.seemplifyai.com
      AUTOMATION_HUB_OIDC_CLIENT_SECRET_FILE: /run/seemplify/automation-hub-oidc-client-secret
      AUTOMATION_HUB_HMAC_SECRET_FILE: /run/seemplify/automation-hub-hmac-secret
      APPROVER_URL: https://approver.seemplifyai.com
      EXPERIENCE_MANAGEMENT_URL: https://experience.seemplifyai.com
      EXPERIENCE_OIDC_CLIENT_SECRET: ${OIDC_EXPERIENCE_SECRET:?required}
      EXPERIENCE_ADMIN_SSO_SECRET: ${EXPERIENCE_ADMIN_SSO_SECRET:?required}
      IDP_PLATFORM_CREDENTIAL_ENCRYPTION_KEY_FILE: /run/seemplify/platform-integration-credential-key
      IDP_PLATFORM_INTEGRATION_HMAC_SECRET_FILE: /run/seemplify/platform-integration-experience-hmac
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
      AZURE_SPEECH_KEY: ${AZURE_SPEECH_KEY:-}
      AZURE_SPEECH_REGION: ${AZURE_SPEECH_REGION:-}
      AZURE_SPEECH_TTS_ENDPOINT: ${AZURE_SPEECH_TTS_ENDPOINT:-}
      AZURE_SPEECH_LANGUAGE: ${AZURE_SPEECH_LANGUAGE:-en-US}
      AZURE_SPEECH_VOICE: ${AZURE_SPEECH_VOICE:-en-US-AvaNeural}
      MESSAGING_OIDC_CLIENT_SECRET: ${OIDC_MESSAGING_SECRET:?required}
      COMMUNITY_OIDC_CLIENT_SECRET: "${OIDC_COMMUNITY_SECRET:-}"
      MESSAGING_IDP_SERVICE_SECRET: ${MESSAGING_IDP_SERVICE_SECRET:?required}
      RECRUITER_ADMIN_URL: https://app.seemplifyai.com
      RECRUITER_ADMIN_SSO_SECRET: ${RECRUITER_ADMIN_SSO_SECRET:?required}
      RECRUITER_IDP_SERVICE_SECRET: ${RECRUITER_ADMIN_SSO_SECRET:?required}
      RECRUITER_ADMIN_SSO_ISSUER: aiin-idp-admin
      RECRUITER_ADMIN_SSO_AUDIENCE: recruiter-admin
      IDP_WEBHOOK_SECRET_RECRUITER: ${IDP_WEBHOOK_RECRUITER:?required}
      IDP_WEBHOOK_SECRET_LEAVE_MANAGEMENT: ${IDP_WEBHOOK_LEAVE:?required}
      IDP_WEBHOOK_SECRET_PAYROLL: ${IDP_WEBHOOK_PAYROLL:?required}
      IDP_WEBHOOK_SECRET_PERFORMANCE_MANAGEMENT: ${IDP_WEBHOOK_PERFORMANCE:?required}
      IDP_WEBHOOK_SECRET_TIME_ATTENDANCE: ${IDP_WEBHOOK_TIME:?required}
      IDP_WEBHOOK_SECRET_MESSAGING: ${IDP_WEBHOOK_MESSAGING:?required}
      IDP_WEBHOOK_SECRET_APPROVER: ${IDP_WEBHOOK_APPROVER:?required}
      SMARTHR_WEBHOOK_URL: http://recruiter-backend:5001/api/webhooks/idp
      LEAVE_WEBHOOK_URL: http://leave-backend:5002/api/webhooks/idp
      PAYROLL_WEBHOOK_URL: http://payroll-backend:5006/api/webhooks/idp
      PERFORMANCE_WEBHOOK_URL: http://performance-backend:5004/api/webhooks/idp
      TIME_ATTENDANCE_WEBHOOK_URL: http://time-backend:5010/api/webhooks/idp
      MESSAGING_WEBHOOK_URL: http://workspace-backend:5009/api/webhooks/idp
      APPROVER_WEBHOOK_URL: http://approver:80/api/webhooks/idp
      WORKSPACE_AUTOMATION_WEBHOOK_URL: https://api-workspace.seemplifyai.com/hooks/identity
      WORKSPACE_AUTOMATION_HMAC_SECRET_FILE: /run/seemplify/workspace-automation-hmac-secret
      SHARED_AI_ADMIN_BASE_URL: http://recruiter-backend:5001
      AI_GATEWAY_ADMIN_ANALYTICS_SECRET: ${AI_GATEWAY_ADMIN_ANALYTICS_SECRET:?required}
    volumes:
      - /opt/seemplify/secrets/idp-clients.json:/run/seemplify/idp-clients.json:ro
      - /opt/seemplify/secrets/workspace-automation/identity-hmac-secret:/run/seemplify/workspace-automation-hmac-secret:ro
      - /opt/seemplify/secrets/platform-integrations/credential-encryption-key:/run/seemplify/platform-integration-credential-key:ro
      - /opt/seemplify/secrets/platform-integrations/experience-hmac-secret:/run/seemplify/platform-integration-experience-hmac:ro
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:5008/.well-known/openid-configuration').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 30s
    labels:
      - traefik.enable=true
      - traefik.docker.network=dokploy-network
      - traefik.http.routers.seemplify-auth.rule=Host(`auth.seemplifyai.com`)
      - traefik.http.routers.seemplify-auth.entrypoints=web
      - traefik.http.routers.seemplify-auth.service=seemplify-auth
      - traefik.http.routers.seemplify-auth-secure.rule=Host(`auth.seemplifyai.com`)
      - traefik.http.routers.seemplify-auth-secure.entrypoints=websecure
      - traefik.http.routers.seemplify-auth-secure.service=seemplify-auth
      - traefik.http.routers.seemplify-auth-secure.tls=true
      - traefik.http.routers.seemplify-auth-secure.tls.certresolver=letsencrypt
      - traefik.http.services.seemplify-auth.loadbalancer.server.port=5008

  recruiter-backend:
    <<: *defaults
    image: ${RECRUITER_BACKEND_IMAGE:-seemplify/recruiter-backend:hostinger-20260817-redis-authfix}
    environment:
      NODE_ENV: production
      PORT: "5001"
      MONGO_URI: mongodb://recruiter_app:${MONGO_RECRUITER_PASSWORD:?required}@mongodb:27017/smarthr?authSource=smarthr
      FRONTEND_URL: https://app.seemplifyai.com
      FRONTEND_URLS: https://app.seemplifyai.com,https://candidate.seemplifyai.com
      CANDIDATE_PORTAL_URL: https://candidate.seemplifyai.com
      IDP_ISSUER_URL: https://auth.seemplifyai.com
      OIDC_ISSUER: https://auth.seemplifyai.com
      IDP_INTERNAL_API_URL: http://identity-provider:5008
      IDP_PLATFORM_CONFIGURATION_URL: http://identity-provider:5008
      IDP_PLATFORM_INTEGRATION_HMAC_SECRET_FILE: /run/seemplify/platform-integration-hmac
      OIDC_CLIENT_ID: smarthr-backend
      OIDC_CLIENT_SECRET: ${OIDC_RECRUITER_SECRET:?required}
      OIDC_REDIRECT_URI: https://api.seemplifyai.com/api/auth/oidc/callback
      SESSION_SECRET: ${RECRUITER_SESSION_SECRET:?required}
      JWT_SECRET: ${RECRUITER_JWT_SECRET:?required}
      HUB_TOKEN_SECRET: ${RECRUITER_JWT_SECRET:?required}
      IDP_WEBHOOK_SECRET: ${IDP_WEBHOOK_RECRUITER:?required}
      PRESENCE_REPORTER_SERVICE_SECRET: ${TIME_INTERNAL_SECRET:?required}
      TIME_ATTENDANCE_PRESENCE_URL: http://time-backend:5010/api/internal/v1/presence
      RECRUITER_ADMIN_SSO_SECRET: ${RECRUITER_ADMIN_SSO_SECRET:?required}
      IDP_RECRUITER_ADMIN_SSO_SECRET: ${RECRUITER_ADMIN_SSO_SECRET:?required}
      PEOPLE_TRANSITIONS_SERVICE_SECRET: ${RECRUITER_ADMIN_SSO_SECRET:?required}
      RECRUITER_IDP_SERVICE_SECRET: ${RECRUITER_ADMIN_SSO_SECRET:?required}
      RECRUITER_ADMIN_SSO_ISSUER: aiin-idp-admin
      RECRUITER_ADMIN_SSO_AUDIENCE: recruiter-admin
      REDIS_URL: redis://:${REDIS_PASSWORD:?required}@seemplify-shared-redis-1:6379/0
      CV_GLOBAL_DISPATCH_REDIS_URL: redis://:${REDIS_PASSWORD:?required}@seemplify-shared-redis-1:6379/1
      REDIS_HOST: seemplify-shared-redis-1
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD:?required}
      WEAVIATE_HOST: weaviate:8080
      WEAVIATE_SCHEME: http
      WEAVIATE_API_KEY: ${WEAVIATE_API_KEY:?required}
      USE_WEAVIATE: "true"
      AZURE_OPENAI_EMBEDDING_URL: ${AZURE_OPENAI_EMBEDDING_URL:?required}
      AZURE_OPENAI_EMBEDDING_API_KEY: ${AZURE_OPENAI_EMBEDDING_API_KEY:?required}
      AZURE_OPENAI_EMBEDDING_MODEL: ${AZURE_OPENAI_EMBEDDING_MODEL:-text-embedding-3-large}
      azure_openai_embedding_url: ${AZURE_OPENAI_EMBEDDING_URL:?required}
      azure_openai_embedding_key: ${AZURE_OPENAI_EMBEDDING_API_KEY:?required}
      azure_openai_embedding_model: ${AZURE_OPENAI_EMBEDDING_MODEL:-text-embedding-3-large}
      CHATGPT_GATEWAY_BASE_URL: http://chatgpt-gateway:11435
      CHATGPT_GATEWAY_SHARED_SECRET: ${CHATGPT_GATEWAY_SHARED_SECRET:?required}
      AI_GATEWAY_HMAC_SECRET: ${AI_GATEWAY_HMAC_SECRET:?required}
      PERFORMANCE_AI_SHARED_SECRET: ${PERFORMANCE_AI_SHARED_SECRET:?required}
      MESSAGING_AI_SHARED_SECRET: ${MESSAGING_AI_SHARED_SECRET:?required}
      EXPERIENCE_AI_SHARED_SECRET: ${EXPERIENCE_AI_SHARED_SECRET:?required}
      AI_GATEWAY_ADMIN_ANALYTICS_SECRET: ${AI_GATEWAY_ADMIN_ANALYTICS_SECRET:?required}
      MAIL_API_BASE_URL: https://mail-control.seemplifyai.com
      MAIL_API_TOKEN: ${MAIL_API_TOKEN:?required}
      MAIL_FROM_EMAIL: no-reply@seemplifyai.com
      MAIL_FROM_NAME: Seemplify
      ENABLE_BREVO_CALENDAR_INVITE_FALLBACK: "false"
      FORCE_BREVO_CALENDAR_INVITE_FALLBACK: "false"
      FORCE_BREVO_INTERVIEW_EMAILS: "false"
    volumes:
      - /opt/seemplify/secrets/platform-integrations/experience-hmac-secret:/run/seemplify/platform-integration-hmac:ro
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:5001/api/health').then(r=>process.exit(r.status<500?0:1)).catch(()=>process.exit(1))\""]
      interval: 20s
      timeout: 8s
      retries: 15
      start_period: 45s
    labels:
      - traefik.enable=true
      - traefik.docker.network=dokploy-network
      - traefik.http.routers.seemplify-api.rule=Host(`api.seemplifyai.com`)
      - traefik.http.routers.seemplify-api.entrypoints=web
      - traefik.http.routers.seemplify-api.service=seemplify-api
      - traefik.http.routers.seemplify-api-secure.rule=Host(`api.seemplifyai.com`)
      - traefik.http.routers.seemplify-api-secure.entrypoints=websecure
      - traefik.http.routers.seemplify-api-secure.service=seemplify-api
      - traefik.http.routers.seemplify-api-secure.tls=true
      - traefik.http.routers.seemplify-api-secure.tls.certresolver=letsencrypt
      - traefik.http.services.seemplify-api.loadbalancer.server.port=5001

  recruiter-frontend:
    <<: *defaults
    image: ${RECRUITER_FRONTEND_IMAGE:-seemplify/recruiter-frontend:hostinger}
    environment:
      NODE_ENV: production
      PORT: "5000"
      HOSTNAME: 0.0.0.0
    labels:
      - traefik.enable=true
      - traefik.docker.network=dokploy-network
      - traefik.http.routers.seemplify-app.rule=Host(`app.seemplifyai.com`)
      - traefik.http.routers.seemplify-app.entrypoints=web
      - traefik.http.routers.seemplify-app.service=seemplify-app
      - traefik.http.routers.seemplify-app-secure.rule=Host(`app.seemplifyai.com`)
      - traefik.http.routers.seemplify-app-secure.entrypoints=websecure
      - traefik.http.routers.seemplify-app-secure.service=seemplify-app
      - traefik.http.routers.seemplify-app-secure.tls=true
      - traefik.http.routers.seemplify-app-secure.tls.certresolver=letsencrypt
      - traefik.http.services.seemplify-app.loadbalancer.server.port=5000

  candidate-portal:
    <<: *defaults
    image: ${CANDIDATE_PORTAL_IMAGE:-seemplify/candidate-portal:hostinger}
    environment:
      NODE_ENV: production
      PORT: "5300"
      HOSTNAME: 0.0.0.0
    labels:
      - traefik.enable=true
      - traefik.docker.network=dokploy-network
      - traefik.http.routers.seemplify-candidate.rule=Host(`candidate.seemplifyai.com`)
      - traefik.http.routers.seemplify-candidate.entrypoints=web
      - traefik.http.routers.seemplify-candidate.service=seemplify-candidate
      - traefik.http.routers.seemplify-candidate-secure.rule=Host(`candidate.seemplifyai.com`)
      - traefik.http.routers.seemplify-candidate-secure.entrypoints=websecure
      - traefik.http.routers.seemplify-candidate-secure.service=seemplify-candidate
      - traefik.http.routers.seemplify-candidate-secure.tls=true
      - traefik.http.routers.seemplify-candidate-secure.tls.certresolver=letsencrypt
      - traefik.http.services.seemplify-candidate.loadbalancer.server.port=5300

  leave-backend:
    <<: *defaults
    image: ${LEAVE_BACKEND_IMAGE:-seemplify/leave-backend:hostinger}
    environment:
      NODE_ENV: production
      PORT: "5002"
      MONGODB_URI: mongodb://leave_app:${MONGO_LEAVE_PASSWORD:?required}@mongodb:27017/leave-management?authSource=leave-management
      IDP_ISSUER_URL: https://auth.seemplifyai.com
      IDP_INTERNAL_API_URL: http://identity-provider:5008
      LEAVE_IDP_SERVICE_SECRET: ${MESSAGING_IDP_SERVICE_SECRET:?required}
      OIDC_CLIENT_ID: leave-management
      OIDC_CLIENT_SECRET: ${OIDC_LEAVE_SECRET:?required}
      OIDC_REDIRECT_URI: https://api-leave.seemplifyai.com/api/auth/oidc/callback
      SESSION_SECRET: ${LEAVE_SESSION_SECRET:?required}
      HUB_TOKEN_SECRET: ${LEAVE_HUB_SECRET:?required}
      FRONTEND_URL: https://leave.seemplifyai.com
      LEAVE_MANAGEMENT_URL: https://leave.seemplifyai.com
      IDP_WEBHOOK_SECRET: ${IDP_WEBHOOK_LEAVE:?required}
      PAYROLL_LEAVE_SHARED_SECRET: ${PAYROLL_LEAVE_SHARED_SECRET:?required}
      PAYROLL_LEAVE_SERVICE_ID: payroll
      PRESENCE_REPORTER_SERVICE_SECRET: ${TIME_INTERNAL_SECRET:?required}
      TIME_ATTENDANCE_PRESENCE_URL: http://time-backend:5010/api/internal/v1/presence
      MAIL_API_BASE_URL: https://mail-control.seemplifyai.com
      MAIL_API_TOKEN: ${MAIL_API_TOKEN:?required}
      MAIL_FROM_EMAIL: no-reply@seemplifyai.com
      MAIL_FROM_NAME: Seemplify Leave
      WORKSPACE_AUTOMATION_API_URL: https://api-workspace.seemplifyai.com
      WORKSPACE_AUTOMATION_HMAC_SECRET_FILE: /run/seemplify/workspace-automation-hmac-secret
    volumes:
      - /opt/seemplify/secrets/workspace-automation/leave-hmac-secret:/run/seemplify/workspace-automation-hmac-secret:ro
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:5002/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 30s
    labels:
      - traefik.enable=true
      - traefik.docker.network=dokploy-network
      - traefik.http.routers.seemplify-api-leave.rule=Host(`api-leave.seemplifyai.com`)
      - traefik.http.routers.seemplify-api-leave.entrypoints=web
      - traefik.http.routers.seemplify-api-leave.service=seemplify-api-leave
      - traefik.http.routers.seemplify-api-leave-secure.rule=Host(`api-leave.seemplifyai.com`)
      - traefik.http.routers.seemplify-api-leave-secure.entrypoints=websecure
      - traefik.http.routers.seemplify-api-leave-secure.service=seemplify-api-leave
      - traefik.http.routers.seemplify-api-leave-secure.tls=true
      - traefik.http.routers.seemplify-api-leave-secure.tls.certresolver=letsencrypt
      - traefik.http.services.seemplify-api-leave.loadbalancer.server.port=5002

  leave-frontend:
    <<: *defaults
    image: ${LEAVE_FRONTEND_IMAGE:-seemplify/leave-frontend:hostinger}
    environment:
      NODE_ENV: production
      PORT: "5003"
      HOSTNAME: 0.0.0.0
    labels:
      - traefik.enable=true
      - traefik.docker.network=dokploy-network
      - traefik.http.routers.seemplify-leave.rule=Host(`leave.seemplifyai.com`)
      - traefik.http.routers.seemplify-leave.entrypoints=web
      - traefik.http.routers.seemplify-leave.service=seemplify-leave
      - traefik.http.routers.seemplify-leave-secure.rule=Host(`leave.seemplifyai.com`)
      - traefik.http.routers.seemplify-leave-secure.entrypoints=websecure
      - traefik.http.routers.seemplify-leave-secure.service=seemplify-leave
      - traefik.http.routers.seemplify-leave-secure.tls=true
      - traefik.http.routers.seemplify-leave-secure.tls.certresolver=letsencrypt
      - traefik.http.services.seemplify-leave.loadbalancer.server.port=5003

  performance-backend:
    <<: *defaults
    image: ${PERFORMANCE_BACKEND_IMAGE:-seemplify/performance-backend:hostinger-20260817-webhook-contract}
    environment:
      NODE_ENV: production
      PORT: "5004"
      MONGO_URI: mongodb://performance_app:${MONGO_PERFORMANCE_PASSWORD:?required}@mongodb:27017/performance_db?authSource=performance_db
      FRONTEND_URL: https://performance.seemplifyai.com
      BACKEND_URL: https://api-performance.seemplifyai.com
      IDP_ISSUER_URL: https://auth.seemplifyai.com
      IDP_URL: https://auth.seemplifyai.com
      IDP_HUB_URL: https://auth.seemplifyai.com
      IDP_PLATFORM_CONFIGURATION_URL: http://identity-provider:5008
      IDP_PLATFORM_INTEGRATION_HMAC_SECRET_FILE: /run/seemplify/platform-integration-hmac
      OIDC_CLIENT_ID: performance-management
      OIDC_CLIENT_SECRET: ${OIDC_PERFORMANCE_SECRET:?required}
      OIDC_REDIRECT_URI: https://api-performance.seemplifyai.com/api/auth/oidc/callback
      SESSION_SECRET: ${PERFORMANCE_SESSION_SECRET:?required}
      JWT_SECRET: ${PERFORMANCE_SESSION_SECRET:?required}
      HUB_TOKEN_SECRET: ${PERFORMANCE_HUB_SECRET:?required}
      IDP_PERFORMANCE_SERVICE_SECRET: ${IDP_WEBHOOK_PERFORMANCE:?required}
      IDP_WEBHOOK_SECRET: ${IDP_WEBHOOK_PERFORMANCE:?required}
      MAIL_API_BASE_URL: https://mail-control.seemplifyai.com
      MAIL_API_TOKEN: ${MAIL_API_TOKEN:?required}
      MAIL_FROM_EMAIL: no-reply@seemplifyai.com
      MAIL_FROM_NAME: Seemplify Performance
      SEEMPLIFY_SHARED_AI_URL: http://recruiter-backend:5001
      PERFORMANCE_AI_SHARED_SECRET: ${PERFORMANCE_AI_SHARED_SECRET:?required}
      LOCAL_LLM_BASE_URL: http://chatgpt-gateway:11435
      LOCAL_LLM_SHARED_SECRET: ${CHATGPT_GATEWAY_SHARED_SECRET:?required}
    volumes:
      - /opt/seemplify/secrets/platform-integrations/experience-hmac-secret:/run/seemplify/platform-integration-hmac:ro
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:5004/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 30s
    labels:
      - traefik.enable=true
      - traefik.docker.network=dokploy-network
      - traefik.http.routers.seemplify-api-performance.rule=Host(`api-performance.seemplifyai.com`)
      - traefik.http.routers.seemplify-api-performance.entrypoints=web
      - traefik.http.routers.seemplify-api-performance.service=seemplify-api-performance
      - traefik.http.routers.seemplify-api-performance-secure.rule=Host(`api-performance.seemplifyai.com`)
      - traefik.http.routers.seemplify-api-performance-secure.entrypoints=websecure
      - traefik.http.routers.seemplify-api-performance-secure.service=seemplify-api-performance
      - traefik.http.routers.seemplify-api-performance-secure.tls=true
      - traefik.http.routers.seemplify-api-performance-secure.tls.certresolver=letsencrypt
      - traefik.http.services.seemplify-api-performance.loadbalancer.server.port=5004

  performance-frontend:
    <<: *defaults
    image: ${PERFORMANCE_FRONTEND_IMAGE:-seemplify/performance-frontend:hostinger}
    environment:
