name: seemplify-connectors

x-defaults: &defaults
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true

services:
  nango-db:
    <<: *defaults
    image: postgres:16.10-alpine
    env_file:
      - /opt/seemplify/secrets/nango/database.env
    volumes:
      - nango-data:/var/lib/postgresql/data
    networks:
      - automation-private
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 12

  nango-server:
    <<: *defaults
    image: nangohq/nango-server:hosted-0.71.4
    platform: linux/amd64
    env_file:
      - /opt/seemplify/secrets/nango/server.env
    environment:
      NANGO_DB_HOST: nango-db
      NANGO_DB_PORT: "5432"
      NANGO_DB_SSL: "false"
      SERVER_PORT: "3003"
      NANGO_SERVER_URL: https://nango.seemplifyai.com
      NANGO_PUBLIC_SERVER_URL: https://nango.seemplifyai.com
      NANGO_PUBLIC_CONNECT_URL: https://connect.seemplifyai.com
      NANGO_CONNECT_UI_PORT: "3009"
      FLAG_SERVE_CONNECT_UI: "true"
      FLAG_AUTH_ENABLED: "false"
      CSP_REPORT_ONLY: "false"
      LOG_LEVEL: info
      NANGO_LOGS_ENABLED: "false"
      NANGO_PROXY_BASE_URL_OVERRIDE_ENABLED: "true"
      NANGO_PROXY_BASE_URL_OVERRIDE_DENYLIST: '["169.254.169.254","metadata.google.internal","localhost","127.0.0.1","[::1]","[::ffff:127.0.0.1]","[::ffff:169.254.169.254]"]'
      NANGO_OUTBOUND_URL_POLICY: '{"blockPrivateIps":true,"maxRedirects":3}'
      TZ: UTC
    depends_on:
      nango-db:
        condition: service_healthy
    networks:
      - automation-private
      - dokploy-network
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3003/health').then(r=>process.exit(r.status<500?0:1)).catch(()=>process.exit(1))\""]
      interval: 15s
      timeout: 6s
      retries: 20
      start_period: 60s
    labels:
      - com.seemplify.release=${SEEMPLIFY_RELEASE_SHA:-unknown}
      - traefik.enable=true
      - traefik.docker.network=dokploy-network
      - traefik.http.routers.seemplify-nango-secure.rule=Host(`nango.seemplifyai.com`)
      - traefik.http.routers.seemplify-nango-secure.entrypoints=websecure
      - traefik.http.routers.seemplify-nango-secure.tls=true
      - traefik.http.routers.seemplify-nango-secure.tls.certresolver=letsencrypt
      - traefik.http.routers.seemplify-nango-secure.service=seemplify-nango
      - traefik.http.services.seemplify-nango.loadbalancer.server.port=3003
      - traefik.http.routers.seemplify-nango-connect-secure.rule=Host(`connect.seemplifyai.com`)
      - traefik.http.routers.seemplify-nango-connect-secure.entrypoints=websecure
      - traefik.http.routers.seemplify-nango-connect-secure.tls=true
      - traefik.http.routers.seemplify-nango-connect-secure.tls.certresolver=letsencrypt
      - traefik.http.routers.seemplify-nango-connect-secure.service=seemplify-nango-connect
      - traefik.http.services.seemplify-nango-connect.loadbalancer.server.port=3009

networks:
  automation-private:
    internal: true
  dokploy-network:
    external: true

volumes:
  nango-data:
