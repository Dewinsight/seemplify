name: seemplify-automation

x-defaults: &defaults
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true

services:
  nango-db:
    <<: *defaults
    image: postgres:16.10-alpine
    env_file:
      - /opt/seemplify/secrets/nango/database.env
    volumes:
      - nango-data:/var/lib/postgresql/data
    networks:
      - automation-private
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 12

  nango-server:
    <<: *defaults
    image: nangohq/nango-server:hosted-0.71.4
    platform: linux/amd64
    env_file:
      - /opt/seemplify/secrets/nango/server.env
    environment:
      NANGO_DB_HOST: nango-db
      NANGO_DB_PORT: "5432"
      NANGO_DB_SSL: "false"
      SERVER_PORT: "3003"
      NANGO_SERVER_URL: https://nango.seemplifyai.com
      NANGO_PUBLIC_SERVER_URL: https://nango.seemplifyai.com
      NANGO_PUBLIC_CONNECT_URL: https://connect.seemplifyai.com
      NANGO_CONNECT_UI_PORT: "3009"
      FLAG_SERVE_CONNECT_UI: "true"
      FLAG_AUTH_ENABLED: "false"
      CSP_REPORT_ONLY: "false"
      LOG_LEVEL: info
      NANGO_LOGS_ENABLED: "false"
      NANGO_PROXY_BASE_URL_OVERRIDE_ENABLED: "true"
      NANGO_PROXY_BASE_URL_OVERRIDE_DENYLIST: '["169.254.169.254","metadata.google.internal","localhost","127.0.0.1","[::1]","[::ffff:127.0.0.1]","[::ffff:169.254.169.254]"]'
      NANGO_OUTBOUND_URL_POLICY: '{"blockPrivateIps":true,"maxRedirects":3}'
      TZ: UTC
    depends_on:
      nango-db:
        condition: service_healthy
    networks:
      - automation-private
      - dokploy-network
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3003/health').then(r=>process.exit(r.status<500?0:1)).catch(()=>process.exit(1))\""]
      interval: 15s
      timeout: 6s
      retries: 20
      start_period: 60s
    labels:
      - traefik.enable=true
      - traefik.docker.network=dokploy-network
      - traefik.http.routers.seemplify-nango-secure.rule=Host(`nango.seemplifyai.com`)
      - traefik.http.routers.seemplify-nango-secure.entrypoints=websecure
      - traefik.http.routers.seemplify-nango-secure.tls=true
      - traefik.http.routers.seemplify-nango-secure.tls.certresolver=letsencrypt
      - traefik.http.routers.seemplify-nango-secure.service=seemplify-nango
      - traefik.http.services.seemplify-nango.loadbalancer.server.port=3003
      - traefik.http.routers.seemplify-nango-connect-secure.rule=Host(`connect.seemplifyai.com`)
      - traefik.http.routers.seemplify-nango-connect-secure.entrypoints=websecure
      - traefik.http.routers.seemplify-nango-connect-secure.tls=true
      - traefik.http.routers.seemplify-nango-connect-secure.tls.certresolver=letsencrypt
      - traefik.http.routers.seemplify-nango-connect-secure.service=seemplify-nango-connect
      - traefik.http.services.seemplify-nango-connect.loadbalancer.server.port=3009

  automation-hub:
    <<: *defaults
    image: ${AUTOMATION_HUB_IMAGE:?required}
    environment:
      NODE_ENV: production
      PORT: "5420"
      PUBLIC_URL: https://automations.seemplifyai.com
      DATABASE_PATH: /app/data/automation.sqlite
      OIDC_ISSUER_URL: https://auth.seemplifyai.com
      OIDC_CLIENT_ID: automation-hub
      OIDC_REDIRECT_URI: https://automations.seemplifyai.com/auth/callback
      OIDC_CLIENT_SECRET_FILE: /run/seemplify/automation-hub/oidc-client-secret
      SESSION_SECRET_FILE: /run/seemplify/automation-hub/session-secret
      WEBHOOK_ENCRYPTION_KEY_FILE: /run/seemplify/automation-hub/webhook-encryption-key
      NANGO_BASE_URL: http://nango-server:3003
      NANGO_SECRET_KEY_FILE: /run/seemplify/automation-hub/nango-api-key
      IDENTITY_API_URL: http://identity-provider:5008
      IDENTITY_HMAC_SECRET_FILE: /run/seemplify/automation-hub/identity-hmac-secret
      WORKSPACE_API_URL: http://workspace-backend:5009
      WORKSPACE_HMAC_SECRET_FILE: /run/seemplify/automation-hub/workspace-hmac-secret
      PAYROLL_API_URL: http://payroll-backend:5006
      PAYROLL_HMAC_SECRET_FILE: /run/seemplify/automation-hub/payroll-hmac-secret
      LEAVE_API_URL: http://leave-backend:5002
      LEAVE_HMAC_SECRET_FILE: /run/seemplify/automation-hub/leave-hmac-secret
      TIME_API_URL: http://time-backend:5010
      TIME_HMAC_SECRET_FILE: /run/seemplify/automation-hub/time-hmac-secret
      LEARNING_API_URL: http://learning:5012
      LEARNING_HMAC_SECRET_FILE: /run/seemplify/automation-hub/learning-hmac-secret
    volumes:
      - automation-data:/app/data
      - /opt/seemplify/secrets/automation-hub:/run/seemplify/automation-hub:ro
    depends_on:
      nango-server:
        condition: service_healthy
    networks:
      - automation-private
      - dokploy-network
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:5420/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 30s
    labels:
      - traefik.enable=true
      - traefik.docker.network=dokploy-network
      - traefik.http.routers.seemplify-automations-secure.rule=Host(`automations.seemplifyai.com`)
      - traefik.http.routers.seemplify-automations-secure.entrypoints=websecure
      - traefik.http.routers.seemplify-automations-secure.tls=true
      - traefik.http.routers.seemplify-automations-secure.tls.certresolver=letsencrypt
      - traefik.http.routers.seemplify-automations-secure.service=seemplify-automations
      - traefik.http.services.seemplify-automations.loadbalancer.server.port=5420

networks:
  automation-private:
    internal: true
  dokploy-network:
    external: true

volumes:
  automation-data:
  nango-data:
