services:
  seemplify-worker:
    build:
      context: .
    image: dewinsight/actions-runner:2.336.0
    restart: unless-stopped
    environment:
      RUNNER_URL: https://github.com/Dewinsight
      RUNNER_TOKEN: ${RUNNER_TOKEN:-}
      RUNNER_NAME: kvm8-seemplify-worker
      # Keep the established label for backwards-compatible Seemplify jobs;
      # Workspace uses its own non-overlapping label below.
      RUNNER_LABELS: dewinsight-kvm8,dewinsight-kvm8-seemplify
      RUNNER_GROUP: ${RUNNER_GROUP:-kvm8-shared}
    volumes:
      - seemplify-worker-state:/runner
    cpus: 3.0
    cpu_shares: 256
    mem_limit: 6g
    memswap_limit: 6g
    pids_limit: 2048
    oom_score_adj: 500
    stop_grace_period: 45s
    deploy:
      resources:
        limits:
          cpus: '3.0'
          memory: 6G
          pids: 2048
      restart_policy:
        condition: any
        delay: 5s

  workspace-worker:
    build:
      context: .
    image: dewinsight/actions-runner:2.336.0
    restart: unless-stopped
    environment:
      RUNNER_URL: https://github.com/Dewinsight
      RUNNER_TOKEN: ${RUNNER_TOKEN:-}
      RUNNER_NAME: kvm8-workspace-worker
      RUNNER_LABELS: dewinsight-kvm8-workspace
      RUNNER_GROUP: ${RUNNER_GROUP:-kvm8-shared}
    volumes:
      - workspace-worker-state:/runner
    cpus: 3.0
    cpu_shares: 256
    mem_limit: 6g
    memswap_limit: 6g
    pids_limit: 2048
    oom_score_adj: 500
    stop_grace_period: 45s
    deploy:
      resources:
        limits:
          cpus: '3.0'
          memory: 6G
          pids: 2048
      restart_policy:
        condition: any
        delay: 5s

  control:
    build:
      context: .
    image: dewinsight/actions-runner:2.336.0
    restart: unless-stopped
    environment:
      RUNNER_URL: https://github.com/Dewinsight
      RUNNER_TOKEN: ${RUNNER_TOKEN:-}
      RUNNER_NAME: kvm8-deploy-controller
      RUNNER_LABELS: dewinsight-kvm8-control
      RUNNER_GROUP: ${RUNNER_GROUP:-kvm8-shared}
    volumes:
      - control-state:/runner
    cpus: 0.5
    cpu_shares: 128
    mem_limit: 1g
    memswap_limit: 1g
    pids_limit: 512
    oom_score_adj: 750
    stop_grace_period: 45s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 1G
          pids: 512
      restart_policy:
        condition: any
        delay: 5s

volumes:
  seemplify-worker-state:
  workspace-worker-state:
  control-state:
