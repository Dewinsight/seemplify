http:
  routers:
    dokploy-dashboard:
      rule: Host(`dokploy.seemplifyai.com`) && PathPrefix(`/`)
      service: dokploy-dashboard
      entryPoints:
        - web
    dokploy-dashboard-secure:
      rule: Host(`dokploy.seemplifyai.com`) && PathPrefix(`/`)
      service: dokploy-dashboard
      entryPoints:
        - websecure
      tls:
        certResolver: letsencrypt
  services:
    dokploy-dashboard:
      loadBalancer:
        servers:
          - url: http://dokploy:3000
        passHostHeader: true
