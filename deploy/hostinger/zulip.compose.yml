name: seemplify-zulip

x-defaults: &defaults
  restart: unless-stopped
  networks:
    - dokploy-network

services:
  database:
    <<: *defaults
    image: zulip/zulip-postgresql:14
    environment:
      POSTGRES_DB: zulip
      POSTGRES_USER: zulip
      POSTGRES_PASSWORD: ${ZULIP_POSTGRES_PASSWORD:?required}
    volumes:
      - zulip_postgres:/var/lib/postgresql/data

  memcached:
    <<: *defaults
    image: memcached:1.6-alpine
    command:
      - sh
      - -euc
      - |
        echo 'mech_list: plain' > "$$SASL_CONF_PATH"
        echo "zulip@$$HOSTNAME:$$MEMCACHED_PASSWORD" > "$$MEMCACHED_SASL_PWDB"
        echo "zulip@localhost:$$MEMCACHED_PASSWORD" >> "$$MEMCACHED_SASL_PWDB"
        exec memcached -S
    environment:
      SASL_CONF_PATH: /home/memcache/memcached.conf
      MEMCACHED_SASL_PWDB: /home/memcache/memcached-sasl-db
      MEMCACHED_PASSWORD: ${ZULIP_MEMCACHED_PASSWORD:?required}

  rabbitmq:
    <<: *defaults
    image: rabbitmq:4.1-alpine
    environment:
      RABBITMQ_DEFAULT_USER: zulip
      RABBITMQ_DEFAULT_PASS: ${ZULIP_RABBITMQ_PASSWORD:?required}
    volumes:
      - zulip_rabbitmq:/var/lib/rabbitmq

  redis:
    <<: *defaults
    image: redis:7.4.10-alpine3.21
    command:
      - sh
      - -euc
      - |
        printf 'requirepass %s\n' "$$REDIS_PASSWORD" > /etc/redis.conf
        exec redis-server /etc/redis.conf
    environment:
      REDIS_PASSWORD: ${ZULIP_REDIS_PASSWORD:?required}
    volumes:
      - zulip_redis:/data

  zulip:
    <<: *defaults
    image: zulip/docker-zulip:11.6-0
    depends_on:
      - database
      - memcached
      - rabbitmq
      - redis
    environment:
      DB_HOST: database
      DB_HOST_PORT: "5432"
      DB_USER: zulip
      SSL_CERTIFICATE_GENERATION: self-signed
      SETTING_MEMCACHED_LOCATION: memcached:11211
      SETTING_RABBITMQ_HOST: rabbitmq
      SETTING_REDIS_HOST: seemplify-zulip-redis-1
      SECRETS_rabbitmq_password: ${ZULIP_RABBITMQ_PASSWORD:?required}
      SECRETS_postgres_password: ${ZULIP_POSTGRES_PASSWORD:?required}
      SECRETS_memcached_password: ${ZULIP_MEMCACHED_PASSWORD:?required}
      SECRETS_redis_password: ${ZULIP_REDIS_PASSWORD:?required}
      SECRETS_secret_key: ${ZULIP_SECRET_KEY:?required}
      SETTING_EXTERNAL_HOST: chat.seemplifyai.com
      SETTING_ZULIP_ADMINISTRATOR: michael.egbo@dewinsight.com
      SETTING_EMAIL_HOST: postfix-relay
      SETTING_EMAIL_HOST_USER: ""
      SETTING_EMAIL_PORT: "25"
      SETTING_EMAIL_USE_SSL: "False"
      SETTING_EMAIL_USE_TLS: "False"
      # Zulip submits SMTP directly and therefore does not receive Postal's
      # seemplifyai.com DKIM signature. Use the Google-managed relay identity
      # explicitly so SPF/DKIM/DMARC remain aligned.
      SETTING_NOREPLY_EMAIL_ADDRESS: no-reply@dewinsight.com
      SETTING_ADD_TOKENS_TO_NOREPLY_ADDRESS: "False"
      ZULIP_AUTH_BACKENDS: GenericOpenIdConnectBackend
      SETTING_SOCIAL_AUTH_OIDC_ENABLED_IDPS: '{"seemplify":{"display_name":"Seemplify","oidc_url":"https://auth.seemplifyai.com","client_id":"zulip","secret":"${OIDC_ZULIP_SECRET}","auto_signup":True}}'
      LOADBALANCER_IPS: 172.16.0.0/12,10.0.0.0/8,192.168.0.0/16
      DISABLE_HTTPS: "true"
      SETTING_ZULIP_ORG_NAME: Seemplify
      SETTING_ZULIP_ORG_ID: seemplify
    volumes:
      - zulip_data:/data
    networks:
      - dokploy-network
      - mail-relay
    ulimits:
      nofile:
        soft: 1000000
        hard: 1048576
    labels:
      - traefik.enable=true
      - traefik.docker.network=dokploy-network
      - traefik.http.routers.seemplify-zulip.rule=Host(`chat.seemplifyai.com`)
      - traefik.http.routers.seemplify-zulip.entrypoints=web
      - traefik.http.routers.seemplify-zulip.service=seemplify-zulip
      - traefik.http.routers.seemplify-zulip-secure.rule=Host(`chat.seemplifyai.com`)
      - traefik.http.routers.seemplify-zulip-secure.entrypoints=websecure
      - traefik.http.routers.seemplify-zulip-secure.service=seemplify-zulip
      - traefik.http.routers.seemplify-zulip-secure.tls=true
      - traefik.http.routers.seemplify-zulip-secure.tls.certresolver=letsencrypt
      - traefik.http.services.seemplify-zulip.loadbalancer.server.port=80

volumes:
  zulip_data:
  zulip_postgres:
  zulip_rabbitmq:
  zulip_redis:

networks:
  dokploy-network:
    external: true
  mail-relay:
    external: true
    name: seemplify-mail_relay_internal
