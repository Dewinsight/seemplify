name: seemplify-extended

x-defaults: &defaults
  restart: unless-stopped
  networks:
    - dokploy-network
  security_opt:
    - no-new-privileges:true

services:
  chatgpt-gateway:
    <<: *defaults
    image: ${CHATGPT_GATEWAY_IMAGE:-seemplify/chatgpt-gateway:hostinger}
    environment:
      NODE_ENV: production
      CHATGPT_GATEWAY_HOST: 0.0.0.0
      CHATGPT_GATEWAY_PORT: "11435"
      CHATGPT_GATEWAY_DATA_DIR: /data
      RECRUITER_CHATGPT_GATEWAY_SECRET: ${CHATGPT_GATEWAY_SHARED_SECRET:?required}
      CHATGPT_GATEWAY_STORAGE_SECRET: ${CHATGPT_GATEWAY_SHARED_SECRET:?required}
      CHATGPT_GATEWAY_SHARED_SECRET: ${CHATGPT_GATEWAY_SHARED_SECRET:?required}
      PLATFORM_AI_USAGE_SINK_URL: http://recruiter-backend:5001/api/internal/ai/v1/chatgpt-usage/events
    volumes:
      - chatgpt_gateway_data:/data
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:11435/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 20s

  experience:
    <<: *defaults
    image: ${EXPERIENCE_IMAGE:-seemplify/experience:hostinger}
    group_add:
      - "0"
    environment:
      HOST: 0.0.0.0
      PORT: "3000"
      PUBLIC_URL: https://experience.seemplifyai.com
      LOCAL_AUTH_ENABLED: "false"
      IDP_ISSUER_URL: https://auth.seemplifyai.com
      OIDC_CLIENT_ID: experience-management
      OIDC_CLIENT_SECRET: ${OIDC_EXPERIENCE_SECRET:?required}
      OIDC_REDIRECT_URI: https://experience.seemplifyai.com/api/auth/oidc/callback
      EXPERIENCE_ADMIN_SSO_SECRET: ${EXPERIENCE_ADMIN_SSO_SECRET:?required}
      IDP_PLATFORM_CONFIGURATION_URL: http://identity-provider:5008
      IDP_PLATFORM_INTEGRATION_HMAC_SECRET_FILE: /run/seemplify/platform-integration-hmac
      SEEMPLIFY_SHARED_AI_URL: http://recruiter-backend:5001
      EXPERIENCE_AI_SHARED_SECRET: ${EXPERIENCE_AI_SHARED_SECRET:?required}
      DATABASE_PROVIDER: postgres
      POSTGRES_HOST: experience-postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DATABASE: seemplify_experience
      POSTGRES_OWNER_USER: seemplify_experience_owner
      POSTGRES_OWNER_PASSWORD: ${EXPERIENCE_POSTGRES_OWNER_PASSWORD:?required}
      POSTGRES_USER: seemplify_experience_app
      POSTGRES_PASSWORD: ${EXPERIENCE_POSTGRES_APP_PASSWORD:?required}
      POSTGRES_SSL: disable
      POSTGRES_SCHEMA_VERSION: "1"
      POSTGRES_RUNTIME_SCHEMA_VERSION: "33"
      ADMIN_EMAIL: michael.egbo@dewinsight.com
      SESSION_SECRET: ${EXPERIENCE_SESSION_SECRET:?required}
      ESIGN_ENCRYPTION_KEY: ${EXPERIENCE_ESIGN_KEY:?required}
      NYLAS_CREDENTIAL_ENCRYPTION_KEY: ${EXPERIENCE_NYLAS_ENCRYPTION_KEY:?required}
      X_CREDENTIAL_ENCRYPTION_KEY: ${EXPERIENCE_X_ENCRYPTION_KEY:?required}
      MAIL_API_BASE_URL: https://mail-control.seemplifyai.com
      MAIL_API_TOKEN: ${MAIL_API_TOKEN:?required}
      MAIL_FROM_EMAIL: no-reply@seemplifyai.com
      MAIL_FROM_NAME: Seemplify Experience
      EMAIL_MODE: send
      SUBSCRIPTION_ENFORCEMENT_ENABLED: "false"
      AI_WORKER_CONCURRENCY: "1"
      KNOWLEDGE_STORAGE_DIR: /app/runtime/knowledge
      KNOWLEDGE_RUNTIME_BASE_URL: http://knowledge-runtime:11540
      KNOWLEDGE_RUNTIME_SHARED_SECRET_FILE: /run/seemplify/knowledge-runtime-hmac
      EXPERIENCE_EMBEDDING_PROVIDER: azure-openai
      EXPERIENCE_EMBEDDING_MODEL: text-embedding-3-large
      EXPERIENCE_EMBEDDING_MODEL_REVISION: f0706db2d8dd64a5f9385fd9ab1713b9083eb881
      EXPERIENCE_EMBEDDING_DTYPE: float32
      EXPERIENCE_EMBEDDING_DIMENSIONS: "3072"
      EXPERIENCE_VECTOR_INDEX_VERSION: azure-text-embedding-3-large-v1
      EXPERIENCE_EMBEDDING_DUAL_WRITE: "false"
      EXPERIENCE_QWEN_ROLLBACK_RETAINED: "false"
    volumes:
      - experience_runtime:/app/runtime
      - /opt/seemplify/secrets/platform-integrations/experience-hmac-secret:/run/seemplify/platform-integration-hmac:ro
      - /opt/seemplify/secrets/knowledge/knowledge-runtime-hmac:/run/seemplify/knowledge-runtime-hmac:ro
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 20s
      timeout: 8s
      retries: 15
      start_period: 60s
    labels:
      - traefik.enable=true
      - traefik.docker.network=dokploy-network
      - traefik.http.routers.seemplify-experience.rule=Host(`experience.seemplifyai.com`)
      - traefik.http.routers.seemplify-experience.entrypoints=web
      - traefik.http.routers.seemplify-experience.service=seemplify-experience
      - traefik.http.routers.seemplify-experience-secure.rule=Host(`experience.seemplifyai.com`)
      - traefik.http.routers.seemplify-experience-secure.entrypoints=websecure
      - traefik.http.routers.seemplify-experience-secure.service=seemplify-experience
      - traefik.http.routers.seemplify-experience-secure.tls=true
      - traefik.http.routers.seemplify-experience-secure.tls.certresolver=letsencrypt
      - traefik.http.services.seemplify-experience.loadbalancer.server.port=3000

  knowledge-runtime:
    <<: *defaults
    image: ${KNOWLEDGE_RUNTIME_IMAGE:-seemplify/knowledge-runtime:hostinger}
    group_add:
      - "0"
    environment:
      KNOWLEDGE_RUNTIME_HOST: 0.0.0.0
      SEEMPLIFY_KNOWLEDGE_RUNTIME_DIR: /runtime
      SEEMPLIFY_KNOWLEDGE_DATA_ROOT: /data
      SEEMPLIFY_KNOWLEDGE_STAGING_DIR: /app/runtime/knowledge
      SEEMPLIFY_KNOWLEDGE_SECRETS_DIR: /run/seemplify/knowledge-secrets
      ARANGO_URL: http://arangodb:8529
      DOCLING_URL: http://knowledge-docling:5001
      CHATGPT_GATEWAY_URL: http://chatgpt-gateway:11435
      AZURE_OPENAI_EMBEDDING_URL: https://pubgegbo-3625-resource.cognitiveservices.azure.com/openai/deployments/text-embedding-3-large/embeddings?api-version=2023-05-15
      EXPERIENCE_EMBEDDING_PROVIDER: azure-openai
      EXPERIENCE_EMBEDDING_MODEL: text-embedding-3-large
      EXPERIENCE_EMBEDDING_MODEL_REVISION: f0706db2d8dd64a5f9385fd9ab1713b9083eb881
      EXPERIENCE_EMBEDDING_DTYPE: float32
      EXPERIENCE_EMBEDDING_DIMENSIONS: "3072"
      EXPERIENCE_VECTOR_INDEX_VERSION: azure-text-embedding-3-large-v1
      EXPERIENCE_EMBEDDING_DUAL_WRITE: "false"
      EXPERIENCE_QWEN_ROLLBACK_RETAINED: "false"
    volumes:
      - experience_runtime:/app/runtime:ro
      - knowledge_runtime_state:/runtime
      - knowledge_runtime_data:/data
      - /opt/seemplify/secrets/knowledge/knowledge-runtime-hmac:/runtime/service-secret:ro
      - /opt/seemplify/secrets/knowledge/arango-app:/run/seemplify/knowledge-secrets/arango-app:ro
      - /opt/seemplify/secrets/knowledge/arango-provisioner:/run/seemplify/knowledge-secrets/arango-provisioner:ro
      - /opt/seemplify/secrets/knowledge/chatgpt-gateway:/run/seemplify/knowledge-secrets/chatgpt-gateway:ro
      - /opt/seemplify/secrets/knowledge/azure-openai-embedding:/run/seemplify/knowledge-secrets/tei-api:ro
      - /opt/seemplify/secrets/knowledge/docling-api:/run/seemplify/knowledge-secrets/docling-api:ro

  knowledge-docling:
    <<: *defaults
    image: quay.io/docling-project/docling-serve-cpu@sha256:cc207e1eb768878456ed98042c5d84fae56af3729a9c03d3e5c8fef393902956
    group_add:
      - "0"
    entrypoint:
      - /bin/sh
      - -ec
    command:
      - >-
        export DOCLING_SERVE_API_KEY="$$(cat /run/seemplify/docling-api)" DOCLING_DEVICE=cpu;
        exec container-entrypoint docling-serve run --host 0.0.0.0 --port 5001
    volumes:
      - /opt/seemplify/secrets/knowledge/docling-api:/run/seemplify/docling-api:ro
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          python -c "import os,urllib.request;
          r=urllib.request.Request('http://127.0.0.1:5001/health',headers={'Authorization':'Bearer '+open('/run/seemplify/docling-api').read().strip(),'X-API-Key':open('/run/seemplify/docling-api').read().strip()});
          raise SystemExit(0 if urllib.request.urlopen(r,timeout=5).status<500 else 1)"
      interval: 20s
      timeout: 10s
      retries: 30
      start_period: 120s

  ai-interview-backend:
    <<: *defaults
    image: ${AI_INTERVIEW_BACKEND_IMAGE:-seemplify/ai-interview-backend:hostinger}
    # The host-owned platform integration secret remains root:root 0640. The
    # application runs as UID/GID 1000, so grant only the root supplemental
    # group needed to read that single bind-mounted file.
    group_add:
      - "0"
    environment:
      NODE_ENV: production
      AI_INTERVIEW_BACKEND_PORT: "5101"
      PORT: "5101"
      AI_INTERVIEW_FRONTEND_URL: https://interview.seemplifyai.com
      CORS_ORIGIN: https://interview.seemplifyai.com
      AI_INTERVIEW_MONGO_URI: mongodb://ai_interview_app:${MONGO_AI_INTERVIEW_PASSWORD:?required}@mongodb:27017/ai-interview?authSource=ai-interview
      AI_INTERVIEW_MONGO_DB: ai-interview
      AI_INTERVIEW_SESSION_SECRET: ${AI_INTERVIEW_SESSION_SECRET:?required}
      SEEMPLIFY_PLATFORM_API_URL: http://recruiter-backend:5001
      SEEMPLIFY_AI_GATEWAY_URL: http://recruiter-backend:5001
      AI_GATEWAY_SERVICE_ID: ai-interview
      AI_GATEWAY_HMAC_SECRET: ${AI_GATEWAY_HMAC_SECRET:?required}
      IDP_PLATFORM_CONFIGURATION_URL: http://identity-provider:5008
      IDP_PLATFORM_INTEGRATION_HMAC_SECRET_FILE: /run/seemplify/platform-integration-hmac
      AI_INTERVIEW_REDIS_HOST: seemplify-shared-redis-1
      AI_INTERVIEW_REDIS_PORT: "6379"
      AI_INTERVIEW_REDIS_PASSWORD: ${REDIS_PASSWORD:?required}
      CV_GLOBAL_DISPATCH_REDIS_URL: redis://:${REDIS_PASSWORD:?required}@seemplify-shared-redis-1:6379/1
      AI_INTERVIEW_CV_QUEUE_ENABLED: "true"
      AI_INTERVIEW_CV_STATUS_TOKEN_SECRET: ${AI_INTERVIEW_STATUS_TOKEN_SECRET:?required}
      MAIL_API_BASE_URL: https://mail-control.seemplifyai.com
      MAIL_API_TOKEN: ${MAIL_API_TOKEN:?required}
      MAIL_FROM_EMAIL: no-reply@seemplifyai.com
      MAIL_FROM_NAME: Seemplify AI Interview
      AI_INTERVIEW_EMAIL_MODE: send
    volumes:
      - /opt/seemplify/secrets/platform-integrations/experience-hmac-secret:/run/seemplify/platform-integration-hmac:ro
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:5101/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 20s
      timeout: 8s
      retries: 15
      start_period: 45s
    labels:
      - traefik.enable=true
      - traefik.docker.network=dokploy-network
      - traefik.http.routers.seemplify-api-interview.rule=Host(`api-interview.seemplifyai.com`)
      - traefik.http.routers.seemplify-api-interview.entrypoints=web
      - traefik.http.routers.seemplify-api-interview.service=seemplify-api-interview
      - traefik.http.routers.seemplify-api-interview-secure.rule=Host(`api-interview.seemplifyai.com`)
      - traefik.http.routers.seemplify-api-interview-secure.entrypoints=websecure
      - traefik.http.routers.seemplify-api-interview-secure.service=seemplify-api-interview
      - traefik.http.routers.seemplify-api-interview-secure.tls=true
      - traefik.http.routers.seemplify-api-interview-secure.tls.certresolver=letsencrypt
      - traefik.http.services.seemplify-api-interview.loadbalancer.server.port=5101

  ai-interview-frontend:
    <<: *defaults
    image: seemplify/ai-interview-frontend:hostinger-20260817-api-origin-fix
    environment:
      NODE_ENV: production
      PORT: "5200"
      HOSTNAME: 0.0.0.0
      NEXT_PUBLIC_API_BASE_URL: https://api-interview.seemplifyai.com
      NEXT_PUBLIC_WS_BASE_URL: wss://api-interview.seemplifyai.com
    labels:
      - traefik.enable=true
      - traefik.docker.network=dokploy-network
      - traefik.http.routers.seemplify-interview.rule=Host(`interview.seemplifyai.com`)
      - traefik.http.routers.seemplify-interview.entrypoints=web
      - traefik.http.routers.seemplify-interview.service=seemplify-interview
      - traefik.http.routers.seemplify-interview-secure.rule=Host(`interview.seemplifyai.com`)
      - traefik.http.routers.seemplify-interview-secure.entrypoints=websecure
      - traefik.http.routers.seemplify-interview-secure.service=seemplify-interview
      - traefik.http.routers.seemplify-interview-secure.tls=true
      - traefik.http.routers.seemplify-interview-secure.tls.certresolver=letsencrypt
      - traefik.http.services.seemplify-interview.loadbalancer.server.port=5200

  marketing:
    <<: *defaults
    image: seemplify/marketing:hostinger
    environment:
      NODE_ENV: production
      PORT: "3001"
      HOSTNAME: 0.0.0.0
    labels:
      - traefik.enable=true
      - traefik.docker.network=dokploy-network
      - traefik.http.routers.seemplify-marketing.rule=Host(`seemplifyai.com`) || Host(`www.seemplifyai.com`)
      - traefik.http.routers.seemplify-marketing.entrypoints=web
      - traefik.http.routers.seemplify-marketing.service=seemplify-marketing
      - traefik.http.routers.seemplify-marketing-secure.rule=Host(`seemplifyai.com`) || Host(`www.seemplifyai.com`)
      - traefik.http.routers.seemplify-marketing-secure.entrypoints=websecure
      - traefik.http.routers.seemplify-marketing-secure.service=seemplify-marketing
      - traefik.http.routers.seemplify-marketing-secure.tls=true
      - traefik.http.routers.seemplify-marketing-secure.tls.certresolver=letsencrypt
      - traefik.http.services.seemplify-marketing.loadbalancer.server.port=3001

volumes:
  chatgpt_gateway_data:
  experience_runtime:
  knowledge_runtime_state:
  knowledge_runtime_data:

networks:
  dokploy-network:
    external: true
